    <div class="q-new hide" id="qPeNew">
      <div class="q-new-r"><input class="nm" placeholder="Tên người làm"><button type="button" class="btn primary">Thêm</button></div>
    </div>
    <div class="q-row">${ICON.cl}<select id="qCl">${opts(state.clients, seed.clientId, "Thêm khách hàng mới…")}</select></div>
    <div class="q-new hide" id="qClNew">

      <button class="btn primary" id="qSave">Lưu</button>
    </div>`;
  document.body.appendChild(host);
  quickEl = host;

  // Bám cạnh khối vừa chọn, hết chỗ thì lật sang trái, luôn nằm trong màn hình.
  const place = () => {
    const w = host.offsetWidth, h = host.offsetHeight;
    let left = rect.right + 12;
    if (left + w > innerWidth - 12) left = rect.left - w - 12;
    if (left < 12) left = Math.max(12, Math.min(innerWidth - w - 12, rect.left));
    host.style.left = left + "px";
    host.style.top = Math.max(12, Math.min(rect.top - 10, innerHeight - h - 12)) + "px";
  };
  place();

  const val = id => { const v = $(id).value; return v === "__new" ? "" : v; };

    title: $("#qTitle").value.trim(), companyId: val("#qCo"),

    put("clients", { name, companyId: val("#qCo") }));

  host.addEventListener("keydown", ev => {
    if (ev.key === "Escape") closeQuick();
    if (ev.key === "Enter" && ev.target.id === "qTitle") { ev.preventDefault(); $("#qSave").click(); }
  });
  setTimeout(() => { $("#qTitle").focus(); document.addEventListener("pointerdown", quickOutside, true); }, 0);
}

/* ---------- lịch nhỏ chọn ngày ---------- */
function renderMiniCal() {
  const first = startOfMonth(state.miniCursor || state.cursor);
  const start = startOfWeek(first), today = new Date();
  const busy = new Set(state.tasks.filter(visible).map(t => t.date));
  let cells = "";
  for (let i = 0; i < 42; i++) {
    const d = addDays(start, i), k = iso(d);
    const cls = [
      d.getMonth() === first.getMonth() ? "" : "out",
      busy.has(k) ? "has" : "",
      holidayOn(k) ? "hol" : "",
      sameDay(d, today) ? "today" : (sameDay(d, state.cursor) ? "sel" : ""),
    ].filter(Boolean).join(" ");
    cells += `<button class="${cls}" data-go="${k}">${d.getDate()}</button>`;
  }

/* ============================== tính lương ============================== */
function payRange() {
  const p = state.pay, a = parseISO(p.anchor);
  if (p.kind === "custom") {
    const f = p.from ? parseISO(p.from) : startOfMonth(a);
    const t = p.to ? parseISO(p.to) : endOfMonth(a);
    return { from: f, to: t, label: `${shortVN(f)} – ${shortVN(t)}/${t.getFullYear()}` };
  }
  if (p.kind === "week") {
    const f = startOfWeek(a), t = addDays(f, 7 * Math.max(1, p.n) - 1);
    return { from: f, to: t, label: `${p.n} tuần · ${shortVN(f)} – ${shortVN(t)}/${t.getFullYear()}` };
  }
  if (p.kind === "month") {
    const f = new Date(a.getFullYear(), a.getMonth(), 1);
    const t = new Date(a.getFullYear(), a.getMonth() + Math.max(1, p.n), 0);
    return { from: f, to: t, label: p.n > 1 ? `${p.n} tháng · ${shortVN(f)} – ${shortVN(t)}/${t.getFullYear()}` : `Tháng ${f.getMonth() + 1}/${f.getFullYear()}` };
  }
  const f = new Date(a.getFullYear(), 0, 1), t = new Date(a.getFullYear() + Math.max(1, p.n) - 1, 11, 31);
  return { from: f, to: t, label: p.n > 1 ? `${f.getFullYear()} – ${t.getFullYear()}` : `Năm ${f.getFullYear()}` };
}
// Số tháng của kỳ, tính theo tỉ lệ ngày: trọn tháng 8 được 1, nửa tháng được 0,5.
function monthsBetween(f, t) {
  let total = 0, cur = new Date(f.getFullYear(), f.getMonth(), 1);
  while (cur <= t) {
    const last = endOfMonth(cur);
    const a = cur > f ? cur : f, b = last < t ? last : t;
    total += (Math.round((b - a) / 864e5) + 1) / last.getDate();
    cur = new Date(cur.getFullYear(), cur.getMonth() + 1, 1);
  }
  return Math.round(total * 1000) / 1000;
}

/* ---- loại ngày, giờ đêm, hệ số ---- */
const PCT = { ot: 1.5, week: 2, hol: 3, night: .3 };   // mức tối thiểu theo luật
/* ---- âm lịch Việt Nam: thuật toán Hồ Ngọc Đức, múi giờ +7 ---- */
const Lunar = (() => {
  const INT = Math.floor, TZ = 7, dr = Math.PI / 180;
  const jdFromDate = (dd, mm, yy) => {
    const a = INT((14 - mm) / 12), y = yy + 4800 - a, m = mm + 12 * a - 3;
    let jd = dd + INT((153 * m + 2) / 5) + 365 * y + INT(y / 4) - INT(y / 100) + INT(y / 400) - 32045;
    if (jd < 2299161) jd = dd + INT((153 * m + 2) / 5) + 365 * y + INT(y / 4) - 32083;
    return jd;
  };
  const jdToDate = jd => {
    let b, c;
    if (jd > 2299160) { const a = jd + 32044; b = INT((4 * a + 3) / 146097); c = a - INT(b * 146097 / 4); }
    else { b = 0; c = jd + 32082; }
    const d = INT((4 * c + 3) / 1461), e = c - INT(1461 * d / 4), m = INT((5 * e + 2) / 153);
    return [e - INT((153 * m + 2) / 5) + 1, m + 3 - 12 * INT(m / 10), b * 100 + d - 4800 + INT(m / 10)];
  };
  const newMoon = k => {
    const T = k / 1236.85, T2 = T * T, T3 = T2 * T;
    let J = 2415020.75933 + 29.53058868 * k + 0.0001178 * T2 - 0.000000155 * T3;
    J += 0.00033 * Math.sin((166.56 + 132.87 * T - 0.009173 * T2) * dr);
    const M = 359.2242 + 29.10535608 * k - 0.0000333 * T2 - 0.00000347 * T3;
    const Mp = 306.0253 + 385.81691806 * k + 0.0107306 * T2 + 0.00001236 * T3;
    const F = 21.2964 + 390.67050646 * k - 0.0016528 * T2 - 0.00000239 * T3;
    let C = (0.1734 - 0.000393 * T) * Math.sin(M * dr) + 0.0021 * Math.sin(2 * dr * M);
    C += -0.4068 * Math.sin(Mp * dr) + 0.0161 * Math.sin(dr * 2 * Mp) - 0.0004 * Math.sin(dr * 3 * Mp);
    C += 0.0104 * Math.sin(dr * 2 * F) - 0.0051 * Math.sin(dr * (M + Mp)) - 0.0074 * Math.sin(dr * (M - Mp));
    C += 0.0004 * Math.sin(dr * (2 * F + M)) - 0.0004 * Math.sin(dr * (2 * F - M)) - 0.0006 * Math.sin(dr * (2 * F + Mp));
    C += 0.0010 * Math.sin(dr * (2 * F - Mp)) + 0.0005 * Math.sin(dr * (2 * Mp + M));
    const dt = T < -11 ? 0.001 + 0.000839 * T + 0.0002261 * T2 - 0.00000845 * T3 - 0.000000081 * T * T3
      : -0.000278 + 0.000265 * T + 0.000262 * T2;
    return J + C - dt;
  };
  const sunLong = jdn => {
    const T = (jdn - 2451545) / 36525, T2 = T * T;
    const M = 357.5291 + 35999.0503 * T - 0.0001559 * T2 - 0.00000048 * T * T2;
    const L0 = 280.46645 + 36000.76983 * T + 0.0003032 * T2;
    let D = (1.9146 - 0.004817 * T - 0.000014 * T2) * Math.sin(dr * M);
    D += (0.019993 - 0.000101 * T) * Math.sin(dr * 2 * M) + 0.00029 * Math.sin(dr * 3 * M);
    const L = (L0 + D) * dr;
    return L - Math.PI * 2 * INT(L / (Math.PI * 2));
  };
  const sunPos = d => INT(sunLong(d - 0.5 - TZ / 24) / Math.PI * 6);
  const nmDay = k => INT(newMoon(k) + 0.5 + TZ / 24);
  const month11 = yy => {
    const k = INT((jdFromDate(31, 12, yy) - 2415021) / 29.530588853);
    const nm = nmDay(k);
    return sunPos(nm) >= 9 ? nmDay(k - 1) : nm;
  };
  const leapOffset = a11 => {
    const k = INT((a11 - 2415021.076998695) / 29.530588853 + 0.5);
    let last, i = 1, arc = sunPos(nmDay(k + i));
    do { last = arc; i++; arc = sunPos(nmDay(k + i)); } while (arc !== last && i < 14);
    return i - 1;
  };
  // Ngày âm ld tháng lm (tháng thường) của năm âm ly → "YYYY-MM-DD" dương lịch.
  const toSolar = (ld, lm, ly) => {
    const a11 = lm < 11 ? month11(ly - 1) : month11(ly);
    const b11 = lm < 11 ? month11(ly) : month11(ly + 1);
    const k = INT(0.5 + (a11 - 2415021.076998695) / 29.530588853);
    let off = lm - 11; if (off < 0) off += 12;
    if (b11 - a11 > 365 && off >= leapOffset(a11)) off += 1;
    const [d, m, y] = jdToDate(nmDay(k + off) + ld - 1);
    return `${y}-${pad(m)}-${pad(d)}`;
  };
  return { toSolar };
})();

/* ---- ngày lễ: quy tắc lặp hằng năm (dương hoặc âm lịch) hoặc một ngày cụ thể ----
   md: "MM-DD" dương lịch hằng năm · lunar: "MM-DD" âm lịch hằng năm
   date: "YYYY-MM-DD" một lần · span: số ngày nghỉ · pre: bắt đầu sớm hơn mấy ngày */
const HOLIDAY_VN = [
  { md: "01-01", name: "Tết Dương lịch" },
  { lunar: "01-01", pre: 1, span: 5, name: "Tết Nguyên đán" },
  { lunar: "03-10", name: "Giỗ Tổ Hùng Vương" },
  { md: "04-30", name: "Ngày Giải phóng miền Nam" },
  { md: "05-01", name: "Ngày Quốc tế Lao động" },
  { md: "09-02", span: 2, name: "Quốc khánh" },
];
function holidayDates(h, y) {
  let start;
  if (h.date) start = h.date;
  else if (h.md) start = `${y}-${h.md}`;
  else if (h.lunar) {
    const [lm, ld] = h.lunar.split("-").map(Number);
    start = iso(addDays(parseISO(Lunar.toSolar(ld, lm, y)), -(h.pre || 0)));
  } else return [];
  const d0 = parseISO(start);
  return Array.from({ length: Math.max(1, h.span || 1) }, (_, i) => iso(addDays(d0, i)));
}
let holCache = {};   // xoá mỗi lần vẽ lại, vì danh sách ngày lễ có thể vừa đổi
function holidaysOfYear(y) {
  if (holCache[y]) return holCache[y];
  const map = new Map();
  state.holidays.forEach(h => {
    // Xét cả năm trước và năm sau vì một kỳ nghỉ có thể vắt qua năm mới.
    (h.date ? [y] : [y - 1, y, y + 1]).forEach(yy => holidayDates(h, yy).forEach(d => {
      if (+d.slice(0, 4) === y && !map.has(d)) map.set(d, h);
    }));
  });
  return (holCache[y] = map);
}
const holidayOn = date => {
  if (!date) return null;
  const h = holidaysOfYear(+date.slice(0, 4)).get(date);
  return h ? { date, name: h.name || "Ngày lễ", rule: h } : null;
};
const holYear = () => state.holYear || state.cursor.getFullYear();
function holRuleText(h) {
  const span = (h.span || 1) > 1 ? ` · nghỉ ${h.span} ngày` : "";
  if (h.lunar) {
    const [m, d] = h.lunar.split("-").map(Number);
    return `Hằng năm · ${d}/${m} âm lịch${h.pre ? `, nghỉ từ ${h.pre} ngày trước` : ""}${span}`;
  }
  if (h.md) { const [m, d] = h.md.split("-").map(Number); return `Hằng năm · ${d}/${m} dương lịch${span}`; }
  return `Một lần${span}`;
}
function holRangeText(ds) {
  if (!ds.length) return "";
  const a = parseISO(ds[0]), b = parseISO(ds[ds.length - 1]);
  return ds.length === 1 ? dateVN(a) : `${shortVN(a)} – ${shortVN(b)}/${b.getFullYear()}`;
}
const DAYNAME = { normal: "Ngày thường", weekend: "Ngày nghỉ tuần", holiday: "Ngày lễ" };

function dayTypeOf(t) {
  if (t.dayType) return t.dayType;                 // bạn chọn tay thì theo bạn
  if (holidayOn(t.date)) return "holiday";
  const d = parseISO(t.date).getDay();
  return d === 0 || d === 6 ? "weekend" : "normal";
}
// Số giờ thực sự nằm trong khung ban đêm 22:00 – 06:00.
function nightHours(t) {
  let s = toMin(t.start), e = toMin(t.end); if (e <= s) e += 1440;
  let n = 0;
  for (let base = -1440; base <= 1440; base += 1440) {
    n += Math.max(0, Math.min(e, base + 30 * 60) - Math.max(s, base + 22 * 60));
  }
  return n / 60;
}
const hourlyOf = c => c.mode === "hour" ? c.rate
  : c.mode === "day" ? c.rate / (c.hpd || 8)
    : c.rate / (22 * (c.hpd || 8));
function multOf(t, c) {
  const k = dayTypeOf(t);
  if (k === "holiday") return c.otHol || PCT.hol;
  if (k === "weekend") return c.otWeek || PCT.week;
  return t.overtime ? (c.ot || PCT.ot) : 1;
}

// Thù lao của một nhiệm vụ. Giờ được nhân hệ số thì trả theo giờ; giờ thường
// của công ty trả theo ngày hoặc theo tháng đã nằm trong lương ngày, lương tháng.
function payOf(t) {
  const c = co(t.companyId), h = dur(t), k = dayTypeOf(t), night = nightHours(t);
  const zero = { baseM: 0, otM: 0, weekM: 0, holidayM: 0, nightM: 0, hourly: 0, nightPct: 0 };
  if (!c) {
    // Chưa gán công ty: chưa có đơn giá nên chưa ra tiền, nhưng giờ tăng ca, ngày nghỉ,
    // ngày lễ và giờ đêm vẫn phải tách đúng loại (theo phần trăm mặc định).
    const mult = multOf(t, {});
    return Object.assign({
      h, k, mult, night, amount: 0, noCo: true,
      base: mult === 1 ? h : 0, otH: mult > 1 && k === "normal" ? h : 0, holH: mult > 1 && k !== "normal" ? h : 0,
      weekH: mult > 1 && k === "weekend" ? h : 0, holidayH: mult > 1 && k === "holiday" ? h : 0,
    }, zero, { nightPct: PCT.night });
  }
  const mult = multOf(t, c), hourly = hourlyOf(c);
  const nightPct = c.otNight === undefined ? PCT.night : c.otNight;
  // Tách từng khoản: giờ thường (chỉ công ty trả theo giờ mới tính ở đây, lương ngày và
  // lương tháng cộng ở bảng lương), giờ nhân hệ số theo loại ngày, phụ cấp giờ đêm.
  const baseM = c.mode === "hour" && mult === 1 ? h * hourly : 0;
  const multM = mult > 1 ? h * hourly * mult : 0;
  const nightM = night * hourly * nightPct;
  return {
    h, k, mult, night, hourly, nightPct,
    base: mult === 1 ? h : 0,
    otH: mult > 1 && k === "normal" ? h : 0,
    holH: mult > 1 && k !== "normal" ? h : 0,
    weekH: mult > 1 && k === "weekend" ? h : 0,
    holidayH: mult > 1 && k === "holiday" ? h : 0,
    baseM, nightM,
    otM: k === "normal" ? multM : 0, weekM: k === "weekend" ? multM : 0, holidayM: k === "holiday" ? multM : 0,
    amount: baseM + multM + nightM,
  };
}

function payrollRows() {
  const { from, to } = payRange();
  const f = iso(from), t = iso(to);
  const sel = state.tasks.filter(x => x.date >= f && x.date <= t && visible(x) && (!state.pay.onlyDone || x.done));
  const key = x => state.pay.group === "person" ? `${x.personId}|${x.companyId}` : `${x.companyId}|${x.personId}`;
  const map = new Map();
  sel.forEach(x => {
    const k = key(x);
    if (!map.has(k)) map.set(k, {
      personId: x.personId, companyId: x.companyId, h: 0, base: 0, otH: 0, holH: 0, weekH: 0, holidayH: 0,
      night: 0, days: new Set(), payDays: new Set(), n: 0, amount: 0,
      baseM: 0, otM: 0, weekM: 0, holidayM: 0, nightM: 0, salaryM: 0,
    });
    const r = map.get(k), p = payOf(x);
    r.h += p.h; r.base += p.base; r.otH += p.otH; r.holH += p.holH; r.night += p.night;
    r.weekH += p.weekH; r.holidayH += p.holidayH;
    r.baseM += p.baseM; r.otM += p.otM; r.weekM += p.weekM; r.holidayM += p.holidayM; r.nightM += p.nightM;
    r.n++; r.days.add(x.date);
    // Chỉ ngày có giờ thường mới được tính một ngày công; ngày chỉ có tăng ca
    // hay ngày lễ đã trả theo giờ rồi, tính thêm ngày công nữa là trả hai lần.
    if (p.base > 0) r.payDays.add(x.date);
    r.amount += p.amount;
  });
  const months = monthsBetween(from, to);
  const rows = Array.from(map.values());
  rows.forEach(r => {
    const c = co(r.companyId);
    if (!c) { r.basis = "Chưa gán công ty"; return; }
    if (c.mode === "hour") { r.basis = `${vnd(c.rate)}/giờ`; }
    else if (c.mode === "day") { r.salaryM = r.payDays.size * c.rate; r.amount += r.salaryM; r.basis = `${vnd(c.rate)}/ngày công`; }
    else {
      // Lương cố định chia đều cho những người có nhiệm vụ ở công ty đó trong kỳ.
      const heads = new Set(rows.filter(o => o.companyId === r.companyId).map(o => o.personId)).size || 1;
      r.salaryM = (c.rate * months) / heads;
      r.amount += r.salaryM;
      r.basis = `${vnd(c.rate)}/tháng` + (months !== 1 ? ` × ${months} tháng` : "") + (heads > 1 ? ` · chia ${heads} người` : "");
    }
  });
  return { rows: rows.sort((a, b) => b.amount - a.amount), from, to, months, count: sel.length, tasks: sel };
}

const whoText = r => String((r && r.appliesTo) || "").trim() || COMMON_WHO;
// Người trong form hồ sơ khi bảng đã có dữ liệu từ trước, giống trang Nhập liệu của bảng tính.
const DEFAULT_SLOTS = [

];
const FTYPES = [["one", "Chọn một"], ["many", "Chọn nhiều"], ["number", "Số"], ["text", "Chữ"], ["bool", "Có / không"]];
const SCOPES = [["case", "Một lần cho cả hồ sơ"], ["person", "Riêng cho từng người"]];
const OPS = {
  one: [["is", "là"], ["not", "không là"], ["in", "là một trong"]],
  many: [["has", "có chọn"], ["lacks", "không chọn"], ["hasAny", "có một trong"]],
  number: [["gte", "≥"], ["gt", ">"], ["lte", "≤"], ["lt", "<"], ["eq", "="], ["between", "trong khoảng"]],

};
const STAGES_DEFAULT = ["Giai đoạn 1", "Giai đoạn 2", "Giai đoạn 3", "Giai đoạn 4", "Giai đoạn 5"];
const isAny = v => !v || v === "*";
const opLabel = (t, op) => ((OPS[t] || []).find(o => o[0] === op) || [op, op])[1];
const multiOp = op => op === "in" || op === "hasAny";
const noValueOp = op => ["filled", "empty", "true", "false"].includes(op);
const asOne = v => (Array.isArray(v) ? v[0] || "" : v == null ? "" : String(v));
const asMany = v => (Array.isArray(v) ? v : v == null || v === "" ? [] : [String(v)]);
const blank = v => v === "" || v == null || (typeof v === "number" && isNaN(v));
const fmtNum = (f, n) => new Intl.NumberFormat("vi-VN").format(Number(n)) + (f && f.unit ? " " + f.unit : "");
const muted = t => `<span style="font-size:12.5px;color:var(--muted)">${t}</span>`;
const cloneCase = c => JSON.parse(JSON.stringify(c));
const maxOrder = () => state.loanRules.reduce((m, r) => Math.max(m, r.order || 0), 0);

// Ba vai trò đặc biệt một cột có thể mang. Không cột nào có sẵn: bạn tạo cột rồi gán vai trò.
const FIXED_COLS = { doc: "Chứng từ cần", stage: "Giai đoạn", who: "Áp dụng cho" };
const ROLE_NAME = { doc: "Tên chứng từ", stage: "Giai đoạn", who: "Áp dụng cho" };

function loanSchema() {
  const d = state.loanConfig.find(x => x.id === "lists") || {};
  const hasData = (Array.isArray(d.fields) && d.fields.length) || state.loanRules.length;
  const valueColors = JSON.parse(JSON.stringify(d.valueColors || {}));
  // Màu giai đoạn kiểu cũ (theo thứ tự giai đoạn) chuyển sang màu theo giá trị.
  if (Array.isArray(d.stageColors) && d.stageColors.length && !valueColors.stage) {
    valueColors.stage = {};
    d.stageColors.forEach((c, i) => { if (c != null) valueColors.stage[String(i + 1)] = { bg: c }; });
  }
  return {
    fields: Array.isArray(d.fields) ? d.fields.map(f => Object.assign({ options: [] }, f)) : [],
    stages: d.stages && d.stages.length ? d.stages.slice() : STAGES_DEFAULT.slice(),
    colNames: Object.assign({}, FIXED_COLS, d.colNames || {}),
    colOrder: Array.isArray(d.colOrder) ? d.colOrder.slice() : null,
    // Bảng chưa có gì thì trống hoàn toàn, mọi cột kể cả cột vai trò đều do bạn tạo.
    // Bảng cũ đã có dữ liệu mà chưa từng xoá cột vai trò thì giữ nguyên như trước.
    removed: Array.isArray(d.removed) ? d.removed.filter(k => k in FIXED_COLS) : (hasData ? [] : Object.keys(FIXED_COLS)),
    removedAt: Object.assign({}, d.removedAt || {}),
    trash: Array.isArray(d.trash) ? d.trash.filter(t => t && t.field) : [],

/* ---- chuyển dữ liệu kiểu cũ (cột cố định) sang kiểu tự định nghĩa ---- */
function migrateLoan() {
  // Mã Áp dụng cho kiểu cũ (common, both…) đổi sang đúng chữ hiện trong bảng.
  state.loanRules.filter(r => Object.prototype.hasOwnProperty.call(LEGACY_WHO, r.appliesTo) && Array.isArray(r.conds))
    .forEach(r => put("loanRules", Object.assign({}, r, { appliesTo: LEGACY_WHO[r.appliesTo] }), true));
  const oldRules = state.loanRules.filter(r => !Array.isArray(r.conds));
  const oldCases = state.loanCases.filter(c => !c.values);
  const d = state.loanConfig.find(x => x.id === "lists");
  const oldCfg = d && !Array.isArray(d.fields);
  if (!oldRules.length && !oldCases.length && !oldCfg) return;
  if (!d || oldCfg) {
    const pick = (a, b) => [...new Set([...(a || []), ...b.filter(v => !isAny(v))])];
    const fields = JSON.parse(JSON.stringify(LOAN_TEMPLATE.fields));
    fields[0].options = pick(d && d.banks, [...oldRules.map(r => r.bank), ...oldCases.map(c => c.bank)]);
    fields[1].options = pick(d && d.purposes, [...oldRules.map(r => r.purpose), ...oldCases.flatMap(c => c.purposes || [])]);
    fields[4].options = pick(d && d.incomes, oldRules.map(r => r.income));
    put("loanConfig", { id: "lists", fields, stages: d && d.stages && d.stages.length ? d.stages : STAGES_DEFAULT.slice() }, true);
  }
  oldRules.forEach(r0 => {
    const { bank, purpose, income, ...r } = r0;
    put("loanRules", Object.assign(r, { match: "all", conds: legacyConds(bank, purpose, income, r0.appliesTo), appliesTo: LEGACY_WHO[r0.appliesTo] || r0.appliesTo || "" }), true);
  });
  oldCases.forEach(c0 => {
    const c = cloneCase(c0);
    c.values = { bank: c.bank || "", purpose: c.purposes || [], amount: c.amount || "", dep: !!c.hasDependents };
    ["bank", "purposes", "amount", "hasDependents"].forEach(k => delete c[k]);
    [...(c.borrowers || []), c.guarantor].forEach(p => { if (p) { p.values = { income: p.incomes || [] }; delete p.incomes; } });
    put("loanCases", c, true);
  });
}

/* ---- đánh giá điều kiện và tính danh sách chứng từ ---- */
function testCond(cd, val, f) {
  const v = cd.value;
  switch (f.type) {
    case "one": {
      const x = asOne(val);
      if (cd.op === "is") return !!x && x === asOne(v);
      if (cd.op === "not") return x !== asOne(v);
      if (cd.op === "in") return asMany(v).includes(x);
      return false;
    }
    case "many": {
      const arr = asMany(val);
      if (cd.op === "has") return arr.includes(asOne(v));
      if (cd.op === "lacks") return !arr.includes(asOne(v));
      if (cd.op === "hasAny") return asMany(v).some(x => arr.includes(x));
      return false;
    }
    case "number": {
      if (blank(val) || isNaN(Number(val))) return false;
      const n = Number(val);
      if (cd.op === "between") {
        const [a, b] = Array.isArray(v) ? v : ["", ""];
        return (blank(a) || n >= Number(a)) && (blank(b) || n <= Number(b));
      }
      if (blank(v)) return false;
      const a = Number(v);
      return { gte: n >= a, gt: n > a, lte: n <= a, lt: n < a, eq: n === a }[cd.op] || false;
    }
    case "text": {
      const s = asOne(val).trim().toLowerCase(), t = asOne(v).trim().toLowerCase();
      if (cd.op === "filled") return !!s;
      if (cd.op === "empty") return !s;
      if (cd.op === "contains") return !!t && s.includes(t);
      if (cd.op === "equals") return s === t;
      return false;
    }
    case "bool": return cd.op === "true" ? !!val : !val;
  }
  return false;
}
// Mỗi hồ sơ lưu người theo mã của ô trong form. Hồ sơ cũ (borrowers, guarantor) vẫn đọc được.
function slotGet(c, k) {
  if (c.people && c.people[k]) return c.people[k];
  const legacy = k === "g" ? c.guarantor : /^b\d$/.test(k) ? (c.borrowers || [])[Number(k.slice(1))] : null;
  return legacy || {};
}
function slotSet(c, k, patch) {
  c.people = Object.assign({}, c.people);
  c.people[k] = Object.assign({ name: "", values: {} }, slotGet(c, k), patch);
}
function loanPeople(c, sc0) {
  return (sc0 || loanSchema()).slots.map(sl => ({ sl, s: slotGet(c, sl.id) }))
    .filter(x => (x.s.name || "").trim())
    .map(x => ({ key: x.sl.id, label: x.sl.label, who: x.sl.who, name: x.s.name.trim(), values: x.s.values || {} }));
}
// Mọi giá trị Áp dụng cho đang có: trong bảng rules và trong cấu hình người.
function whoValues(sc0) {
  const sc = sc0 || loanSchema(), out = [], seen = new Set();
  const add = v => { const t = String(v || "").trim(), k = nrm(t); if (t && !seen.has(k)) { seen.add(k); out.push(t); } };
  if (!sc.removed.includes("who")) state.loanRules.slice().sort((a, b) => (a.order || 0) - (b.order || 0)).forEach(r => add(whoText(r)));
  sc.slots.forEach(sl => sl.who.forEach(add));
  return out;
}
const personSummary = (p, fields) => fields.filter(f => f.scope === "person")
  .map(f => valueText(f, p.values[f.id])).filter(Boolean).join(" · ");
const caseSummary = (c, fields) => fields.filter(f => f.scope !== "person").map(f => {
  const t = valueText(f, (c.values || {})[f.id]);
  return t && f.type === "number" ? `${f.label} ${t}` : t;
}).filter(Boolean).join(" · ");

function loanChecklist(c) {
  const sc = loanSchema(), fmap = new Map(sc.fields.map(f => [f.id, f])), people = loanPeople(c, sc);
  const has = k => !sc.removed.includes(k);
  if (!has("doc")) return [];   // không có cột chứng từ thì không có gì để liệt kê
  // Trường "từng người": với nhóm của một người thì xét người đó; với hồ sơ chung
  // hay người phụ thuộc thì đúng khi có ít nhất một người thoả.
  const matches = (r, person) => {
    const conds = (r.conds || []).filter(x => x.field);
    if (!conds.length) return true;
    const res = conds.map(cd => {
      const f = fmap.get(cd.field);
      if (!f) return true;   // cột đã xoá: bỏ qua điều kiện, như bảng tính không có cột đó
      if (f.scope === "person") return person ? testCond(cd, person.values[f.id], f) : people.some(p => testCond(cd, p.values[f.id], f));
      return testCond(cd, (c.values || {})[f.id], f);
    });
    return r.match === "any" ? res.some(Boolean) : res.every(Boolean);
  };
  const rules = state.loanRules.slice().sort((a, b) => (a.order || 0) - (b.order || 0));
  const valueOf = r => (sc.removed.includes("who") ? COMMON_WHO : whoText(r));
  // Giá trị thuộc về người nào thì chứng từ nằm dưới tên người đó. Giá trị không
  // thuộc về ai (Hồ sơ chung, Người phụ thuộc…) thành một mục riêng của hồ sơ.
  const claimed = new Set(sc.slots.flatMap(sl => sl.who.map(nrm)));
  const own = [];
  rules.forEach(r => { const v = valueOf(r); if (!claimed.has(nrm(v)) && !own.some(x => nrm(x) === nrm(v))) own.push(v); });
  const ownKey = v => (nrm(v) === nrm(COMMON_WHO) ? "common" : nrm(v) === "người phụ thuộc" ? "dep" : "v:" + nrm(v));
  const ownGroup = v => ({ key: ownKey(v), title: v, sub: "", test: x => x === nrm(v), person: null });
  const groups = [
    ...own.filter(v => nrm(v) === nrm(COMMON_WHO)).map(ownGroup),
    ...people.map(p => ({ key: p.key, title: `${p.label} · ${p.name}`, sub: personSummary(p, sc.fields), test: x => p.who.some(w => nrm(w) === x), person: p })),
    ...own.filter(v => nrm(v) !== nrm(COMMON_WHO)).map(ownGroup),
  ];

  const stages = new Map();
  groups.forEach(g => {
    const seen = new Set();   // cùng một chứng từ khớp nhiều rule thì chỉ ghi một lần
    // Không có cột Áp dụng cho: tính cho cả hồ sơ. Không có cột Giai đoạn: gộp một danh sách.
    rules.filter(r => (r.doc || "").trim() && g.test(nrm(valueOf(r))) && matches(r, g.person)).forEach(r => {
      const st = has("stage") ? Math.max(1, Number(r.stage) || 1) : 1, doc = r.doc.trim(), k = st + "|" + doc.toLowerCase();
      if (seen.has(k)) return;
      seen.add(k);
      if (!stages.has(st)) stages.set(st, new Map());
      const byG = stages.get(st);
      if (!byG.has(g.key)) byG.set(g.key, { group: g, docs: [] });
      byG.get(g.key).docs.push({ rule: r, key: `${g.key}|${st}|${doc}` });
    });
  });
  return [...stages.entries()].sort((a, b) => a[0] - b[0])
    .map(([stage, byG]) => ({ stage, groups: groups.filter(g => byG.has(g.key)).map(g => byG.get(g.key)) }));
}

// Vị trí để đặt lại một cột: ngay sau cột gần nhất bên trái lúc xoá mà hiện vẫn còn.
function posFromSnap(order, snap, key) {
  if (!Array.isArray(snap)) return order.length;
  for (let j = snap.indexOf(key) - 1; j >= 0; j--) {
    const at = order.indexOf(snap[j]);
    if (at >= 0) return at + 1;
  }
  return 0;
}
function restoreField(fid, index) {
  const sc = loanSchema(), t = sc.trash.find(x => x.field.id === fid);

  sc.trash = sc.trash.filter(x => x.field.id !== fid);
  sc.fields.push(t.field);
  order.splice(index < 0 ? posFromSnap(order, t.snap, key) : Math.max(0, Math.min(index, order.length)), 0, key);

function fieldToRole(fid, role) {
  const sc = loanSchema(), f = sc.fields.find(x => x.id === fid);
  if (!f || !sc.removed.includes(role)) return;
  const order = sheetCols(sc).map(c => c.key), at = order.indexOf("f:" + fid);

    const cd = (r0.conds || []).find(x => x.field === fid), r = JSON.parse(JSON.stringify(r0));
    r.conds = (r.conds || []).filter(x => x.field !== fid);
    applyCell(r, role, cellText(cd));
    put("loanRules", r, true);
  });
  if (sc.valueColors["f:" + fid]) { sc.valueColors[role] = sc.valueColors["f:" + fid]; delete sc.valueColors["f:" + fid]; }
  if (sc.colBold["f:" + fid]) { sc.colBold[role] = true; delete sc.colBold["f:" + fid]; }
  sc.fields = sc.fields.filter(x => x.id !== fid);
  sc.removed = sc.removed.filter(k => k !== role);

  order[at] = role;

function roleToField(role) {

function renameOption(fid, oldV, newV) {
  const swap = v => (Array.isArray(v) ? v.map(x => (x === oldV ? newV : x)) : v === oldV ? newV : v);
  const has = v => (Array.isArray(v) ? v.includes(oldV) : v === oldV);
  state.loanRules.forEach(r => {
    if (!(r.conds || []).some(cd => cd.field === fid && has(cd.value))) return;
    put("loanRules", Object.assign({}, r, { conds: r.conds.map(cd => (cd.field === fid ? Object.assign({}, cd, { value: swap(cd.value) }) : cd)) }), true);
  });
  state.loanCases.forEach(c0 => {
    const c = cloneCase(c0);
    let changed = false;
    [c.values, ...(c.borrowers || []).map(b => b && b.values), c.guarantor && c.guarantor.values, ...Object.values(c.people || {}).map(x => x && x.values)].forEach(vals => {
      if (vals && has(vals[fid])) { vals[fid] = swap(vals[fid]); changed = true; }
    });
    if (changed) put("loanCases", c, true);
  });
}

  }
  if (el.dataset.colname) {
    const sc = loanSchema(), key = el.dataset.colname, v = el.value.trim();
    if (key in FIXED_COLS) {
      if (!v) { el.value = sc.colNames[key]; return true; }
      sc.colNames[key] = v; saveSchema(sc);
      return true;
    }
    const f = sc.fields.find(x => "f:" + x.id === key);
    if (!f) return true;
    if (!v) { el.value = f.label; return true; }
    f.label = v; saveSchema(sc);
    return true;
  }
  if (el.dataset.cmBold !== undefined) {
    const sc = loanSchema(), key = el.closest("#colMenu").dataset.key;
    if (el.checked) sc.colBold[key] = true; else delete sc.colBold[key];
    saveSchema(sc); rerenderGrid();
    return true;
  }
  if (el.dataset.cm === "role") {
    const key = el.closest("#colMenu").dataset.key, to = el.value;
    closeColMenu();
    if (key.startsWith("f:")) { if (to !== "cond") fieldToRole(key.slice(2), to); }
    else if (to === "cond") roleToField(key);
    else { const id = roleToField(key); if (id) fieldToRole(id, to); }
    navRender();
    return true;
  }

  // trường thông tin
  if (el.dataset.fe) {
    const id = el.closest(".fld").dataset.fid, sc = loanSchema(), f = sc.fields.find(x => x.id === id);
    if (!f) return true;
    const k = el.dataset.fe;
    if (k === "label") { const v = el.value.trim(); if (!v) { el.value = f.label; return true; } f.label = v; saveSchema(sc); return true; }
    if (k === "unit") { f.unit = el.value.trim(); saveSchema(sc); return true; }
    if (k === "scope") { f.scope = el.value; saveSchema(sc); return true; }
    if (k === "type") { retypeField(id, el.value); el.blur(); render(); return true; }
  }
  if (el.dataset.fo !== undefined) {
    const id = el.closest(".fld").dataset.fid, sc = loanSchema(), f = sc.fields.find(x => x.id === id), j = Number(el.dataset.fo);
    if (!f) return true;
    const old = f.options[j], nv = el.value.trim();
    if (!nv || nv === old || f.options.includes(nv)) { el.value = old; return true; }
    f.options[j] = nv; saveSchema(sc); renameOption(id, old, nv);
    return true;
  }
  if (el.dataset.stage !== undefined) {
    const sc = loanSchema(), i = Number(el.dataset.stage), v = el.value.trim();
    if (!v) { el.value = sc.stages[i]; return true; }
    sc.stages[i] = v; saveSchema(sc);
    return true;
  }
  return false;
}

// Giai đoạn trong hồ sơ: nhớ đang mở hay thu gọn để lúc tick chứng từ, danh sách vẽ lại vẫn giữ nguyên.
document.addEventListener("toggle", e => {
  const d = e.target;
  if (!d.dataset || !d.dataset.stagecard) return;
  state.stageOpen = Object.assign({}, state.stageOpen, { [d.dataset.stagecard]: d.open });
}, true);
// Enter / mũi tên lên xuống để đi giữa các dòng, như bảng tính.
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("#palette")) { closePalette(); return; }
  if (e.key === "Escape" && state.colMenu) { closeColMenu(); return; }
  const el = e.target;
  if (state.view !== "loan" || !el.dataset || !el.dataset.cell) return;
  const vert = e.key === "Enter" || (el.tagName === "INPUT" && (e.key === "ArrowDown" || e.key === "ArrowUp"));
  if (!vert) return;
  const up = e.key === "ArrowUp" || (e.key === "Enter" && e.shiftKey);
  const tr = el.closest("tr"), next = up ? tr.previousElementSibling : tr.nextElementSibling;
  const t = next && next.querySelector(`[data-cell="${el.dataset.cell}"]`);
  e.preventDefault();
  if (t) { t.focus(); if (t.select) t.select(); } else el.blur();
});
// Dán nhiều ô copy từ Google Sheet: rải vào bảng từ ô đang chọn, thêm dòng khi cần.
document.addEventListener("paste", e => {
  const el = e.target;
  if (state.view !== "loan" || !el.dataset || !el.dataset.cell || !el.closest("#sheetBody")) return;
  const txt = ((e.clipboardData || window.clipboardData).getData("text") || "").replace(/\r/g, "").replace(/\n+$/, "");
  if (!/[\t\n]/.test(txt)) return;   // chỉ một ô: để trình duyệt dán bình thường
  e.preventDefault();
  const lines = parseTSV(txt);
  // Có dòng tiêu đề: ghép theo tên cột thay vì theo vị trí ô đang đứng.
  if (lines.length && looksLikeHeader(lines[0])) { el.blur(); openImport(txt, (e.clipboardData || window.clipboardData).getData("text/html") || ""); return; }
  const keys = sheetCols().map(c => c.key);
  const start = keys.indexOf(el.dataset.cell);
  const rows = sheetRules(), tr = el.closest("tr");
  let at = tr.dataset.row === "new" ? rows.length : rows.findIndex(r => r.id === tr.dataset.row);
  lines.forEach((vals, i) => {
    let r = rows[at + i] ? JSON.parse(JSON.stringify(rows[at + i])) : newRule();
    vals.forEach((v, j) => { if (keys[start + j]) r = applyCell(r, keys[start + j], v); });
    put("loanRules", r, true);
  });
  el.blur(); rerenderGrid();
});
document.addEventListener("scroll", e => {
  if (e.target && e.target.closest && e.target.closest("#colMenu, #palette")) return;
  closePalette();
  if (state.colMenu) closeColMenu();
}, true);
document.addEventListener("keydown", e => {

  if (e.target.matches("[data-optadd], [data-slotwhoadd]")) { e.preventDefault(); e.target.blur(); }
});

            <option value="week">Mỗi tuần, cùng thứ</option>
          </select></div>
          <div class="f"><label>Số buổi</label><input type="number" id="tRepN" min="1" max="60" value="5" disabled></div>
        </div>` : ""}
        <label class="chk" style="font-size:13.5px"><input type="checkbox" id="tDone" ${t.done ? "checked" : ""}>Đã hoàn thành</label>
      </div>
      <div class="modal-f">
        ${isNew ? `<span></span>` : `<button class="btn danger" id="mDel">Xoá nhiệm vụ</button>`}
        <button class="btn primary" id="mSave">${isNew ? "Tạo nhiệm vụ" : "Lưu thay đổi"}</button>
      </div>
    </div>
  </div>`;

  const upd = () => {
    const sv = $("#tStart").value, evv = $("#tEnd").value;
    if (!sv || !evv) return;
    const h = dur({ start: sv, end: evv });
    $("#tDur").textContent = fmtH(h);
    const overnight = toMin(evv) <= toMin(sv);
    $("#tDurTxt").textContent = overnight ? "Kết thúc sang ngày hôm sau"
      : h > 8 ? "Dài hơn một ca chuẩn tám tiếng" : "Thời gian làm việc";

    const hints = [];
    const pid = $("#tPe").value, date = $("#tDate").value;
    if (pid && pid !== "__new" && date) {
      const s0 = toMin(sv); let e0 = toMin(evv); if (e0 <= s0) e0 += 1440;
      const clash = state.tasks.filter(x => x.id !== t.id && x.date === date && x.personId === pid)
        .filter(x => { let a = toMin(x.start), b = toMin(x.end); if (b <= a) b += 1440; return a < e0 && s0 < b; });
      if (clash.length) hints.push(["", `Trùng giờ với ${clash.map(x => esc(x.title || "nhiệm vụ") + ` ${x.start}–${x.end}`).join(", ")}. Phần giờ trùng sẽ bị cộng hai lần khi tính lương.`]);
    }
    // Loại ngày và phần trăm đang áp dụng
    const cid = $("#tCo").value;
    const probe = { date, start: sv, end: evv, overtime: $("#tOt").checked, dayType: $("#tDay").value };
    const kind = dayTypeOf(probe), nh = nightHours(probe);
    const cc = cid && cid !== "__new" ? co(cid) : null;
    if (cc) {
      const m = Math.round(multOf(probe, cc) * 100);
      const np = Math.round((cc.otNight === undefined ? PCT.night : cc.otNight) * 100);
      const hol = holidayOn(date);
      let msg = `${DAYNAME[kind]}${hol && !probe.dayType ? ` · ${esc(hol.name)}` : ""} · trả ${m}% lương giờ`;
      if (nh) msg += `, trong đó ${fmtH(nh)} ban đêm được cộng thêm ${np}%`;
      hints.push([m > 100 || nh ? "" : "mild", msg]);
    } else hints.push(["mild", "Chưa gán công ty nên nhiệm vụ này chỉ cộng giờ, không ra tiền."]);
    $("#tHints").innerHTML = hints.map(([k, m]) => `<div class="hint-note ${k}">${m}</div>`).join("");
  };

  // Dời giờ bắt đầu thì giữ nguyên thời lượng, giống Google.
  let lastStart = $("#tStart").value;
  $("#tStart").addEventListener("change", () => {
    const ns = $("#tStart").value;
    if (ns) {
      const os = toMin(lastStart);
      let e0 = toMin($("#tEnd").value); if (e0 <= os) e0 += 1440;
      $("#tEnd").value = fromMin((toMin(ns) + (e0 - os)) % 1440);
      lastStart = ns;
    }
    upd();
  });
  $("#tEnd").addEventListener("change", upd);
  $("#tStart").addEventListener("input", upd);
  $("#tEnd").addEventListener("input", upd);
  ["tDate", "tPe", "tCo", "tDay", "tOt"].forEach(id => $("#" + id).addEventListener("change", upd));
  $("#tQuick").addEventListener("click", e => {
    const b = e.target.closest("[data-h]"); if (!b) return;
    $("#tEnd").value = fromMin((toMin($("#tStart").value) + Math.round(Number(b.dataset.h) * 60)) % 1440);
    lastStart = $("#tStart").value;
    upd();
  });
  $("#tOt").addEventListener("change", e => $("#tNoteWrap").classList.toggle("hide", !e.target.checked));
  if (isNew) $("#tRep").addEventListener("change", e => { $("#tRepN").disabled = !e.target.value; });
  upd();
  setTimeout(() => $("#tTitle").focus(), 30);

  // Thêm thẳng công ty / khách hàng / người làm ngay trong hộp thoại,
  // khỏi phải rời sang màn hình Thiết lập.
  const refill = (sel, coll, label, keep) => {
    sel.innerHTML = `<option value="">— chưa gán —</option>` +
      state[coll].map(o => `<option value="${o.id}">${esc(o.name)}</option>`).join("") +
      `<option value="__new">+ ${label}</option>`;
    sel.value = keep || "";
  };
  const wire = (selId, boxId, create) => {
    const sel = $("#" + selId), box = $("#" + boxId);
    sel.addEventListener("change", () => {
      const open = sel.value === "__new";
      box.classList.toggle("hide", !open);
      if (open) $("input.nm", box).focus();
    });
    const go = () => {
      const nm = $("input.nm", box);
      if (!nm.value.trim()) return nm.focus();
      create(box, nm.value.trim());
      box.classList.add("hide");
      $$("input", box).forEach(i => { i.value = ""; });
    };
    $("button", box).addEventListener("click", go);
    $$("input", box).forEach(i => i.addEventListener("keydown", ev => {
      if (ev.key === "Enter") { ev.preventDefault(); go(); }
    }));
  };

  wire("tCo", "coNew", (box, name) => {
    const o = put("companies", {
      name, mode: $("select", box).value, rate: Number($("input.rate", box).value) || 0,
      ot: 1.5, hpd: 8, color: PALETTE[state.companies.length % PALETTE.length],
    });
    refill($("#tCo"), "companies", "Thêm công ty mới…", o.id);
  });
  wire("tCl", "clNew", (box, name) => {
    const cur = $("#tCo").value;
    const o = put("clients", { name, companyId: cur === "__new" ? "" : cur });
    refill($("#tCl"), "clients", "Thêm khách hàng mới…", o.id);
  });
  wire("tPe", "peNew", (box, name) => {
    const o = put("people", { name, color: PALETTE[(state.people.length + 2) % PALETTE.length] });
    refill($("#tPe"), "people", "Thêm người làm mới…", o.id);
  });

  const close = () => { host.innerHTML = ""; };
  $("#mClose").onclick = close;   // đóng bằng dấu X, phím Esc hoặc bấm ra ngoài
  $("#scrim").onclick = e => { if (e.target.id === "scrim") close(); };
  document.addEventListener("keydown", function onEsc(e) {
    if (e.key === "Escape") { close(); document.removeEventListener("keydown", onEsc); }
  });
  if (!isNew) $("#mDel").onclick = () => {
    askConfirm("Xoá nhiệm vụ", `Xoá "${t.title || "nhiệm vụ"}" ngày ${t.date}? Không lấy lại được.`, "Xoá nhiệm vụ")
      .then(ok => { if (ok) { drop("tasks", t.id); close(); } });
  };
  $("#mSave").onclick = () => {
    const ot = $("#tOt").checked;
    const pick = id => { const v = $(id).value; return v === "__new" ? "" : v; };
    const base = Object.assign({}, t, {
      title: $("#tTitle").value.trim() || "Nhiệm vụ",
      date: $("#tDate").value, start: $("#tStart").value, end: $("#tEnd").value,
      companyId: pick("#tCo"), clientId: pick("#tCl"), personId: pick("#tPe"),
      desc: $("#tDesc").value.trim(), overtime: ot, note: ot ? $("#tNote").value.trim() : "",
      dayType: $("#tDay").value, done: $("#tDone").checked,
    });
    const rep = isNew ? $("#tRep").value : "";
    const want = rep ? Math.max(1, Math.min(60, Number($("#tRepN").value) || 1)) : 1;
    let d0 = parseISO(base.date), made = 0, guard = 0;
    while (made < want && guard++ < 500) {
      if (rep !== "wday" || (d0.getDay() >= 1 && d0.getDay() <= 5)) {
        put("tasks", Object.assign({}, base, { id: made === 0 ? t.id : undefined, date: iso(d0) }));
        made++;
      }
      if (!rep) break;
      d0 = addDays(d0, rep === "week" ? 7 : 1);
    }
    close();
  };
}

/* ---- hộp xác nhận riêng: confirm() của trình duyệt bị chặn trong khung nhúng ----
   Hai nút dưới đây khai kiểu thẳng trong thẻ, không dùng lớp .btn hay .modal-f,
   để không quy tắc nào trong bảng kiểu chạm tới được. flex:1 1 0 cho hai nút
   rộng đúng bằng nhau và luôn nằm trong hàng, dù bảng kiểu có ra sao. */
const ASKBTN = "flex:1 1 0;min-width:0;width:auto;padding:9px 14px;border-radius:999px;" +
  "border:1px solid;font:inherit;font-size:13.5px;font-weight:500;line-height:1.3;" +
  "cursor:pointer;white-space:nowrap;overflow:hidden;text-align:center;";
function askConfirm(title, body, okLabel) {
  return new Promise(resolve => {
    const host = document.createElement("div");
    host.innerHTML = `<div class="scrim" data-ask>
      <div class="modal" style="width:min(430px,100%)" role="alertdialog" aria-modal="true">
        <div class="modal-h"><h2>${esc(title)}</h2></div>
        <div class="modal-b"><p style="margin:0;font-size:13.5px;line-height:1.6;color:var(--ink-2)">${esc(body)}</p></div>
        <div style="display:flex;gap:10px;padding:14px 22px;border-top:1px solid var(--line)">
          <button type="button" data-no style="${ASKBTN}background:var(--surface);border-color:var(--line-2);color:var(--ink-2)">Giữ lại</button>
          <button type="button" data-yes style="${ASKBTN}background:var(--ot-soft);border-color:var(--ot-line);color:var(--ot)">${esc(okLabel)}</button>
        </div>
      </div></div>`;
    document.body.appendChild(host);
    const done = v => { host.remove(); document.removeEventListener("keydown", onKey); resolve(v); };
    function onKey(e) { if (e.key === "Escape") done(false); }
    document.addEventListener("keydown", onKey);
    host.querySelector("[data-no]").onclick = () => done(false);
    host.querySelector("[data-yes]").onclick = () => done(true);
    host.querySelector("[data-ask]").onclick = e => { if (e.target.hasAttribute("data-ask")) done(false); };
    setTimeout(() => host.querySelector("[data-yes]").focus(), 30);
  });
}

/* ---- xem nhanh việc của một người / công ty / khách hàng ---- */
function openPeek(kind, id) {
  const d = state.cursor;
  const name = kind === "person" ? peName(id) : kind === "company" ? coName(id) : (cl(id) || {}).name || "Khách hàng";
  const field = kind === "person" ? "personId" : kind === "company" ? "companyId" : "clientId";
  const day = state.tasks.filter(t => t[field] === id && t.date === iso(d)).sort((a, b) => toMin(a.start) - toMin(b.start));
  const { from, to } = payRange();
  const period = state.tasks.filter(t => t[field] === id && t.date >= iso(from) && t.date <= iso(to));
  const h = day.reduce((s, t) => s + dur(t), 0);
  const ph = period.reduce((s, t) => s + dur(t), 0);
  const pm = period.reduce((s, t) => s + payOf(t).amount, 0);
  $("#modalHost").innerHTML = `
  <div class="scrim" id="scrim"><div class="modal" style="width:min(660px,100%)" role="dialog" aria-modal="true">
    <div class="modal-h"><h2>${esc(name)}</h2><div class="spacer" style="flex:1"></div>
      <button class="btn icon ghost" id="mCancel" aria-label="Đóng"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="modal-b">
      <div class="tiles">
        <div class="tile hero"><div class="lbl">Giờ trong ngày</div><div class="v">${fmtH(h)}</div><div class="sub">${dateVN(d)}</div></div>
        <div class="tile"><div class="lbl">Giờ trong kỳ</div><div class="v">${fmtH(ph)}</div><div class="sub">${period.length} nhiệm vụ</div></div>
        <div class="tile"><div class="lbl">Thù lao kỳ</div><div class="v" style="font-size:18px">${vnd(pm)}</div><div class="sub">Theo kỳ đang chọn</div></div>
      </div>
      <div>
        <div class="lbl" style="margin-bottom:6px">Nhiệm vụ ngày ${shortVN(d)}</div>
        ${day.length ? `<div class="daylist">${day.map(rowHTML).join("")}</div>`
      : `<div class="empty"><b>Không có nhiệm vụ nào trong ngày này.</b>Đổi ngày ở màn hình Lịch rồi mở lại.</div>`}
      </div>
    </div>
    <div class="modal-f"><span></span><button class="btn primary" id="mClose2">Đóng</button></div>
  </div></div>`;
  const close = () => { $("#modalHost").innerHTML = ""; };
  $("#mCancel").onclick = close; $("#mClose2").onclick = close;
  $("#scrim").onclick = e => { if (e.target.id === "scrim") close(); };
}

document.addEventListener("click", e => {
  if (swallowClick) { swallowClick = false; return; }   // vừa kéo xong, bỏ qua cú click theo sau

  if (loanClick(e)) return;

  const hy = e.target.closest("[data-holyear]");
  if (hy) { state.holYear = holYear() + Number(hy.dataset.holyear); render(); return; }

  const go = e.target.closest("[data-go]");
  if (go) {
    state.cursor = parseISO(go.dataset.go);
    state.miniCursor = startOfMonth(state.cursor);
    if (state.view === "cal" && state.calMode === "month") state.calMode = "day";
    savePrefs(); render(); return;
  }
  const mc = e.target.closest("[data-mc]");
  if (mc) {
    const b = startOfMonth(state.miniCursor || state.cursor);
    state.miniCursor = new Date(b.getFullYear(), b.getMonth() + Number(mc.dataset.mc), 1);
    renderMiniCal(); return;
  }

  const ev = e.target.closest("[data-task]");
  if (ev) { const t = state.tasks.find(x => x.id === ev.dataset.task); if (t) openTask(Object.assign({}, t)); return; }
  const slot = e.target.closest(".slot");
  if (slot) {
    const date = slot.closest(".daycol").dataset.date, m = Number(slot.dataset.min);
    openTask({ date, start: fromMin(m), end: fromMin(m + 60), personId: state.me });
    return;
  }
  const more = e.target.closest("[data-day]");
  if (more) { state.cursor = parseISO(more.dataset.day); state.calMode = "week"; savePrefs(); render(); return; }
  const cell = e.target.closest(".mcell");
  if (cell && state.view === "cal" && state.calMode === "month" && !e.target.closest("button")) {
    pending = null; clearGhost();
    openQuick({ date: cell.dataset.date, start: "09:00", end: "17:00" }, cell.getBoundingClientRect());
    return;
  }
  const peek = e.target.closest("[data-peek]");
  if (peek) { const [k, id] = peek.dataset.peek.split(":"); openPeek(k, id); return; }

  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.editco) openCompany(Object.assign({}, co(b.dataset.editco)));
  if (b.dataset.delco) {
    const id = b.dataset.delco;
    askConfirm("Xoá công ty " + coName(id), "Nhiệm vụ cũ của công ty này vẫn còn nhưng mất phần gán công ty, nên không tính ra tiền nữa.", "Xoá công ty")
      .then(ok => { if (ok) drop("companies", id); });
  }
  if (b.dataset.editpe) openPerson(Object.assign({}, pe(b.dataset.editpe)));
  if (b.dataset.delpe) {
    const id = b.dataset.delpe;
    askConfirm("Xoá " + peName(id), "Nhiệm vụ đã gán cho người này sẽ không còn tên người làm.", "Xoá người")
      .then(ok => { if (ok) drop("people", id); });
  }
  if (b.dataset.delhol) {
    const h = state.holidays.find(x => x.id === b.dataset.delhol);
    askConfirm("Xoá ngày lễ", `Bỏ ${h ? esc(h.name) : "ngày này"} khỏi danh sách? Nhiệm vụ hôm đó sẽ tính lại như ngày thường.`, "Xoá ngày lễ")
      .then(ok => { if (ok) drop("holidays", b.dataset.delhol); });
  }
  if (b.dataset.delcl) {
    const id = b.dataset.delcl;
    askConfirm("Xoá khách hàng", "Nhiệm vụ đã gán khách hàng này sẽ không còn tên khách.", "Xoá khách hàng")
      .then(ok => { if (ok) drop("clients", id); });
  }

  switch (b.id) {
    case "ncAdd": {
      const n = $("#ncName").value.trim(); if (!n) return $("#ncName").focus();
      put("companies", {
        name: n, mode: $("#ncMode").value, rate: Number($("#ncRate").value) || 0,
        ot: Number($("#ncOt").value) || 1.5, hpd: 8, color: PALETTE[state.companies.length % PALETTE.length],
      });
      break;
    }
    case "npAdd": {
      const n = $("#npName").value.trim(); if (!n) return $("#npName").focus();
      put("people", { name: n, color: PALETTE[(state.people.length + 2) % PALETTE.length] });
      break;
    }
    case "nhAdd": {
      const kind = $("#nhKind").value, name = $("#nhName").value.trim() || "Ngày lễ";
      const span = Math.max(1, Math.min(10, Number($("#nhSpan").value) || 1));
      let rule;
      if (kind === "lunar") {
        const ld = Number($("#nhLD").value), lm = Number($("#nhLM").value);
        if (!(ld >= 1 && ld <= 30)) return $("#nhLD").focus();
        if (!(lm >= 1 && lm <= 12)) return $("#nhLM").focus();
        rule = { lunar: `${pad(lm)}-${pad(ld)}`, name, span };
      } else {
        const d = $("#nhDate").value; if (!d) return $("#nhDate").focus();
        rule = kind === "md" ? { md: d.slice(5), name, span } : { date: d, name, span };
      }
      put("holidays", rule);
      break;
    }
    case "nhFill": {
      // Bản cũ điền ngày lễ dương lịch cho riêng một năm: gỡ đi, thay bằng quy tắc hằng năm.
      state.holidays.filter(h => h.date && HOLIDAY_VN.some(r => r.md === h.date.slice(5) && r.name === h.name))
        .forEach(h => drop("holidays", h.id));
      const same = (a, b) => (a.md || "") === (b.md || "") && (a.lunar || "") === (b.lunar || "");
      HOLIDAY_VN.forEach(r => { if (!state.holidays.some(h => same(h, r))) put("holidays", Object.assign({}, r)); });
      break;
    }
    case "nlAdd": {
      const n = $("#nlName").value.trim(); if (!n) return $("#nlName").focus();
      put("clients", { name: n, companyId: $("#nlCo").value || "" });
      break;
    }
    case "pPrev": case "pNext": {
      const dir = b.id === "pNext" ? 1 : -1, p = state.pay, a = parseISO(p.anchor);
      if (p.kind === "week") p.anchor = iso(addDays(a, dir * 7 * Math.max(1, p.n)));
      else if (p.kind === "month") p.anchor = iso(new Date(a.getFullYear(), a.getMonth() + dir * Math.max(1, p.n), 1));
      else if (p.kind === "year") p.anchor = iso(new Date(a.getFullYear() + dir * Math.max(1, p.n), 0, 1));
      savePrefs(); renderPay(); break;
    }
    case "pNow": state.pay.anchor = iso(new Date()); savePrefs(); renderPay(); break;
    case "pOtCopy": {
      const txt = ["Ngày\tGiờ làm\tNgười làm\tCông ty\tLoại\tGiờ nhân hệ số\tPhần trăm\tTiền\tGiờ đêm\tPhụ cấp đêm", otNightText(payrollRows().tasks)].join("\n");
      copyText(txt).then(ok => { b.textContent = ok ? "Đã sao chép" : "Không sao chép được"; setTimeout(() => { b.textContent = "Sao chép chi tiết"; }, 1600); });
      break;
    }
    case "pCopy": {
      const rows = payrollRows().rows;
      const txt = rows.map(r => [peName(r.personId), coName(r.companyId), r.basis, r.days.size,
        fmtH(r.base), fmtH(r.otH), fmtH(r.holH), fmtH(r.night), vnd(r.amount)].join("\t")).join("\n");
      navigator.clipboard && navigator.clipboard.writeText(txt).then(
        () => { b.textContent = "Đã sao chép"; setTimeout(() => { b.textContent = "Sao chép bảng"; }, 1600); },
        () => { b.textContent = "Không sao chép được"; });
      break;
    }
    case "expBtn": {
      const data = JSON.stringify(allData(), null, 2);
      (async () => {
        const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
        if (dl) {
          try { await dl.save({ filename: `ca-kip-${iso(new Date())}.json`, data }); b.textContent = "Đã tải xuống"; }
          catch (err) { b.textContent = "Chưa tải được"; }
        } else {
          try { await navigator.clipboard.writeText(data); b.textContent = "Đã chép vào clipboard"; }
          catch (err) { b.textContent = "Chưa tải được"; }
        }
        setTimeout(() => { b.textContent = "Tải xuống bản sao JSON"; }, 1800);
      })();
      break;
    }
    case "demoWipe": case "demoWipe2":
      askConfirm("Xoá dữ liệu mẫu", "Chỉ xoá những dòng mẫu có sẵn. Công ty, người làm, khách hàng và nhiệm vụ do bạn tự thêm vẫn giữ nguyên.", "Xoá dữ liệu mẫu")
        .then(ok => { if (ok) wipeDemo(); });
      break;
    case "wipeBtn":
      askConfirm("Xoá toàn bộ nhiệm vụ", "Mọi nhiệm vụ trên lịch sẽ mất, không lấy lại được. Công ty, người làm và khách hàng vẫn giữ nguyên.", "Xoá hết nhiệm vụ")
        .then(ok => {
          if (!ok) return;
          const ids = state.tasks.map(t => t.id);
          state.tasks = []; render(); saveLocal();
          if (remote) ids.forEach(id => db.collection("tasks").doc(id).delete().catch(() => { }));
        });
      break;
  }
});

document.addEventListener("change", e => {
  if (loanChange(e)) return;
  // Kiểu ngày lễ: âm lịch thì nhập ngày và tháng âm, còn lại chọn ngày dương.
  if (e.target.id === "nhKind") {
    const lunar = e.target.value === "lunar";
    $("#nhDate").classList.toggle("hide", lunar);
    $("#nhLD").classList.toggle("hide", !lunar);
    $("#nhLM").classList.toggle("hide", !lunar);
    return;
  }
  // Ô phần trăm trong Thiết lập: nhập 150 thì lưu thành hệ số 1,5.
  if (e.target.classList && e.target.classList.contains("pct")) {
    const c = co(e.target.dataset.co); if (!c) return;
    const v = Math.max(0, Number(e.target.value) || 0) / 100;
    put("companies", Object.assign({}, c, { [e.target.dataset.pct]: v }));
    return;
  }
  const p = state.pay;
  if (e.target.id === "pKind") { p.kind = e.target.value; savePrefs(); renderPay(); }
  if (e.target.id === "pN") { p.n = Math.max(1, Number(e.target.value) || 1); savePrefs(); renderPay(); }
  if (e.target.id === "pAnchor") { p.anchor = e.target.value; savePrefs(); renderPay(); }
  if (e.target.id === "pFrom") { p.from = e.target.value; savePrefs(); renderPay(); }
  if (e.target.id === "pTo") { p.to = e.target.value; savePrefs(); renderPay(); }
  if (e.target.id === "pDone") { p.onlyDone = e.target.checked; savePrefs(); renderPay(); }
});
document.addEventListener("click", e => {
  const g = e.target.closest("#pGroup button[data-g]");
  if (g) { state.pay.group = g.dataset.g; savePrefs(); renderPay(); }
});

/* ---- phím tắt ---- */
document.addEventListener("keydown", e => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || $("#modalHost").children.length || quickEl) return;
  if (e.key === "n") { e.preventDefault(); openTask({ date: iso(state.cursor), personId: state.me }); }
  if (e.key === "t") { state.cursor = new Date(); state.miniCursor = startOfMonth(state.cursor); render(); }
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
  const m = { d: "day", w: "week", m: "month" }[e.key];
  if (m) { setView("cal"); state.calMode = m; savePrefs(); render(); }
});

/* ---- khởi động ---- */
(function boot() {
  const cur = document.documentElement.getAttribute("data-theme");
  const dark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  $("#themeTxt").textContent = dark ? "Giao diện tối" : "Giao diện sáng";
  const g = $("#grid");
  g.addEventListener("pointerdown", onDown);
  g.addEventListener("pointermove", onMove);
  g.addEventListener("pointerup", onUp);
  g.addEventListener("pointercancel", onCancel);
  const hw = $("#hWrap");
  hw.addEventListener("pointerdown", hDown);
  hw.addEventListener("pointermove", hMove);
  hw.addEventListener("pointerup", hUp);
  hw.addEventListener("pointercancel", onCancel);
  // Thanh cuộn đã ẩn: khi các hàng vừa màn hình thì lăn chuột dọc để cuộn ngang theo giờ.
  hw.addEventListener("wheel", ev => {
    if (ev.shiftKey || Math.abs(ev.deltaX) > Math.abs(ev.deltaY)) return;
    if (hw.scrollHeight > hw.clientHeight + 1) return;
    hw.scrollLeft += ev.deltaY; ev.preventDefault();
  }, { passive: false });
  $("#orient").onclick = ev => {
    const b = ev.target.closest("button[data-o]"); if (!b) return;
    closeQuick(); state.orient = b.dataset.o; savePrefs(); render();
  };
  g.addEventListener("contextmenu", e => { if (drag) e.preventDefault(); });
  // Chrome khôi phục chỗ cuộn của khung lịch khi tải lại trang: ép về 0h.
  addEventListener("load", () => { if (!drag) g.parentElement.scrollTop = 0; });
  initStore();
  setInterval(() => {
    if (!drag && state.view === "cal" && state.calMode !== "month") renderCalendar();
  }, 60000);
})();
</script>
