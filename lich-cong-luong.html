// Chiều cao một giờ lấy thẳng từ biến CSS nên hai bên không bao giờ lệch nhau.
const SLOT = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--slot")) || 60;
const SNAP = 15;
let gridLo = 420;   // phút của dòng giờ đầu tiên đang hiển thị

function gridDays() {
  if (state.calMode === "day") return [new Date(state.cursor)];
  const a = startOfWeek(state.cursor);
  return Array.from({ length: 7 }, (_, i) => addDays(a, i));
}
// Các khối vẽ trong một cột ngày. Nhiệm vụ qua đêm cắt làm hai:
// phần đầu chạy tới nửa đêm, phần đuôi nằm ở đầu cột ngày hôm sau.
function segmentsOn(d) {
  const out = [], key = iso(d), prev = iso(addDays(d, -1));
  state.tasks.forEach(t => {
    if (!visible(t)) return;
    const s = toMin(t.start), e = toMin(t.end), overnight = e <= s;
    if (t.date === key) out.push({ t, s, e: overnight ? 1440 : Math.max(e, s + 15), cut: overnight, cont: false });
    else if (overnight && t.date === prev && e > 0) out.push({ t, s: 0, e: Math.max(e, 15), cut: false, cont: true });
  });
  // Cùng giờ bắt đầu thì việc dài hơn đứng trước, giống cách Google xếp.
  return out.sort((a, b) => a.s - b.s || (b.e - b.s) - (a.e - a.s));
}

function renderCalendar() {
  const month = state.calMode === "month", horiz = isHoriz();
  $("#calHead").classList.toggle("hide", month || horiz);
  $("#gridScroll").classList.toggle("hide", month || horiz);
  $("#hWrap").classList.toggle("hide", !horiz);
  $("#mHead").classList.toggle("hide", !month);
  $("#mGrid").classList.toggle("hide", !month);
  $$("#calMode button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.m === state.calMode)));
  // Lịch tháng không có trục giờ nên không có chuyện dọc hay ngang.
  $("#orient").classList.toggle("hide", month || state.view !== "cal");
  $$("#orient button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.o === state.orient)));
  month ? renderMonth() : horiz ? renderHoriz() : renderTimeGrid();
}

let lastGridKey = "";
function renderTimeGrid() {
  const days = gridDays(), today = new Date();
  const lo = 0, hi = 1440, rows = 24;   // trọn ngày như Google, nhãn 0h ẩn ở mép trên
  gridLo = lo;
  const cols = `58px repeat(${days.length}, minmax(0,1fr))`;
  $("#calHead").style.gridTemplateColumns = cols;
  $("#grid").style.gridTemplateColumns = cols;

  const off = -new Date().getTimezoneOffset() / 60;
  const tz = `GMT${off < 0 ? "−" : "+"}${pad(Math.floor(Math.abs(off)))}`;
  $("#calHead").innerHTML = `<div class="corner">${tz}</div>` + days.map(d => {
    const ts = tasksOn(d), h = ts.reduce((s, t) => s + dur(t), 0), hol = holidayOn(iso(d));
    return `<div class="dcol ${sameDay(d, today) ? "today" : ""} ${hol ? "hol" : ""}">
      <div class="dn">${days.length === 1 ? DOW_LONG[d.getDay()] : DOW[d.getDay()]}</div>
      <div class="dd">${d.getDate()}</div>
      ${hol ? `<div class="holname" title="${esc(hol.name)}">${esc(hol.name)}</div>`
        : `<div class="hrs ${h ? "on" : ""}">${h ? fmtH(h) : "&nbsp;"}</div>`}
    </div>`;
  }).join("");

  // Nhãn giờ nằm ở mép trên mỗi dòng; mép 0h và mép 24h không có nhãn.
  let html = `<div class="gutter">` + Array.from({ length: rows }, (_, r) =>
    `<div class="h">${r === 0 ? "" : `<span>${pad(r)}:00</span>`}</div>`).join("") + `</div>`;

  days.forEach(d => {
    html += `<div class="daycol" data-date="${iso(d)}">`;
    html += Array.from({ length: rows }, (_, r) => `<div class="slot" data-min="${r * 60}"></div>`).join("");
    if (sameDay(d, today)) {
      const m = today.getHours() * 60 + today.getMinutes();
      html += `<div class="nowline" style="top:${m / 60 * SLOT}px"></div>`;
    }
    html += layoutDay(segmentsOn(d), lo);
    html += `</div>`;
  });
  $("#grid").innerHTML = html;
  repaintPending();   // khối tạm của bảng tạo nhanh không bị mất khi lưới vẽ lại

  // Đổi ngày hoặc đổi kiểu xem thì về đúng mốc 0h ở đầu lưới.
  // Vẽ lại trong cùng một tuần thì giữ nguyên chỗ đang xem.
  const key = state.calMode + "|" + iso(days[0]);
  if (key !== lastGridKey) {
    lastGridKey = key;
    const gs = $("#gridScroll");
    gs.scrollTop = 0;
    // Trình duyệt khôi phục chỗ cuộn cũ sau khi dựng xong, nên đặt lại lần nữa.
    requestAnimationFrame(() => { if (lastGridKey === key) gs.scrollTop = 0; });
  }
}

// Xếp chồng kiểu Google Calendar: chia cột trong từng cụm dính nhau,
// rồi nới mỗi nhiệm vụ sang phải hết mức còn trống nên nhìn ra bậc thang.
function layoutDay(segs, lo) {
  const items = segs.map(g => Object.assign({}, g));
  const clusters = [];
  let cur = [], curEnd = -1;
  items.forEach(it => {
    if (cur.length && it.s >= curEnd) { clusters.push(cur); cur = []; curEnd = -1; }
    cur.push(it); curEnd = Math.max(curEnd, it.e);
  });
  if (cur.length) clusters.push(cur);

  // Chia cột thật: mỗi nhiệm vụ trùng giờ có cột riêng, không khối nào đè lên
  // khối nào, nên tên của mọi nhiệm vụ đều đọc được. Khối nào có cột bên phải
  // trống suốt khoảng giờ của nó thì nới rộng ra cho đỡ phí chỗ.
  const GAP = Math.ceil(40 / SLOT * 60);   // số phút tối thiểu để đè mà không nuốt tên
  const STEP = 7, MIN_W = 22;              // nấc thụt và bề ngang tối thiểu, theo %
  const laid = [];
  clusters.forEach(cluster => {
    const placed = [];
    cluster.forEach((it, i) => {
      it.z = 4 + i;
      const over = placed.filter(p => p.s < it.e && it.s < p.e);
      if (!over.length) { it.left = 0; it.right = 100; return placed.push(it); }
      const p = over.reduce((a, b) => (b.left > a.left ? b : a));
      if (it.s - p.s >= GAP && p.left + STEP + MIN_W <= 100) {
        // Bắt đầu muộn hơn đủ xa: thụt một nấc rồi đè, tên khối dưới nằm phía trên.
        it.left = p.left + STEP; it.right = 100;
      } else {
        // Bắt đầu quá sát: tách ngang và cắt bề ngang những khối sắp bị che tên.
        it.left = Math.min(Math.max(p.left + MIN_W, (p.left + 100) / 2), 100 - MIN_W);
        it.right = 100;
        over.forEach(b => { if (it.s - b.s < GAP) b.right = Math.min(b.right, it.left); });
      }
      placed.push(it);
    });
    laid.push(...cluster);
  });

  return laid.map(it => {
    const t = it.t, st = statusOf(t);
    const left = it.left, width = it.right - it.left;
    const top = (it.s - lo) / 60 * SLOT, h = (it.e - it.s) / 60 * SLOT - 3;
    const time = it.cont ? `00:00 – ${t.end} · tiếp` : `${t.start}${h >= 40 ? " – " + t.end : ""}${t.overtime ? " · Tăng ca" : ""}`;
    return `<button class="ev ${t.overtime ? "ot" : ""} ${h < 40 ? "short" : ""} ${t.done ? "done" : ""} ${it.cut ? "cut" : ""} ${it.cont ? "cont" : ""} ${width < 34 ? "narrow" : ""}"
      data-task="${t.id}" ${it.cont ? 'data-cont="1"' : ""}
      style="--c:${coColor(t.companyId)};z-index:${it.z};top:${top}px;height:${Math.max(h, 21)}px;left:calc(${left}% + 2px);width:calc(${width}% - 5px)">
      <div class="t">${time}</div>
      <div class="n">${esc(taskLabel(t))}</div>
      ${h >= 62 ? `<div class="s">${esc(taskSummary(t))}${st.k === "live" ? " · đang làm" : ""}</div>` : ""}
      ${it.cont ? "" : `<div class="ev-rz" aria-hidden="true"></div>`}
    </button>`;
  }).join("");
}

/* ---------- kéo thả: tạo mới, dời chỗ, đổi thời lượng ---------- */
let drag = null, swallowClick = false;
const snapMin = m => Math.max(0, Math.min(1440, Math.round(m / SNAP) * SNAP));

function colAt(x, y) {
  for (const el of document.elementsFromPoint(x, y)) {
    const c = el.closest && el.closest(".daycol");
    if (c) return c;
  }
  return null;
}
function minAt(col, y) {
  return gridLo + (y - col.getBoundingClientRect().top) / SLOT * 60;
}
function paintGhost(col, s, e, ot, label, firm) {
  let g = $("#ghost");
  if (!g) { g = document.createElement("div"); g.id = "ghost"; $("#grid").appendChild(g); }
  g.className = "drag-ghost" + (ot ? " ot" : "") + (firm ? " firm" : "");
  g.style.left = (col.offsetLeft + 2) + "px";
  g.style.width = Math.max(col.offsetWidth - 6, 40) + "px";
  g.style.top = (s - gridLo) / 60 * SLOT + "px";
  g.style.height = Math.max((e - s) / 60 * SLOT - 2, 19) + "px";
  g.innerHTML = `<b>${esc(label)}</b><span>${fromMin(s)} – ${fromMin(e)} · ${fmtH((e - s) / 60)}</span>`;
}
const clearGhost = () => { const g = $("#ghost"); if (g) g.remove(); };

function onDown(e) {
  if (e.button !== 0) return;
  swallowClick = false;
  const col = e.target.closest(".daycol"); if (!col) return;
  const evEl = e.target.closest(".ev");
  const onHandle = !!e.target.closest(".ev-rz");
  const m = minAt(col, e.clientY);
  if (evEl) {
    const t = state.tasks.find(x => x.id === evEl.dataset.task); if (!t) return;
    // Phần đuôi của nhiệm vụ qua đêm chỉ để bấm xem, kéo thì sửa ở khối gốc.
    if (evEl.dataset.cont) { drag = { mode: "open", t, col }; }
    else {
      let s = toMin(t.start), en = toMin(t.end); if (en <= s) en = 1440;
      drag = { mode: onHandle ? "resize" : "move", t, el: evEl, col, date: t.date, s, e: en, grab: m - s };
    }
  } else {
    const a = snapMin(m);
    drag = { mode: "create", col, date: col.dataset.date, anchor: a, s: a, e: Math.min(a + SNAP, 1440) };
  }
  drag.moved = false; drag.x0 = e.clientX; drag.y0 = e.clientY;
  try { $("#grid").setPointerCapture(e.pointerId); } catch (err) { }
  e.preventDefault();
}

function onMove(e) {
  if (!drag || drag.h || drag.mode === "open") return;
  if (!drag.moved) {
    if (Math.abs(e.clientX - drag.x0) < 4 && Math.abs(e.clientY - drag.y0) < 4) return;
    drag.moved = true;
    if (drag.el) drag.el.classList.add("dragging");
  }
  if (drag.mode === "move") {
    const col = colAt(e.clientX, e.clientY) || drag.col;
    drag.col = col; drag.date = col.dataset.date;
    const len = drag.e - drag.s;
    let s = snapMin(minAt(col, e.clientY) - drag.grab);
    s = Math.max(0, Math.min(s, 1440 - len));
    drag.s = s; drag.e = s + len;
  } else if (drag.mode === "resize") {
    drag.e = Math.max(drag.s + SNAP, snapMin(minAt(drag.col, e.clientY)));
  } else {
    const m = snapMin(minAt(drag.col, e.clientY));
    drag.s = Math.min(drag.anchor, m);
    drag.e = Math.max(drag.anchor + SNAP, m);
  }
  paintGhost(drag.col, drag.s, drag.e, drag.t ? drag.t.overtime : false,
    drag.t ? (coName(drag.t.companyId)) : "Nhiệm vụ mới");
}

// Cuộn bằng ngón tay làm trình duyệt huỷ thao tác kéo: bỏ qua, không mở hộp thoại.
function onCancel() {
  if (!drag) return;
  if (drag.el) drag.el.classList.remove("dragging");
  drag = null; clearGhost();
}

function onUp(e) {
  if (!drag || drag.h) return;
  const d = drag; drag = null;
  clearGhost();
  if (d.el) d.el.classList.remove("dragging");
  swallowClick = true;
  if (d.mode === "create") {
    startQuickCreate(d.date, d.moved ? d.s : d.anchor, d.moved ? d.e : Math.min(d.anchor + 60, 1440));
    return;
  }
  if (!d.moved) { openTask(Object.assign({}, d.t)); return; }
  put("tasks", Object.assign({}, d.t, { date: d.date, start: fromMin(d.s), end: fromMin(d.e) }));
}

/* ============================== lịch ngang ==============================
   Trục ngang là giờ trong ngày. Xem theo ngày: mỗi hàng là một người làm.
   Xem theo tuần: mỗi hàng là một ngày. Nhiệm vụ trùng giờ trong cùng một hàng
   được tách xuống làn riêng, nên không khối nào che tên khối nào. */
const LANE = 46;
let lastHKey = "";
const isHoriz = () => state.view === "cal" && state.calMode !== "month" && state.orient === "h";
const initials = name => {
  const w = String(name || "?").trim().split(/\s+/);
  return (w.length > 1 ? w[0][0] + w[w.length - 1][0] : w[0].slice(0, 2)).toUpperCase();
};
function laneLayout(segs) {
  const ends = [];
  segs.forEach(g => {
    let k = ends.findIndex(end => end <= g.s);
    if (k < 0) { k = ends.length; ends.push(0); }
    ends[k] = g.e; g.lane = k;
  });
  return Math.max(1, ends.length);
}
function hBlocks(segs) {
  return segs.map(g => {
    const t = g.t;
    const time = g.cont ? `00:00–${t.end} · tiếp` : `${t.start}–${t.end}${t.overtime ? " · Tăng ca" : ""}`;
    return `<button class="hb ${t.overtime ? "ot" : ""} ${t.done ? "done" : ""}" data-task="${t.id}" ${g.cont ? 'data-cont="1"' : ""}
      style="--c:${coColor(t.companyId)};left:${g.s / 1440 * 100}%;width:calc(${(g.e - g.s) / 1440 * 100}% - 2px);top:${4 + g.lane * LANE}px;height:${LANE - 6}px"
      title="${esc(taskLabel(t))}${taskSummary(t) ? " · " + esc(taskSummary(t)) : ""} · ${t.start}–${t.end}">
      <span class="n">${esc(taskLabel(t))}</span>
      <span class="t">${time}${taskSummary(t) ? " · " + esc(taskSummary(t)) : ""}</span>
      ${g.cont ? "" : `<span class="hb-rz" aria-hidden="true"></span>`}
    </button>`;
  }).join("");
}
function renderHoriz() {
  const days = gridDays(), today = new Date(), dayMode = state.calMode === "day";
  const nowM = today.getHours() * 60 + today.getMinutes();
  const hoursOf = segs => segs.filter(g => !g.cont).reduce((s, g) => s + dur(g.t), 0);
  const rows = [];
  if (dayMode) {
    const d = days[0], segs = segmentsOn(d);
    state.people.filter(p => !state.hidePe.has(p.id))
      .sort((a, b) => (b.id === state.me) - (a.id === state.me))
      .forEach(p => {
        const mine = segs.filter(g => worksHere(g.t, p.id)), h = hoursOf(mine);
        rows.push({
          d, person: p.id, segs: mine, cls: p.id === state.me ? "me" : "",
          label: `<span class="av" style="--c:${p.color}">${esc(initials(p.name))}</span>
            <span class="who"><b>${esc(p.name)}</b><small>${p.id === state.me ? "Bạn · " : ""}${h ? fmtH(h) : "chưa có ca"}</small></span>`,
        });
      });
    const orphan = segs.filter(g => !crewPeople(g.t).some(id => pe(id)));
    if (orphan.length || !rows.length) rows.push({
      d, person: "", segs: orphan, cls: "",
      label: `<span class="av" style="--c:var(--muted)">?</span>
        <span class="who"><b>Chưa gán người</b><small>${orphan.length ? fmtH(hoursOf(orphan)) : "kéo vào đây để tạo"}</small></span>`,
    });
  } else {
    days.forEach(d => {
      const segs = segmentsOn(d), h = hoursOf(segs), hol = holidayOn(iso(d));
      rows.push({
        d, segs, cls: `${sameDay(d, today) ? "today" : ""} ${hol ? "hol" : ""}`,
        label: `<span class="dnum">${d.getDate()}</span>
          <span class="who"><b>${DOW_LONG[d.getDay()]}</b><small>${hol ? esc(hol.name) : h ? fmtH(h) : "chưa có ca"}</small></span>`,
      });
    });
  }

  let html = `<div class="hgrid"><div class="hhead"><div class="hl">${dayMode ? "Người làm" : "Ngày"}</div>
    <div class="hhours">${Array.from({ length: 24 }, (_, h) => `<div>${h === 0 ? "" : pad(h) + ":00"}</div>`).join("")}</div></div>`;
  rows.forEach(r => {
    const lanes = laneLayout(r.segs);
    html += `<div class="hrow ${r.cls}"><div class="hl">${r.label}</div>
      <div class="htrack" data-date="${iso(r.d)}" ${dayMode ? `data-person="${esc(r.person)}"` : ""} style="height:${lanes * LANE + 8}px">
        ${sameDay(r.d, today) ? `<div class="hnow" style="left:${nowM / 1440 * 100}%"></div>` : ""}
        ${hBlocks(r.segs)}
      </div></div>`;
  });
  const wrap = $("#hWrap");
  wrap.innerHTML = html + `</div>`;
  const key = state.calMode + "|" + iso(days[0]);
  if (key !== lastHKey) { lastHKey = key; wrap.scrollLeft = 0; wrap.scrollTop = 0; }
  repaintPending();
}

/* ---- kéo thả trên lịch ngang ---- */
function hTrackAt(x, y) {
  for (const el of document.elementsFromPoint(x, y)) {
    const t = el.closest && el.closest(".htrack");
    if (t) return t;
  }
  return null;
}
const minAtX = (track, x) => {
  const r = track.getBoundingClientRect();
  return (x - r.left) / r.width * 1440;
};
function paintHGhost(track, s, e, label, firm, ot) {
  let g = $("#ghost");
  if (!g) { g = document.createElement("div"); g.id = "ghost"; }
  if (g.parentElement !== track) track.appendChild(g);
  g.className = "drag-ghost hghost" + (ot ? " ot" : "") + (firm ? " firm" : "");
  g.style.left = s / 1440 * 100 + "%";
  g.style.width = `calc(${(e - s) / 1440 * 100}% - 2px)`;
  g.style.top = "4px";
  g.style.height = `${LANE - 6}px`;
  g.innerHTML = `<b>${esc(label)}</b><span>${fromMin(s)} – ${fromMin(e)} · ${fmtH((e - s) / 60)}</span>`;
}
function hDown(e) {
  if (e.button !== 0) return;
  swallowClick = false;
  const track = e.target.closest(".htrack"); if (!track) return;
  const blk = e.target.closest(".hb");
  const m = minAtX(track, e.clientX);
  if (blk) {
    const t = state.tasks.find(x => x.id === blk.dataset.task); if (!t) return;
    if (blk.dataset.cont) drag = { h: true, mode: "open", t };
    else {
      let s = toMin(t.start), en = toMin(t.end); if (en <= s) en = 1440;
      drag = {
        h: true, mode: e.target.closest(".hb-rz") ? "resize" : "move", t, el: blk, track,
        s, e: en, grab: m - s, date: t.date, personId: t.personId || "",
      };
    }
  } else {
    const a = snapMin(m);
    drag = { h: true, mode: "create", track, date: track.dataset.date, personId: track.dataset.person, anchor: a, s: a, e: Math.min(a + SNAP, 1440) };
  }
  drag.moved = false; drag.x0 = e.clientX; drag.y0 = e.clientY;
  try { $("#hWrap").setPointerCapture(e.pointerId); } catch (err) { }
  e.preventDefault();
}
function hMove(e) {
  if (!drag || !drag.h || drag.mode === "open") return;
  if (!drag.moved) {
    if (Math.abs(e.clientX - drag.x0) < 4 && Math.abs(e.clientY - drag.y0) < 4) return;
    drag.moved = true;
    if (drag.el) drag.el.classList.add("dragging");
  }
  if (drag.mode === "move") {
    // Kéo sang hàng khác: đổi ngày (xem tuần) hoặc đổi người làm (xem ngày).
    const tr = hTrackAt(e.clientX, e.clientY) || drag.track;
    drag.track = tr; drag.date = tr.dataset.date;
    if (tr.dataset.person !== undefined) drag.personId = tr.dataset.person;
    const len = drag.e - drag.s;
    const s = Math.max(0, Math.min(snapMin(minAtX(tr, e.clientX) - drag.grab), 1440 - len));
    drag.s = s; drag.e = s + len;
  } else if (drag.mode === "resize") {
    drag.e = Math.max(drag.s + SNAP, snapMin(minAtX(drag.track, e.clientX)));
  } else {
    const m = snapMin(minAtX(drag.track, e.clientX));
    drag.s = Math.min(drag.anchor, m);
    drag.e = Math.max(drag.anchor + SNAP, m);
  }
  paintHGhost(drag.track, drag.s, drag.e, drag.t ? coName(drag.t.companyId) : "Nhiệm vụ mới", false, drag.t && drag.t.overtime);
}
function hUp() {
  if (!drag || !drag.h) return;
  const d = drag; drag = null;
  clearGhost();
  if (d.el) d.el.classList.remove("dragging");
  swallowClick = true;
  if (d.mode === "open") { openTask(Object.assign({}, d.t)); return; }
  if (d.mode === "create") {
    startQuickCreate(d.date, d.moved ? d.s : d.anchor, d.moved ? d.e : Math.min(d.anchor + 60, 1440), d.personId);
    return;
  }
  if (!d.moved) { openTask(Object.assign({}, d.t)); return; }
  const patch = { date: d.date, start: fromMin(d.s), end: fromMin(d.e) };
  if (state.calMode === "day") patch.personId = d.personId;
  put("tasks", Object.assign({}, d.t, patch));
}

/* ---------- bảng tạo nhanh, khối tạm vẫn nằm trên lịch ---------- */
let pending = null, quickEl = null;

function repaintPending() {
  if (!pending) return;
  if (isHoriz()) {
    const sel = `.htrack[data-date="${pending.date}"]` +
      (state.calMode === "day" ? `[data-person="${pending.personId || ""}"]` : "");
    const tr = $(sel);
    if (!tr) { closeQuick(); return; }
    paintHGhost(tr, pending.s, pending.e, "(Chưa đặt tên)", true);
    return;
  }
  const col = $(`.daycol[data-date="${pending.date}"]`);
  if (!col) { closeQuick(); return; }
  paintGhost(col, pending.s, pending.e, false, "(Chưa đặt tên)", true);
}
function quickOutside(e) {
  if (quickEl && !e.target.closest(".quick") && !e.target.closest(".scrim")) closeQuick();
}
function closeQuick(keepGhost) {
  if (quickEl) { quickEl.remove(); quickEl = null; }
  document.removeEventListener("pointerdown", quickOutside, true);
  if (!keepGhost) { pending = null; clearGhost(); }
}
function startQuickCreate(date, s, e, personId) {
  pending = { date, s, e, personId };
  repaintPending();
  const g = $("#ghost");
  const seed = { date, start: fromMin(s), end: fromMin(e) };
  if (personId !== undefined) seed.personId = personId;   // tạo từ hàng của một người
  openQuick(seed,
    g ? g.getBoundingClientRect() : { left: innerWidth / 2, right: innerWidth / 2, top: 140 });
}

const ICON = {

  co: `<svg viewBox="0 0 24 24"><path d="M4 21V6l7-3v18M11 10h9v11M15 14h1M15 18h1M7 10h1M7 14h1"/></svg>`,
  pe: `<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M5 20a7 7 0 0 1 14 0"/></svg>`,
  cl: `<svg viewBox="0 0 24 24"><path d="M3 12V5h7l11 11-7 7L3 12z"/><circle cx="7.5" cy="8.5" r="1.4"/></svg>`,
  ot: `<svg viewBox="0 0 24 24"><path d="M12 4l9 16H3l9-16zM12 10v4"/><circle cx="12" cy="17" r=".6" fill="currentColor"/></svg>`,

const opts = (list, sel, newLabel) => `<option value="">— chưa gán —</option>` +

/* ============================== tính lương ============================== */
function payRange() {
  const p = state.pay, a = parseISO(p.anchor);
  if (p.kind === "custom") {
    const f = p.from ? parseISO(p.from) : startOfMonth(a);
    const t = p.to ? parseISO(p.to) : endOfMonth(a);
    return { from: f, to: t, label: `${shortVN(f)} – ${shortVN(t)}/${t.getFullYear()}` };
  }
  if (p.kind === "week") {
    const f = startOfWeek(a), t = addDays(f, 7 * Math.max(1, p.n) - 1);
    return { from: f, to: t, label: `${p.n} tuần · ${shortVN(f)} – ${shortVN(t)}/${t.getFullYear()}` };
  }
  if (p.kind === "month") {
    const f = new Date(a.getFullYear(), a.getMonth(), 1);
    const t = new Date(a.getFullYear(), a.getMonth() + Math.max(1, p.n), 0);
    return { from: f, to: t, label: p.n > 1 ? `${p.n} tháng · ${shortVN(f)} – ${shortVN(t)}/${t.getFullYear()}` : `Tháng ${f.getMonth() + 1}/${f.getFullYear()}` };
  }
  const f = new Date(a.getFullYear(), 0, 1), t = new Date(a.getFullYear() + Math.max(1, p.n) - 1, 11, 31);
  return { from: f, to: t, label: p.n > 1 ? `${f.getFullYear()} – ${t.getFullYear()}` : `Năm ${f.getFullYear()}` };
}
// Số tháng của kỳ, tính theo tỉ lệ ngày: trọn tháng 8 được 1, nửa tháng được 0,5.
function monthsBetween(f, t) {
  let total = 0, cur = new Date(f.getFullYear(), f.getMonth(), 1);
  while (cur <= t) {
    const last = endOfMonth(cur);
    const a = cur > f ? cur : f, b = last < t ? last : t;
    total += (Math.round((b - a) / 864e5) + 1) / last.getDate();
    cur = new Date(cur.getFullYear(), cur.getMonth() + 1, 1);
  }
  return Math.round(total * 1000) / 1000;
}

/* ---- loại ngày, giờ đêm, hệ số ---- */
const PCT = { ot: 1.5, week: 2, hol: 3, night: .3, leave: 1 };   // mức tối thiểu theo luật; nghỉ có lương mặc định 100%
/* ---- âm lịch Việt Nam: thuật toán Hồ Ngọc Đức, múi giờ +7 ---- */
const Lunar = (() => {
  const INT = Math.floor, TZ = 7, dr = Math.PI / 180;
  const jdFromDate = (dd, mm, yy) => {
    const a = INT((14 - mm) / 12), y = yy + 4800 - a, m = mm + 12 * a - 3;
    let jd = dd + INT((153 * m + 2) / 5) + 365 * y + INT(y / 4) - INT(y / 100) + INT(y / 400) - 32045;
    if (jd < 2299161) jd = dd + INT((153 * m + 2) / 5) + 365 * y + INT(y / 4) - 32083;
    return jd;
  };
  const jdToDate = jd => {
    let b, c;
    if (jd > 2299160) { const a = jd + 32044; b = INT((4 * a + 3) / 146097); c = a - INT(b * 146097 / 4); }
    else { b = 0; c = jd + 32082; }
    const d = INT((4 * c + 3) / 1461), e = c - INT(1461 * d / 4), m = INT((5 * e + 2) / 153);
    return [e - INT((153 * m + 2) / 5) + 1, m + 3 - 12 * INT(m / 10), b * 100 + d - 4800 + INT(m / 10)];
  };
  const newMoon = k => {
    const T = k / 1236.85, T2 = T * T, T3 = T2 * T;
    let J = 2415020.75933 + 29.53058868 * k + 0.0001178 * T2 - 0.000000155 * T3;
    J += 0.00033 * Math.sin((166.56 + 132.87 * T - 0.009173 * T2) * dr);
    const M = 359.2242 + 29.10535608 * k - 0.0000333 * T2 - 0.00000347 * T3;
    const Mp = 306.0253 + 385.81691806 * k + 0.0107306 * T2 + 0.00001236 * T3;

function holidayDates(h, y) {

    // Xét cả năm trước và năm sau vì một kỳ nghỉ có thể vắt qua năm mới.
    (h.date ? [y] : [y - 1, y, y + 1]).forEach(yy => holidayDates(h, yy).forEach(d => {

// Thù lao của một nhiệm vụ. Giờ được nhân hệ số thì trả theo giờ; giờ thường

function payrollRows() {

  const units = sel.flatMap(x => {

    return (crew.length ? crew : [{ personId: x.personId || "" }]).map(w => ({ x, personId: w.personId || "" }));
  });

      night: 0, days: new Set(), payDays: new Set(), n: 0, amount: 0,

    r.weekH += p.weekH; r.holidayH += p.holidayH; r.leaveH += p.leaveH;
    r.baseM += p.baseM; r.otM += p.otM; r.weekM += p.weekM; r.holidayM += p.holidayM; r.leaveM += p.leaveM; r.nightM += p.nightM;
    r.n++; r.days.add(x.date);

// Timesheet: từng ca làm trong kỳ, ngày và khung giờ, như bản brief.
function timesheetHTML(tasks) {
  if (!tasks.length) return `<div class="empty"><b>Kỳ này chưa có ca làm nào.</b>Đổi kỳ hoặc bỏ bớt bộ lọc ở trên.</div>`;
  const ampm = t => { const [h, m] = t.split(":").map(Number); const ap = h < 12 ? "A.M" : "P.M"; const hh = h % 12 || 12; return `${hh}:${pad(m)}${ap}`; };
  const list = tasks.slice().sort((a, b) => b.date.localeCompare(a.date) || toMin(a.start) - toMin(b.start));
  return `<ul class="ts-list">${list.map(t => {
    const pay = payOf(t);
    return `<li>
      <span class="num" style="flex:0 0 74px">${dmy(t.date).slice(0, 5)}</span>
      <span class="num" style="flex:0 0 170px">${ampm(t.start)} - ${ampm(t.end)}</span>

      <span class="num">${fmtH(pay.h)}</span>
      <span class="money">${pay.noCo ? "—" : vnd(pay.amount)}</span>
    </li>`;
  }).join("")}</ul>`;
}

  saveSchema(sc);
  let order = maxOrder();
  LOAN_TEMPLATE.rules.forEach(([bank, purpose, doc, stage, appliesTo, income]) => {

    if (!state.loanRules.some(x => ruleSig(x) === ruleSig(r))) put("loanRules", Object.assign(r, { order: ++order }), true);

/* ---- chuyển dữ liệu kiểu cũ (cột cố định) sang kiểu tự định nghĩa ---- */
function migrateLoan() {
  // Mã Áp dụng cho kiểu cũ (common, both…) đổi sang đúng chữ hiện trong bảng.
  state.loanRules.filter(r => Object.prototype.hasOwnProperty.call(LEGACY_WHO, r.appliesTo) && Array.isArray(r.conds))
    .forEach(r => put("loanRules", Object.assign({}, r, { appliesTo: LEGACY_WHO[r.appliesTo] }), true));
  const oldRules = state.loanRules.filter(r => !Array.isArray(r.conds));
  const oldCases = state.loanCases.filter(c => !c.values);
  const d = state.loanConfig.find(x => x.id === "lists");
  const oldCfg = d && !Array.isArray(d.fields);
  if (!oldRules.length && !oldCases.length && !oldCfg) return;
  if (!d || oldCfg) {
    const pick = (a, b) => [...new Set([...(a || []), ...b.filter(v => !isAny(v))])];
    const fields = JSON.parse(JSON.stringify(LOAN_TEMPLATE.fields));
    fields[0].options = pick(d && d.banks, [...oldRules.map(r => r.bank), ...oldCases.map(c => c.bank)]);
    fields[1].options = pick(d && d.purposes, [...oldRules.map(r => r.purpose), ...oldCases.flatMap(c => c.purposes || [])]);
    fields[4].options = pick(d && d.incomes, oldRules.map(r => r.income));
    put("loanConfig", { id: "lists", fields, stages: d && d.stages && d.stages.length ? d.stages : STAGES_DEFAULT.slice() }, true);
  }
  oldRules.forEach(r0 => {
    const { bank, purpose, income, ...r } = r0;
    put("loanRules", Object.assign(r, { match: "all", conds: legacyConds(bank, purpose, income, r0.appliesTo), appliesTo: LEGACY_WHO[r0.appliesTo] || r0.appliesTo || "" }), true);
  });
  oldCases.forEach(c0 => {
    const c = cloneCase(c0);
    c.values = { bank: c.bank || "", purpose: c.purposes || [], amount: c.amount || "", dep: !!c.hasDependents };
    ["bank", "purposes", "amount", "hasDependents"].forEach(k => delete c[k]);
    [...(c.borrowers || []), c.guarantor].forEach(p => { if (p) { p.values = { income: p.incomes || [] }; delete p.incomes; } });
    put("loanCases", c, true);
  });
}

/* ---- đánh giá điều kiện và tính danh sách chứng từ ---- */
function testCond(cd, val, f) {
  const v = cd.value;
  switch (f.type) {
    case "one": {
      const x = asOne(val);
      if (cd.op === "is") return !!x && x === asOne(v);
      if (cd.op === "not") return x !== asOne(v);
      if (cd.op === "in") return asMany(v).includes(x);
      return false;
    }
    case "many": {
      const arr = asMany(val);
      if (cd.op === "has") return arr.includes(asOne(v));
      if (cd.op === "lacks") return !arr.includes(asOne(v));
      if (cd.op === "hasAny") return asMany(v).some(x => arr.includes(x));
      return false;
    }
    case "number": {
      if (blank(val) || isNaN(Number(val))) return false;
      const n = Number(val);
      if (cd.op === "between") {
        const [a, b] = Array.isArray(v) ? v : ["", ""];
        return (blank(a) || n >= Number(a)) && (blank(b) || n <= Number(b));
      }
      if (blank(v)) return false;
      const a = Number(v);
      return { gte: n >= a, gt: n > a, lte: n <= a, lt: n < a, eq: n === a }[cd.op] || false;
    }
    case "text": {
      const s = asOne(val).trim().toLowerCase(), t = asOne(v).trim().toLowerCase();
      if (cd.op === "filled") return !!s;
      if (cd.op === "empty") return !s;
      if (cd.op === "contains") return !!t && s.includes(t);
      if (cd.op === "equals") return s === t;
      return false;
    }
    case "bool": return cd.op === "true" ? !!val : !val;
  }
  return false;
}
// Mỗi hồ sơ lưu người theo mã của ô trong form. Hồ sơ cũ (borrowers, guarantor) vẫn đọc được.
function slotGet(c, k) {
  if (c.people && c.people[k]) return c.people[k];
  const legacy = k === "g" ? c.guarantor : /^b\d$/.test(k) ? (c.borrowers || [])[Number(k.slice(1))] : null;
  return legacy || {};
}
function slotSet(c, k, patch) {
  c.people = Object.assign({}, c.people);
  c.people[k] = Object.assign({ name: "", values: {} }, slotGet(c, k), patch);
}
function loanPeople(c, sc0) {
  return (sc0 || loanSchema()).slots.map(sl => ({ sl, s: slotGet(c, sl.id) }))
    .filter(x => (x.s.name || "").trim())
    .map(x => ({ key: x.sl.id, label: x.sl.label, who: x.sl.who, name: x.s.name.trim(), values: x.s.values || {} }));
}
// Mọi giá trị Áp dụng cho đang có: trong bảng rules và trong cấu hình người.
function whoValues(sc0) {
  const sc = sc0 || loanSchema(), out = [], seen = new Set();
  const add = v => { const t = String(v || "").trim(), k = nrm(t); if (t && !seen.has(k)) { seen.add(k); out.push(t); } };
  if (!sc.removed.includes("who")) state.loanRules.slice().sort((a, b) => (a.order || 0) - (b.order || 0)).forEach(r => add(whoText(r)));
  sc.slots.forEach(sl => sl.who.forEach(add));
  return out;
}
const personSummary = (p, fields) => fields.filter(f => f.scope === "person")
  .map(f => valueText(f, p.values[f.id])).filter(Boolean).join(" · ");
const caseSummary = (c, fields) => fields.filter(f => f.scope !== "person").map(f => {
  const t = valueText(f, (c.values || {})[f.id]);
  return t && f.type === "number" ? `${f.label} ${t}` : t;
}).filter(Boolean).join(" · ");

function loanChecklist(c) {
  const sc = loanSchema(), fmap = new Map(sc.fields.map(f => [f.id, f])), people = loanPeople(c, sc);
  const has = k => !sc.removed.includes(k);
  if (!has("doc")) return [];   // không có cột chứng từ thì không có gì để liệt kê
  // Trường "từng người": với nhóm của một người thì xét người đó; với hồ sơ chung
  // hay người phụ thuộc thì đúng khi có ít nhất một người thoả.
  const matches = (r, person) => {
    const conds = (r.conds || []).filter(x => x.field);
    if (!conds.length) return true;
    const res = conds.map(cd => {
      const f = fmap.get(cd.field);
      if (!f) return true;   // cột đã xoá: bỏ qua điều kiện, như bảng tính không có cột đó
      if (f.scope === "person") return person ? testCond(cd, person.values[f.id], f) : people.some(p => testCond(cd, p.values[f.id], f));
      return testCond(cd, (c.values || {})[f.id], f);
    });
    return r.match === "any" ? res.some(Boolean) : res.every(Boolean);
  };
  const rules = state.loanRules.slice().sort((a, b) => (a.order || 0) - (b.order || 0));
  const valueOf = r => (sc.removed.includes("who") ? COMMON_WHO : whoText(r));
  // Giá trị thuộc về người nào thì chứng từ nằm dưới tên người đó. Giá trị không
  // thuộc về ai (Hồ sơ chung, Người phụ thuộc…) thành một mục riêng của hồ sơ.
  const claimed = new Set(sc.slots.flatMap(sl => sl.who.map(nrm)));
  const own = [];
  rules.forEach(r => { const v = valueOf(r); if (!claimed.has(nrm(v)) && !own.some(x => nrm(x) === nrm(v))) own.push(v); });
  const ownKey = v => (nrm(v) === nrm(COMMON_WHO) ? "common" : nrm(v) === "người phụ thuộc" ? "dep" : "v:" + nrm(v));
  const ownGroup = v => ({ key: ownKey(v), title: v, sub: "", test: x => x === nrm(v), person: null });
  const groups = [
    ...own.filter(v => nrm(v) === nrm(COMMON_WHO)).map(ownGroup),
    ...people.map(p => ({ key: p.key, title: `${p.label} · ${p.name}`, sub: personSummary(p, sc.fields), test: x => p.who.some(w => nrm(w) === x), person: p })),
    ...own.filter(v => nrm(v) !== nrm(COMMON_WHO)).map(ownGroup),
  ];

  const stages = new Map();
  groups.forEach(g => {
    const seen = new Set();   // cùng một chứng từ khớp nhiều rule thì chỉ ghi một lần
    // Không có cột Áp dụng cho: tính cho cả hồ sơ. Không có cột Giai đoạn: gộp một danh sách.
    rules.filter(r => (r.doc || "").trim() && g.test(nrm(valueOf(r))) && matches(r, g.person)).forEach(r => {
      const st = has("stage") ? Math.max(1, Number(r.stage) || 1) : 1, doc = r.doc.trim(), k = st + "|" + doc.toLowerCase();
      if (seen.has(k)) return;
      seen.add(k);
      if (!stages.has(st)) stages.set(st, new Map());
      const byG = stages.get(st);
      if (!byG.has(g.key)) byG.set(g.key, { group: g, docs: [] });
      byG.get(g.key).docs.push({ rule: r, key: `${g.key}|${st}|${doc}` });
    });
  });
  return [...stages.entries()].sort((a, b) => a[0] - b[0])
    .map(([stage, byG]) => ({ stage, groups: groups.filter(g => byG.has(g.key)).map(g => byG.get(g.key)) }));
}

const curCase = () => state.loanCases.find(x => x.id === state.loanOpen);
function saveCase(c) {
  put("loanCases", c, true);

  const x = c.clientId && cl(c.clientId), nm = caseName(c);
  if (x && x.caseId === c.id && loanPeople(c).length && x.name !== nm) put("clients", Object.assign({}, x, { name: nm }), true);
  refreshLoanOut();
}
// Danh sách khách để chọn trong ca làm: mọi khách của Master Data trước (mới nhất lên đầu),
// hồ sơ chưa gắn khách trên lịch có mã "case:…", sau đó là khách chỉ có trên lịch.
function clientChoices() {
  const out = [], seen = new Set();
  state.loanCases.slice().sort((a, b) => (b.createdAt || "").localeCompare(a.createdAt || "")).forEach(k => {
    if (!loanPeople(k).length) return;   // hồ sơ chưa nhập tên thì chưa có gì để chọn
    const cid = caseClientId(k), x = cid && cl(cid);
    if (x) { if (seen.has(x.id)) return; seen.add(x.id); out.push({ id: x.id, name: x.name }); }
    else out.push({ id: "case:" + k.id, name: caseName(k) });
  });
  state.clients.forEach(c => { if (!seen.has(c.id)) { seen.add(c.id); out.push({ id: c.id, name: c.name }); } });
  return out;
}

  const k = state.loanCases.find(x => x.id === caseId);

  const c = put("clients", { name: caseName(k), companyId: companyId || "", caseId: k.id }, true);
  put("loanCases", Object.assign(cloneCase(k), { clientId: c.id }), true);

function roleToField(role) {
  const sc = loanSchema();
  if (sc.removed.includes(role)) return null;
  const order = sheetCols(sc).map(c => c.key), at = order.indexOf(role), id = "f" + uid();
  const f = { id, label: sc.colNames[role], type: role === "stage" ? "number" : role === "who" ? "one" : "text", scope: "case", unit: "", options: role === "who" ? whoValues(sc) : [] };
  state.loanRules.forEach(r0 => {
    const text = role === "doc" ? docCellText(r0) : role === "stage" ? String(r0.stage || "") : whoText(r0);
    const cd = parseCell(f, text), r = JSON.parse(JSON.stringify(r0));
    r.conds = [...(r.conds || []), ...(cd ? [cd] : [])];
    put("loanRules", r, true);
  });
  if (sc.valueColors[role]) { sc.valueColors["f:" + id] = sc.valueColors[role]; delete sc.valueColors[role]; }
  if (sc.colBold[role]) { sc.colBold["f:" + id] = true; delete sc.colBold[role]; }
  sc.fields.push(f);
  sc.removed = [...new Set([...sc.removed, role])];

  sc.colOrder = order;
  saveSchema(sc);

}

function renameOption(fid, oldV, newV) {
  const swap = v => (Array.isArray(v) ? v.map(x => (x === oldV ? newV : x)) : v === oldV ? newV : v);
  const has = v => (Array.isArray(v) ? v.includes(oldV) : v === oldV);
  state.loanRules.forEach(r => {
    if (!(r.conds || []).some(cd => cd.field === fid && has(cd.value))) return;
    put("loanRules", Object.assign({}, r, { conds: r.conds.map(cd => (cd.field === fid ? Object.assign({}, cd, { value: swap(cd.value) }) : cd)) }), true);
  });
  state.loanCases.forEach(c0 => {
    const c = cloneCase(c0);
    let changed = false;
    [c.values, ...(c.borrowers || []).map(b => b && b.values), c.guarantor && c.guarantor.values, ...Object.values(c.people || {}).map(x => x && x.values)].forEach(vals => {
      if (vals && has(vals[fid])) { vals[fid] = swap(vals[fid]); changed = true; }
    });
    if (changed) put("loanCases", c, true);
  });
}

    return true;
  }
  if ((b = q("[data-cm-del]"))) {
    const key = b.closest("#colMenu").dataset.key;
    closeColMenu();
    if (key.startsWith("f:")) deleteField(key.slice(2)); else removeFixedCol(key);
    return true;
  }

  // thẻ Nhập liệu: người trong hồ sơ
  if ((b = q("[data-slotadd]"))) {
    const sc = loanSchema(), id = "p" + uid();
    sc.slots.push({ id, label: `Người ${sc.slots.length + 1}`, who: [] });
    saveSchema(sc); state.loanTab = "fields"; navRender();
    const f = $(`[data-slotid="${id}"] [data-se="label"]`); if (f) { f.focus(); f.select(); }
    return true;
  }
  if ((b = q("[data-slotmove]"))) {
    const sc = loanSchema(), i = sc.slots.findIndex(x => x.id === b.closest("[data-slotid]").dataset.slotid), j = i + Number(b.dataset.slotmove);
    if (i < 0 || j < 0 || j >= sc.slots.length) return true;
    [sc.slots[i], sc.slots[j]] = [sc.slots[j], sc.slots[i]];
    saveSchema(sc); navRender();
    return true;
  }
  if ((b = q("[data-slotdel]"))) {
    const id = b.closest("[data-slotid]").dataset.slotid, sl = loanSchema().slots.find(x => x.id === id);
    askConfirm("Xoá người khỏi form", `Bỏ ô "${sl ? sl.label : ""}" khỏi form hồ sơ? Tên và thông tin đã nhập ở ô này trong các hồ sơ cũ sẽ không hiện nữa.`, "Xoá khỏi form")
      .then(ok => { if (!ok) return; const sc = loanSchema(); sc.slots = sc.slots.filter(x => x.id !== id); saveSchema(sc); navRender(); });
    return true;
  }
  if ((b = q("[data-slotwho]"))) {
    const sc = loanSchema(), sl = sc.slots.find(x => x.id === b.closest("[data-slotid]").dataset.slotid), v = b.dataset.slotwho;
    if (!sl) return true;
    sl.who = sl.who.some(w => nrm(w) === nrm(v)) ? sl.who.filter(w => nrm(w) !== nrm(v)) : [...sl.who, v];
    saveSchema(sc); navRender();
    return true;
  }
  if ((b = q("[data-fmove]"))) {
    const sc = loanSchema(), i = sc.fields.findIndex(f => f.id === b.closest(".fld").dataset.fid), j = i + Number(b.dataset.fmove);
    if (i < 0 || j < 0 || j >= sc.fields.length) return true;
    [sc.fields[i], sc.fields[j]] = [sc.fields[j], sc.fields[i]];
    saveSchema(sc); navRender();
    return true;
  }
  if ((b = q("[data-fdel]"))) { deleteField(b.closest(".fld").dataset.fid); return true; }
  if ((b = q("[data-foaddbtn]"))) {
    const box = b.closest(".fld"), id = box.dataset.fid, inp = box.querySelector("[data-foadd]"), v = inp.value.trim();
    if (!v) { inp.focus(); return true; }
    const sc = loanSchema(), f = sc.fields.find(x => x.id === id);
    if (!f || (f.options || []).includes(v)) { inp.select(); return true; }
    f.options = [...(f.options || []), v]; saveSchema(sc); navRender();
    const again = $(`.fld[data-fid="${id}"] [data-foadd]`); if (again) again.focus();
    return true;
  }
  if ((b = q("[data-fodel]"))) {
    const id = b.closest(".fld").dataset.fid, sc = loanSchema(), f = sc.fields.find(x => x.id === id);
    if (f) { f.options = f.options.filter((_, j) => j !== Number(b.dataset.fodel)); saveSchema(sc); navRender(); }
    return true;
  }
  if ((b = q("[data-stageadd]"))) {
    const inp = $("#la-stage"), v = inp.value.trim();
    if (!v) { inp.focus(); return true; }
    const sc = loanSchema(); sc.stages.push(v); saveSchema(sc); navRender();
    const again = $("#la-stage"); if (again) again.focus();
    return true;
  }
  if ((b = q("[data-stagedel]"))) {
    const sc = loanSchema();
    if (sc.stages.length > 1) { sc.stages.pop(); saveSchema(sc); navRender(); }
    return true;
  }
  return false;
}

function loanChange(e) {
  if (state.view !== "loan") return false;
  const el = e.target;
  if (el.closest && el.closest("#impHost")) {
    if (!imp) return true;
    if (el.dataset.impHeader !== undefined) { buildImport(imp.text, el.checked); }
    else if (el.dataset.impMode) { imp.mode = el.dataset.impMode; imp.modeTouched = true; }
    else if (el.dataset.impFmt !== undefined) { imp.useFmt = el.checked; }
    else if (el.dataset.impTarget !== undefined) {
      const m = imp.map[Number(el.dataset.impTarget)];
      m.target = el.value;
      if (m.target === "new" && !m.type) { const g = matchHeader(m.title); m.type = (g && g.type) || "one"; m.scope = (g && g.scope) || "case"; }
    }
    $("#impBody").innerHTML = importBodyHTML();
    return true;
  }
  if (el.dataset && el.dataset.palcustom !== undefined) {
    const pal = el.closest("#palette");
    setValueColor(pal.dataset.col, pal.dataset.vv, pal.dataset.kind, el.value.toUpperCase()); closePalette();
    return true;
  }
  if (el.tagName === "BUTTON") return false;

  // thẻ Nhập liệu: tên ô người, giá trị Áp dụng cho gõ thêm
  if (el.dataset.se) {
    const sc = loanSchema(), sl = sc.slots.find(x => x.id === el.closest("[data-slotid]").dataset.slotid), v = el.value.trim();
    if (!sl) return true;
    if (!v) { el.value = sl.label; return true; }
    sl.label = v; saveSchema(sc);
    return true;
  }
  if (el.dataset.slotwhoadd !== undefined) {
    const sc = loanSchema(), sl = sc.slots.find(x => x.id === el.closest("[data-slotid]").dataset.slotid), v = el.value.trim();
    if (!sl || !v) return true;
    if (!sl.who.some(w => nrm(w) === nrm(v))) sl.who.push(v);
    saveSchema(sc); navRender();
    return true;
  }
  // form hồ sơ: gõ thêm lựa chọn mới rồi chọn luôn
  if (el.dataset.optadd !== undefined) {
    const v = el.value.trim(), sc = loanSchema(), f = sc.fields.find(x => x.id === el.dataset.optadd);
    if (!v || !f || !curCase()) return true;
    if (!fieldOpts(f).includes(v)) { f.options = [...(f.options || []), v]; saveSchema(sc); }
    const c = cloneCase(curCase()), fid = f.id, k = el.dataset.slot;
    const cur = el.dataset.cv ? (c.values || {})[fid] : (slotGet(c, k).values || {})[fid];
    const nv = f.type === "many" ? [...new Set([...asMany(cur), v])] : v;
    if (el.dataset.cv) c.values = Object.assign({}, c.values, { [fid]: nv });
    else slotSet(c, k, { values: Object.assign({}, slotGet(c, k).values, { [fid]: nv }) });
    saveCase(c); navRender();
    return true;
  }

  if (el.id === "casePick") { state.loanOpen = el.value || null; state.loanPage = "loan"; navRender(); $("#view-loan").scrollTop = 0; return true; }
  // hồ sơ: gắn với khách hàng trên lịch
  if (el.id === "caseClient") {
    const c = cloneCase(curCase());
    if (el.value !== "__new") { c.clientId = el.value; saveCase(c); navRender(); return true; }
    const nm = (loanPeople(c)[0] || {}).name || "";
    askText("Khách hàng mới", "Tên khách hàng trên lịch", "Tạo khách").then(name => {
      const c2 = cloneCase(curCase());
      c2.clientId = name ? put("clients", { name, companyId: "" }, true).id : caseClientId(c2);
      saveCase(c2); navRender();
    });
    const inp = $("[data-in]"); if (inp && nm) { inp.value = nm; inp.select(); }
    return true;
  }
  if (el.dataset.lf) {
    const c = cloneCase(curCase());
    slotSet(c, el.dataset.lf, { name: el.value.trim() });
    saveCase(c);
    // Vừa có tên hoặc vừa xoá tên thì dựng lại khối người, giữ nguyên chỗ con trỏ đang gõ.
    const box = $("#lfPeople"), blk = el.closest(".lf-person");
    const hasPF = loanSchema().fields.some(f => f.scope === "person");
    const shown = !!(blk && blk.querySelector(".f-case"));
    if (box && hasPF && shown !== !!el.value.trim()) {
      const pos = el.selectionStart, keep = document.activeElement === el;
      box.innerHTML = slotBlocksHTML(c);
      const again = box.querySelector('[data-lf="' + el.dataset.lf + '"]');
      if (again && keep) { again.focus(); try { again.setSelectionRange(pos, pos); } catch (err) { } }
    }
    return true;
  }
  if (el.dataset.cv || el.dataset.pv) {
    const c = cloneCase(curCase()), fid = el.dataset.cv || el.dataset.pv, f = fieldMap().get(fid);
    if (!f) return true;
    const v = f.type === "bool" ? el.checked : f.type === "number" ? (el.value === "" ? "" : Number(el.value)) : el.value;
    if (el.dataset.cv) { c.values = Object.assign({}, c.values, { [fid]: v }); }
    else { const k = el.dataset.slot; slotSet(c, k, { values: Object.assign({}, slotGet(c, k).values, { [fid]: v }) }); }
    if (f.type === "number") { const lab = el.closest(".f").querySelector("label"); if (lab) lab.textContent = f.label + (blank(v) ? "" : " · " + fmtNum(f, v)); }
    saveCase(c);
    return true;
  }
  if (el.dataset.doc !== undefined) {
    const c = cloneCase(curCase());
    c.received = c.received || {};
    if (el.checked) c.received[el.dataset.doc] = true; else delete c.received[el.dataset.doc];
    saveCase(c);
    return true;
  }

  // bảng rules
  if (el.dataset.cell) {
    const tr = el.closest("tr[data-row]");
    if (!tr) return true;
    if (tr.dataset.row === "new") {
      if (!String(el.value).trim()) return true;
      const r = put("loanRules", applyCell(newRule(), el.dataset.cell, el.value), true);
      rerenderGrid(r.id);
      return true;
    }
    const r0 = state.loanRules.find(x => x.id === tr.dataset.row);
    if (!r0) return true;
    put("loanRules", applyCell(JSON.parse(JSON.stringify(r0)), el.dataset.cell, el.value), true);
    rerenderGrid();
    return true;
  }
  if (el.dataset.colname) {
    const sc = loanSchema(), key = el.dataset.colname, v = el.value.trim();
    if (key in FIXED_COLS) {
      if (!v) { el.value = sc.colNames[key]; return true; }
      sc.colNames[key] = v; saveSchema(sc);
      return true;
    }
    const f = sc.fields.find(x => "f:" + x.id === key);
    if (!f) return true;
    if (!v) { el.value = f.label; return true; }
    f.label = v; saveSchema(sc);
    return true;
  }
  if (el.dataset.cmBold !== undefined) {
    const sc = loanSchema(), key = el.closest("#colMenu").dataset.key;
    if (el.checked) sc.colBold[key] = true; else delete sc.colBold[key];
    saveSchema(sc); rerenderGrid();
    return true;
  }
  if (el.dataset.cm === "role") {
    const key = el.closest("#colMenu").dataset.key, to = el.value;
    closeColMenu();
    if (key.startsWith("f:")) { if (to !== "cond") fieldToRole(key.slice(2), to); }
    else if (to === "cond") roleToField(key);
    else { const id = roleToField(key); if (id) fieldToRole(id, to); }
    navRender();
    return true;
  }

  // trường thông tin
  if (el.dataset.fe) {
    const id = el.closest(".fld").dataset.fid, sc = loanSchema(), f = sc.fields.find(x => x.id === id);
    if (!f) return true;
    const k = el.dataset.fe;
    if (k === "label") { const v = el.value.trim(); if (!v) { el.value = f.label; return true; } f.label = v; saveSchema(sc); return true; }
    if (k === "unit") { f.unit = el.value.trim(); saveSchema(sc); return true; }
    if (k === "scope") { f.scope = el.value; saveSchema(sc); return true; }
    if (k === "type") { retypeField(id, el.value); el.blur(); render(); return true; }
  }
  if (el.dataset.fo !== undefined) {
    const id = el.closest(".fld").dataset.fid, sc = loanSchema(), f = sc.fields.find(x => x.id === id), j = Number(el.dataset.fo);
    if (!f) return true;
    const old = f.options[j], nv = el.value.trim();
    if (!nv || nv === old || f.options.includes(nv)) { el.value = old; return true; }
    f.options[j] = nv; saveSchema(sc); renameOption(id, old, nv);
    return true;
  }
  if (el.dataset.stage !== undefined) {
    const sc = loanSchema(), i = Number(el.dataset.stage), v = el.value.trim();
    if (!v) { el.value = sc.stages[i]; return true; }
    sc.stages[i] = v; saveSchema(sc);
    return true;
  }
  return false;
}

// Enter / mũi tên lên xuống để đi giữa các dòng, như bảng tính.
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("#palette")) { closePalette(); return; }
  if (e.key === "Escape" && state.colMenu) { closeColMenu(); return; }
  const el = e.target;
  if (state.view !== "loan" || !el.dataset || !el.dataset.cell) return;
  const vert = e.key === "Enter" || (el.tagName === "INPUT" && (e.key === "ArrowDown" || e.key === "ArrowUp"));
  if (!vert) return;
  const up = e.key === "ArrowUp" || (e.key === "Enter" && e.shiftKey);
  const tr = el.closest("tr"), next = up ? tr.previousElementSibling : tr.nextElementSibling;
  const t = next && next.querySelector(`[data-cell="${el.dataset.cell}"]`);
  e.preventDefault();
  if (t) { t.focus(); if (t.select) t.select(); } else el.blur();
});
// Dán nhiều ô copy từ Google Sheet: rải vào bảng từ ô đang chọn, thêm dòng khi cần.
document.addEventListener("paste", e => {
  const el = e.target;
  if (state.view !== "loan" || !el.dataset || !el.dataset.cell || !el.closest("#sheetBody")) return;
  const txt = ((e.clipboardData || window.clipboardData).getData("text") || "").replace(/\r/g, "").replace(/\n+$/, "");
  if (!/[\t\n]/.test(txt)) return;   // chỉ một ô: để trình duyệt dán bình thường
  e.preventDefault();
  const lines = parseTSV(txt);
  // Có dòng tiêu đề: ghép theo tên cột thay vì theo vị trí ô đang đứng.
  if (lines.length && looksLikeHeader(lines[0])) { el.blur(); openImport(txt, (e.clipboardData || window.clipboardData).getData("text/html") || ""); return; }
  const keys = sheetCols().map(c => c.key);
  const start = keys.indexOf(el.dataset.cell);
  const rows = sheetRules(), tr = el.closest("tr");
  let at = tr.dataset.row === "new" ? rows.length : rows.findIndex(r => r.id === tr.dataset.row);
  lines.forEach((vals, i) => {
    let r = rows[at + i] ? JSON.parse(JSON.stringify(rows[at + i])) : newRule();
    vals.forEach((v, j) => { if (keys[start + j]) r = applyCell(r, keys[start + j], v); });
    put("loanRules", r, true);
  });
  el.blur(); rerenderGrid();
});
// Kéo tiêu đề cột: thả vào nửa trái thì chèn trước, nửa phải thì chèn sau.
let dragCol = null;
document.addEventListener("dragstart", e => {
  const th = e.target.closest && e.target.closest("th[data-colkey]");
  if (!th) return;
  dragCol = th.dataset.colkey;
  th.classList.add("dragging");
  if (e.dataTransfer) { e.dataTransfer.effectAllowed = "move"; try { e.dataTransfer.setData("text/plain", dragCol); } catch (err) { } }
});
document.addEventListener("dragover", e => {
  if (!dragCol) return;
  const th = e.target.closest && e.target.closest("th[data-colkey]");
  if (!th) return;
  e.preventDefault();
  const r = th.getBoundingClientRect(), after = e.clientX > r.left + r.width / 2;
  $$("th[data-colkey]").forEach(x => x.classList.remove("drop-left", "drop-right"));
  th.classList.add(after ? "drop-right" : "drop-left");
});
document.addEventListener("drop", e => {
  if (!dragCol) return;
  const th = e.target.closest && e.target.closest("th[data-colkey]");
  $$("th[data-colkey]").forEach(x => x.classList.remove("drop-left", "drop-right", "dragging"));
  if (th) { e.preventDefault(); const r = th.getBoundingClientRect(); dropCol(dragCol, th.dataset.colkey, e.clientX > r.left + r.width / 2); }
  dragCol = null;
});
document.addEventListener("dragend", () => {
  $$("th[data-colkey]").forEach(x => x.classList.remove("drop-left", "drop-right", "dragging"));
  dragCol = null;
});
document.addEventListener("scroll", e => {

  if (state.colMenu) closeColMenu();
}, true);
document.addEventListener("keydown", e => {

});

      <div class="card-h"><h2>Danh sách ngày lễ</h2><div class="spacer"></div>
        <div style="display:flex;align-items:center;gap:4px;flex:0 0 auto">
          <button class="btn icon ghost" data-holyear="-1" aria-label="Năm trước" style="flex:0 0 30px;width:30px">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M15 5l-7 7 7 7"/></svg></button>
          <span class="num" style="font-weight:600;min-width:46px;text-align:center">${holYear()}</span>
          <button class="btn icon ghost" data-holyear="1" aria-label="Năm sau" style="flex:0 0 30px;width:30px">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 5l7 7-7 7"/></svg></button>
        </div></div>
      <div style="padding:6px 0 0">
        ${state.holidays.map(h => ({ h, ds: holidayDates(h, holYear()) }))
      .sort((a, b) => (a.ds[0] || "").localeCompare(b.ds[0] || ""))
      .map(({ h, ds }) => `<div class="seti">
          <i class="swatch" style="background:var(--ot);width:14px;height:14px"></i>
          <div><div class="nm">${esc(h.name || "Ngày lễ")}</div>
          <div class="mt">${holRuleText(h)}</div>
          <div class="mt num" style="color:var(--ot)">${h.date ? holRangeText(ds) : `Năm ${holYear()}: ${holRangeText(ds)}`}</div></div>
          <div class="acts"><button class="btn danger" data-delhol="${h.id}">Xoá</button></div>
        </div>`).join("") || `<div class="empty"><b>Chưa khai ngày lễ nào.</b>Nhiệm vụ rơi vào ngày lễ sẽ bị tính như ngày thường.</div>`}
        <div class="addrow">
          <select id="nhKind" aria-label="Kiểu ngày lễ">
            <option value="md">Hằng năm, dương lịch</option>
            <option value="lunar">Hằng năm, âm lịch</option>
            <option value="once">Một ngày cụ thể</option>
          </select>
          <input id="nhDate" type="date" value="${iso(state.cursor)}" aria-label="Ngày">
          <input id="nhLD" class="hide" type="number" min="1" max="30" placeholder="Ngày âm" aria-label="Ngày âm" style="width:96px">
          <input id="nhLM" class="hide" type="number" min="1" max="12" placeholder="Tháng âm" aria-label="Tháng âm" style="width:96px">
          <input id="nhSpan" type="number" min="1" max="10" value="1" title="Số ngày nghỉ" aria-label="Số ngày nghỉ" style="width:72px">
          <input id="nhName" placeholder="Tên ngày lễ" style="flex:1;min-width:140px">
          <button class="btn primary" id="nhAdd">Thêm</button>
        </div>
        <div class="note-box" style="margin:0 14px 14px;display:flex;flex-direction:column;gap:10px;align-items:flex-start">
          <span>Quy tắc hằng năm tự áp cho mọi năm, kể cả lễ âm lịch: trang tự đổi sang ngày dương của từng năm.
          Bấm mũi tên ở đầu thẻ để xem trước ngày nghỉ của năm khác. Ô số là số ngày nghỉ liên tiếp.</span>
          <button class="btn" id="nhFill">Thêm các ngày lễ Việt Nam cho mọi năm</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-h"><h2>Người làm</h2><div class="spacer"></div><span class="lbl">${state.people.length} người</span></div>
      <div style="padding:6px 0 0">
        ${state.people.map(p => `<div class="seti">
          <i class="swatch" style="background:${p.color};width:14px;height:14px"></i>
          <div><div class="nm">${esc(p.name)}${p.id === state.me ? ` <span class="pill live">Tôi</span>` : ""}</div>
          <div class="mt">${state.tasks.filter(t => worksHere(t, p.id)).length} ca làm đã tham gia</div></div>
          <div class="acts">
            <button class="btn" data-peek="person:${p.id}">Xem việc</button>
            <button class="btn" data-editpe="${p.id}">Sửa</button>
            <button class="btn danger" data-delpe="${p.id}">Xoá</button>
          </div>
        </div>`).join("") || `<div class="empty"><b>Chưa có ai.</b>Thêm người để gán nhiệm vụ.</div>`}
        <div class="addrow">
          <input id="npName" placeholder="Tên người làm" style="flex:1;min-width:170px">
          <button class="btn primary" id="npAdd">Thêm người</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-h"><h2>Dữ liệu</h2></div>
      <div class="card-b" style="display:flex;flex-direction:column;gap:12px">
        <div class="note-box">
          ${remote
      ? "Dữ liệu được lưu trên máy chủ của trang này, ai mở link cũng thấy cùng một lịch."
      : "Trang đang lưu dữ liệu trong trình duyệt này. Mở ở máy khác sẽ là một bản riêng."}
          Công ty và người làm thêm ở ngay đây. Khách hàng thêm trong hộp thoại ca làm hoặc ở hồ sơ khách.
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn" id="expBtn">Tải xuống bản sao JSON</button>
          ${COLLS.some(c => state[c].some(x => x.demo)) ? `<button class="btn danger" id="demoWipe2">Xoá dữ liệu mẫu</button>` : ""}
          <button class="btn danger" id="wipeBtn">Xoá toàn bộ nhiệm vụ</button>
        </div>
      </div>
    </div>`;
}

/* ============================== hộp thoại nhiệm vụ ============================== */
function openTask(t) {
  const isNew = !t.id;
  const d = t.date || iso(state.cursor);
  const host = $("#modalHost");
  host.innerHTML = `
  <div class="scrim" id="scrim">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
      <div class="modal-h">
        <h2 id="mTitle">${isNew ? "Ca làm mới" : "Chi tiết ca làm"}</h2>
        <div class="spacer" style="flex:1"></div>
        <button class="btn icon ghost" id="mClose" aria-label="Đóng">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="modal-b tk-modal">
        <div class="row">
          <div class="f"><label>Công ty</label>
            <select id="tCo">
              <option value="">— chưa gán —</option>
              ${state.companies.map(c => `<option value="${c.id}" ${c.id === t.companyId ? "selected" : ""}>${esc(c.name)}</option>`).join("")}
              <option value="__new">+ Thêm công ty mới…</option>
            </select>
            <div class="inline-add hide" id="coNew">
              <input class="nm" placeholder="Tên công ty">
              <select><option value="hour">Theo giờ</option><option value="day">Theo ngày</option><option value="fixed">Cố định tháng</option></select>
              <input class="rate" type="number" min="0" step="1000" placeholder="Đơn giá ₫">
              <button type="button" class="btn primary">Thêm</button>
            </div>
          </div>
          <div class="f"><label>Ngày</label><input type="date" id="tDate" value="${d}"></div>
        </div>
        <div class="row">
          <div class="f"><label>Bắt đầu</label><input type="time" id="tStart" value="${t.start || "09:00"}" step="300"></div>
          <div class="f"><label>Kết thúc</label><input type="time" id="tEnd" value="${t.end || "17:00"}" step="300"></div>
        </div>
        <div class="chips tk-quick" id="tQuick">
          <button type="button" data-h="0.5">30 phút</button>
          <button type="button" data-h="1">1 tiếng</button>
          <button type="button" data-h="2">2 tiếng</button>
          <button type="button" data-h="4">Nửa ca</button>
          <button type="button" data-h="8">Cả ca</button>
        </div>
        <div id="tSum"></div>
        <div id="tHints" style="display:flex;flex-direction:column;gap:6px"></div>

        <details class="tk-tasks" id="tTasks" ${state.taskFold === false ? "" : "open"}>
          <summary><span class="stage-chev"></span><b>Người làm</b><span class="lbl" id="tTasksCount"></span>
            <div class="spacer" style="flex:1"></div>
            <span class="tk-add" id="tCrewAdd" role="button" tabindex="0" title="Thêm người làm vào ca" aria-label="Thêm người làm">+</span></summary>
          <div id="tCrew" class="crew"></div>
          <div class="tk-note">Mỗi người làm có danh sách việc riêng. Bấm + ở đầu để thêm người, bấm + trong View Tasks để thêm việc cho người đó.</div>
        </details>

        <div class="row">
          <div class="f"><label>Loại ngày</label><select id="tDay">
            <option value="" ${!t.dayType ? "selected" : ""}>Tự nhận theo lịch</option>
            <option value="normal" ${t.dayType === "normal" ? "selected" : ""}>Ngày thường</option>
            <option value="weekend" ${t.dayType === "weekend" ? "selected" : ""}>Ngày nghỉ tuần</option>
            <option value="holiday" ${t.dayType === "holiday" ? "selected" : ""}>Ngày lễ</option>
            <option value="leave" ${t.dayType === "leave" ? "selected" : ""}>Nghỉ có lương</option>
          </select></div>
          <div class="f"><label>Tăng ca</label>
            <label class="switch" for="tOt" style="padding:7px 10px">
              <input type="checkbox" id="tOt" ${t.overtime ? "checked" : ""}>
              <span class="txt"><b>Tính tăng ca</b><small>chỉ dùng cho ngày thường</small></span>
            </label>
          </div>
        </div>
        <div class="f ${t.overtime ? "" : "hide"}" id="tNoteWrap"><label>Ghi chú tăng ca</label>
          <input id="tNote" value="${esc(t.note || "")}" placeholder="Lý do tăng ca"></div>
        ${isNew ? `<div class="row">
          <div class="f"><label>Lặp lại</label><select id="tRep">
            <option value="">Không lặp</option>
            <option value="day">Mỗi ngày</option>
            <option value="wday">Thứ hai đến thứ sáu</option>
            <option value="week">Mỗi tuần, cùng thứ</option>
          </select></div>
          <div class="f"><label>Số buổi</label><input type="number" id="tRepN" min="1" max="60" value="5" disabled></div>
        </div>` : ""}
      </div>
      <div class="modal-f">
        ${isNew ? `<span></span>` : `<button class="btn danger" id="mDel">Xoá ca làm</button>`}
        <button class="btn primary" id="mSave">${isNew ? "Tạo ca làm" : "Lưu thay đổi"}</button>
      </div>
    </div>
  </div>`;

  // Người làm trong ca. Mỗi người có danh sách việc riêng, như slide 21.
  let crew = taskCrew(t);
  if (!crew.length) crew = [{ id: uid(), personId: state.me || "", items: [] }];
  const clientOpts = sel => clientOptsHTML(sel, "Thêm khách hàng mới…");
  const peopleOpts = sel => `<option value="">— chưa gán người —</option>` +
    state.people.map(x => `<option value="${x.id}" ${x.id === sel ? "selected" : ""}>${esc(x.name)}</option>`).join("") +
    `<option value="__newpe">+ Thêm người làm mới…</option>`;
  const drawItems = () => {
    if (typeof drawSum === "function") setTimeout(drawSum, 0);
    const box = $("#tCrew");
    if (!box) return;
    box.innerHTML = crew.map((w, wi) => `<div class="crew-w" data-w="${wi}">
      <div class="crew-h">
        <select data-wpe aria-label="Người làm">${peopleOpts(w.personId)}</select>
        ${crew.length > 1 ? `<button type="button" class="btn icon ghost" data-wdel title="Bỏ người này khỏi ca" aria-label="Bỏ người này khỏi ca">×</button>` : ""}
      </div>
      <details class="crew-tasks" ${w.fold ? "" : "open"} data-wfold="${wi}">
        <summary><span class="stage-chev"></span>Xem việc<span class="lbl">${w.items.filter(x => x.done).length}/${w.items.length} xong</span>
          <div class="spacer" style="flex:1"></div>
          <span class="tk-add" data-wadd="${wi}" role="button" tabindex="0" title="Thêm việc cho người này" aria-label="Thêm việc">+</span></summary>
        <div class="items">${w.items.length ? w.items.map((it, i) => `<div class="item-row" data-i="${i}">
          <button type="button" class="it-done ${it.done ? "on" : ""}" data-idone aria-pressed="${it.done}" title="${it.done ? "Đã xong" : "Chưa xong"}">${it.done ? "✓" : ""}</button>
          <input data-itext value="${esc(it.text)}" placeholder="Việc cần làm, ví dụ: Do SOCA">
          <select data-icl aria-label="Khách hàng của việc">${clientOpts(it.clientId)}</select>
          ${it.clientId ? `<button type="button" class="btn icon ghost" data-iprofile="${it.clientId}" title="Mở hồ sơ khách" aria-label="Mở hồ sơ khách">↗</button>` : ""}
          <button type="button" class="btn icon ghost" data-idel title="Xoá việc" aria-label="Xoá việc">×</button>
        </div>`).join("") : `<div style="font-size:12.5px;color:var(--muted)">Chưa có việc nào. Bấm + để thêm.</div>`}</div>
      </details>
    </div>`).join("");
  };
  const readItems = () => {
    $$("#tCrew .crew-w").forEach(wEl => {
      const w = crew[Number(wEl.dataset.w)];
      if (!w) return;
      const psel = $("[data-wpe]", wEl);
      if (psel && psel.value !== "__newpe") w.personId = psel.value;
      $$(".item-row", wEl).forEach(row => {
        const it = w.items[Number(row.dataset.i)];
        if (!it) return;
        it.text = $("[data-itext]", row).value;
        const v = $("[data-icl]", row).value;
        if (v !== "__new") it.clientId = pickClient(v, $("#tCo").value);
      });
    });
  };
  const addItem = wi => {
    readItems();
    crew[wi].items.push({ id: uid(), text: "", clientId: "", done: false });
    crew[wi].fold = false;
    drawItems();
    const rows = $$(`#tCrew .crew-w[data-w="${wi}"] [data-itext]`);
    if (rows.length) rows[rows.length - 1].focus();
  };

  const upd = () => {
    const sv = $("#tStart").value, evv = $("#tEnd").value;
    if (!sv || !evv) return;
    const h = dur({ start: sv, end: evv });
    const overnight = toMin(evv) <= toMin(sv);
    const hints = [];
    if (overnight) hints.push(["mild", "Ca này kết thúc sang ngày hôm sau."]);
    else if (h > 8) hints.push(["mild", `Ca dài ${fmtH(h)}, hơn một ca chuẩn tám tiếng.`]);
    const pid = (crew[0] || {}).personId || "", date = $("#tDate").value;
    if (pid && pid !== "__new" && date) {
      const s0 = toMin(sv); let e0 = toMin(evv); if (e0 <= s0) e0 += 1440;
      const clash = state.tasks.filter(x => x.id !== t.id && x.date === date && worksHere(x, pid))
        .filter(x => { let a = toMin(x.start), b = toMin(x.end); if (b <= a) b += 1440; return a < e0 && s0 < b; });
      if (clash.length) hints.push(["", `Trùng giờ với ${clash.map(x => esc(taskLabel(x)) + ` ${x.start}–${x.end}`).join(", ")}. Phần giờ trùng sẽ bị cộng hai lần khi tính lương.`]);
    }
    // Loại ngày và phần trăm đang áp dụng
    const cid = $("#tCo").value;
    const probe = { date, start: sv, end: evv, overtime: $("#tOt").checked, dayType: $("#tDay").value };
    const kind = dayTypeOf(probe), nh = nightHours(probe);
    const cc = cid && cid !== "__new" ? co(cid) : null;
    if (cc) {
      const m = Math.round(multOf(probe, cc) * 100);
      const np = Math.round((cc.otNight === undefined ? PCT.night : cc.otNight) * 100);
      const hol = holidayOn(date);
      let msg = `${DAYNAME[kind]}${hol && !probe.dayType ? ` · ${esc(hol.name)}` : ""} · trả ${m}% lương giờ`;
      if (nh) msg += `, trong đó ${fmtH(nh)} ban đêm được cộng thêm ${np}%`;
      hints.push([m > 100 || nh ? "" : "mild", msg]);
    } else hints.push(["mild", "Chưa gán công ty nên nhiệm vụ này chỉ cộng giờ, không ra tiền."]);
    $("#tHints").innerHTML = hints.map(([k, m]) => `<div class="hint-note ${k}">${m}</div>`).join("");
    drawSum();
  };
  // Tổng giờ, tiền của ca và thông tin khách lấy từ hồ sơ vay (master data).
  const drawSum = () => {
    const box = $("#tSum"); if (!box) return;
    const cid = $("#tCo").value, probe = {
      date: $("#tDate").value, start: $("#tStart").value, end: $("#tEnd").value,
      companyId: cid === "__new" ? "" : cid, overtime: $("#tOt").checked, dayType: $("#tDay").value,
    };
    const pay = payOf(probe), sc = loanSchema();
    const items = crew.flatMap(w => w.items);
    const ids = [...new Set(items.map(x => x.clientId).filter(Boolean))];
    const line = id => {
      const kase = state.loanCases.find(x => caseClientId(x) === id);
      const info = kase ? caseSummary(kase, sc.fields) : "";
      return `<div class="sum-cl">
        <b>${esc((cl(id) || {}).name || "Khách")}</b>
        <span>${esc(info || (kase ? "hồ sơ chưa nhập thông tin" : "chưa có hồ sơ vay"))}</span>
        ${kase ? `<button type="button" class="btn" data-opencase="${kase.id}">Mở hồ sơ</button>`
        : `<button type="button" class="btn" data-newcase="${id}">Tạo hồ sơ</button>`}
      </div>`;
    };
    const cnt = $("#tTasksCount");
    if (cnt) cnt.textContent = `${crew.length} người · ${items.filter(x => x.done).length}/${items.length} việc xong`;
    box.innerHTML = `<div class="t-sum">
      <div class="sum-row">
        <div><div class="lbl">Tổng giờ</div><b class="num">${fmtH(pay.h)}</b></div>
        <div><div class="lbl">Tiền công</div><b class="money">${pay.noCo ? "—" : vnd(pay.amount)}</b></div>
        <div><div class="lbl">Giờ đêm</div><b class="num">${pay.night ? fmtH(pay.night) : "—"}</b></div>
        <div><div class="lbl">Loại ngày</div><b>${DAYNAME[pay.k]}${pay.mult > 1 ? ` · ${Math.round(pay.mult * 100)}%` : ""}</b></div>
      </div>
      ${ids.length ? ids.map(line).join("") : ""}
    </div>`;
  };

  // Dời giờ bắt đầu thì giữ nguyên thời lượng, giống Google.
  let lastStart = $("#tStart").value;
  $("#tStart").addEventListener("change", () => {
    const ns = $("#tStart").value;
    if (ns) {
      const os = toMin(lastStart);
      let e0 = toMin($("#tEnd").value); if (e0 <= os) e0 += 1440;
      $("#tEnd").value = fromMin((toMin(ns) + (e0 - os)) % 1440);
      lastStart = ns;
    }
    upd();
  });
  $("#tEnd").addEventListener("change", upd);
  $("#tStart").addEventListener("input", upd);
  $("#tEnd").addEventListener("input", upd);
  ["tDate", "tCo", "tDay", "tOt"].forEach(id => $("#" + id).addEventListener("change", upd));
  $("#tQuick").addEventListener("click", e => {
    const b = e.target.closest("[data-h]"); if (!b) return;
    $("#tEnd").value = fromMin((toMin($("#tStart").value) + Math.round(Number(b.dataset.h) * 60)) % 1440);
    lastStart = $("#tStart").value;
    upd();
  });
  $("#tOt").addEventListener("change", e => $("#tNoteWrap").classList.toggle("hide", !e.target.checked));
  if (isNew) $("#tRep").addEventListener("change", e => { $("#tRepN").disabled = !e.target.value; });
  upd();
  drawItems();
  drawSum();
  $("#tCrewAdd").addEventListener("click", e => {
    e.preventDefault(); e.stopPropagation();
    setTimeout(() => { const d = $("#tTasks"); if (d) d.open = true; }, 0);
    readItems();
    crew.push({ id: uid(), personId: "", items: [] });
    drawItems();
    const sels = $$("#tCrew [data-wpe]"); if (sels.length) sels[sels.length - 1].focus();
  });
  $("#tCrew").addEventListener("click", e => {
    const wEl = e.target.closest(".crew-w"); if (!wEl) return;
    const wi = Number(wEl.dataset.w);
    const add = e.target.closest("[data-wadd]");
    if (add) { e.preventDefault(); e.stopPropagation(); const d = wEl.querySelector("details"); setTimeout(() => { if (d) d.open = true; }, 0); addItem(wi); return; }
    if (e.target.closest("[data-wdel]")) {
      readItems();
      const w = crew[wi], name = peName(w.personId);
      if (!w.items.length) { crew.splice(wi, 1); drawItems(); return; }
      askConfirm("Bỏ người khỏi ca", `Bỏ ${w.personId ? `"${name}"` : "người này"} cùng ${w.items.length} việc của họ khỏi ca? Không lấy lại được.`, "Bỏ khỏi ca")
        .then(ok => { if (ok) { crew.splice(wi, 1); drawItems(); } });
      return;
    }
    const row = e.target.closest(".item-row"); if (!row) return;
    const i = Number(row.dataset.i);
    if (e.target.closest("[data-idone]")) { readItems(); crew[wi].items[i].done = !crew[wi].items[i].done; drawItems(); return; }
    if (e.target.closest("[data-idel]")) { readItems(); crew[wi].items.splice(i, 1); drawItems(); return; }
    const prof = e.target.closest("[data-iprofile]");
    if (prof) { readItems(); saveTask(); openPeek("client", prof.dataset.iprofile); }
  });
  // Chọn "+ Thêm khách hàng mới…" hoặc "+ Thêm người làm mới…" ngay trong dòng.
  $("#tCrew").addEventListener("change", e => {
    const wEl = e.target.closest(".crew-w"); if (!wEl) return;
    const wi = Number(wEl.dataset.w);
    if (e.target.matches("[data-wpe]")) {
      readItems();
      if (e.target.value !== "__newpe") { crew[wi].personId = e.target.value; drawItems(); return; }
      askText("Người làm mới", "Tên người làm", "Thêm người").then(name => {
        readItems();
        if (name) crew[wi].personId = put("people", { name, color: PALETTE[(state.people.length + 2) % PALETTE.length] }, true).id;
        drawItems();
      });
      return;
    }
    const row = e.target.closest(".item-row"); if (!row || !e.target.matches("[data-icl]")) return;
    const i = Number(row.dataset.i);
    readItems();
    if (e.target.value !== "__new") { crew[wi].items[i].clientId = pickClient(e.target.value, $("#tCo").value); drawItems(); return; }
    askText("Khách hàng mới", "Tên khách hàng", "Thêm khách").then(name => {
      readItems();
      if (name) { const cur = $("#tCo").value; crew[wi].items[i].clientId = newClient(name, cur === "__new" ? "" : cur).id; }
      drawItems();
    });
  });
  $("#tCrew").addEventListener("toggle", e => {
    const wEl = e.target.closest(".crew-w"); if (!wEl) return;
    const w = crew[Number(wEl.dataset.w)]; if (w) w.fold = !e.target.open;
  }, true);
  // dùng chính phần tử phát sự kiện: hộp thoại đóng rồi thì tra lại theo id sẽ ra null
  $("#tTasks").addEventListener("toggle", e => { state.taskFold = e.target.open; });
  setTimeout(() => { const f = $$("#tCrew [data-itext]")[0] || $("#tCo"); if (f) f.focus(); }, 30);

  // Thêm thẳng công ty / khách hàng / người làm ngay trong hộp thoại,
  // khỏi phải rời sang màn hình Thiết lập.
  const refill = (sel, coll, label, keep) => {
    sel.innerHTML = `<option value="">— chưa gán —</option>` +
      state[coll].map(o => `<option value="${o.id}">${esc(o.name)}</option>`).join("") +
      `<option value="__new">+ ${label}</option>`;
    sel.value = keep || "";
  };
  const wire = (selId, boxId, create) => {
    const sel = $("#" + selId), box = $("#" + boxId);
    sel.addEventListener("change", () => {
      const open = sel.value === "__new";
      box.classList.toggle("hide", !open);
      if (open) $("input.nm", box).focus();
    });
    const go = () => {
      const nm = $("input.nm", box);
      if (!nm.value.trim()) return nm.focus();
      create(box, nm.value.trim());
      box.classList.add("hide");
      $$("input", box).forEach(i => { i.value = ""; });
    };
    $("button", box).addEventListener("click", go);
    $$("input", box).forEach(i => i.addEventListener("keydown", ev => {
      if (ev.key === "Enter") { ev.preventDefault(); go(); }
    }));
  };

  wire("tCo", "coNew", (box, name) => {
    const o = put("companies", {
      name, mode: $("select", box).value, rate: Number($("input.rate", box).value) || 0,
      ot: 1.5, hpd: 8, color: PALETTE[state.companies.length % PALETTE.length],
    });
    refill($("#tCo"), "companies", "Thêm công ty mới…", o.id);
  });

  const close = () => { host.innerHTML = ""; };
  $("#mClose").onclick = close;   // đóng bằng dấu X, phím Esc hoặc bấm ra ngoài
  $("#scrim").onclick = e => { if (e.target.id === "scrim") close(); };
  document.addEventListener("keydown", function onEsc(e) {
    if (e.key === "Escape") { close(); document.removeEventListener("keydown", onEsc); }
  });
  if (!isNew) $("#mDel").onclick = () => {
    const n = crew.reduce((a, w) => a + w.items.length, 0);   // đếm từ danh sách người làm đang mở
    askConfirm("Xoá ca làm", `Xoá ca ${taskLabel(t)} ngày ${t.date} cùng ${n} việc trong ca? Không lấy lại được.`, "Xoá ca")
      .then(ok => { if (ok) { drop("tasks", t.id); close(); } });
  };
  // Gom nội dung đang gõ thành một ca để lưu.
  const buildTask = () => {
    readItems();
    const ot = $("#tOt").checked;
    const pick = id => { const v = $(id).value; return v === "__new" ? "" : v; };
    const keepCrew = crew.map(w => ({
      id: w.id, personId: w.personId,
      items: w.items.filter(x => (x.text || "").trim() || x.clientId),
    })).filter(w => w.personId || w.items.length);
    const all = keepCrew.flatMap(w => w.items);
    const first = keepCrew[0] || { personId: "", items: [] };
    return Object.assign({}, t, {
      crew: keepCrew.length ? keepCrew : [{ id: uid(), personId: "", items: [] }],
      // giữ các trường cũ để bản dữ liệu trước vẫn đọc được
      items: first.items, title: (all[0] || {}).text || "", desc: "",
      date: $("#tDate").value, start: $("#tStart").value, end: $("#tEnd").value,
      companyId: pick("#tCo"), clientId: (all[0] || {}).clientId || "", personId: first.personId,
      overtime: ot, note: ot ? $("#tNote").value.trim() : "",
      dayType: $("#tDay").value, done: all.length ? all.every(x => x.done) : !!t.done,
    });
  };
  const saveTask = () => { const b = put("tasks", buildTask()); t.id = b.id; return b; };
  $("#mSave").onclick = () => {
    const base = buildTask();
    const rep = isNew ? $("#tRep").value : "";
    const want = rep ? Math.max(1, Math.min(60, Number($("#tRepN").value) || 1)) : 1;
    let d0 = parseISO(base.date), made = 0, guard = 0;
    while (made < want && guard++ < 500) {
      if (rep !== "wday" || (d0.getDay() >= 1 && d0.getDay() <= 5)) {
        put("tasks", Object.assign({}, base, {
          id: made === 0 ? t.id : undefined, date: iso(d0),
          crew: base.crew.map(w => Object.assign({}, w, {
            id: made === 0 ? w.id : uid(),
            items: w.items.map(x => Object.assign({}, x, { id: made === 0 ? x.id : uid() })),
          })),
        }));
        made++;
      }
      if (!rep) break;
      d0 = addDays(d0, rep === "week" ? 7 : 1);
    }
    close();
  };
}

/* ---- hộp xác nhận riêng: confirm() của trình duyệt bị chặn trong khung nhúng ----
   Hai nút dưới đây khai kiểu thẳng trong thẻ, không dùng lớp .btn hay .modal-f,
   để không quy tắc nào trong bảng kiểu chạm tới được. flex:1 1 0 cho hai nút
   rộng đúng bằng nhau và luôn nằm trong hàng, dù bảng kiểu có ra sao. */
const ASKBTN = "flex:1 1 0;min-width:0;width:auto;padding:9px 14px;border-radius:999px;" +
  "border:1px solid;font:inherit;font-size:13.5px;font-weight:500;line-height:1.3;" +
  "cursor:pointer;white-space:nowrap;overflow:hidden;text-align:center;";
function askConfirm(title, body, okLabel) {
  return new Promise(resolve => {
    const host = document.createElement("div");
    host.innerHTML = `<div class="scrim" data-ask>
      <div class="modal" style="width:min(430px,100%)" role="alertdialog" aria-modal="true">
        <div class="modal-h"><h2>${esc(title)}</h2></div>
        <div class="modal-b"><p style="margin:0;font-size:13.5px;line-height:1.6;color:var(--ink-2)">${esc(body)}</p></div>
        <div style="display:flex;gap:10px;padding:14px 22px;border-top:1px solid var(--line)">
          <button type="button" data-no style="${ASKBTN}background:var(--surface);border-color:var(--line-2);color:var(--ink-2)">Giữ lại</button>
          <button type="button" data-yes style="${ASKBTN}background:var(--ot-soft);border-color:var(--ot-line);color:var(--ot)">${esc(okLabel)}</button>
        </div>
      </div></div>`;
    document.body.appendChild(host);
    const done = v => { host.remove(); document.removeEventListener("keydown", onKey); resolve(v); };
    function onKey(e) { if (e.key === "Escape") done(false); }
    document.addEventListener("keydown", onKey);
    host.querySelector("[data-no]").onclick = () => done(false);
    host.querySelector("[data-yes]").onclick = () => done(true);
    host.querySelector("[data-ask]").onclick = e => { if (e.target.hasAttribute("data-ask")) done(false); };
    setTimeout(() => host.querySelector("[data-yes]").focus(), 30);
  });
}

// Hộp nhập một dòng, dùng khi cần thêm nhanh một tên mà không rời hộp thoại đang mở.
function askText(title, label, okLabel) {
  return new Promise(resolve => {
    const host = document.createElement("div");
    host.innerHTML = `<div class="scrim" data-ask style="z-index:90">
      <div class="modal" style="width:min(420px,100%)" role="dialog" aria-modal="true">
        <div class="modal-h"><h2>${esc(title)}</h2></div>
