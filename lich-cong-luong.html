<title>Callender</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..700&family=Be+Vietnam+Pro:wght@400;500;600;700&family=Roboto:wght@400;500&display=swap">
<style>
:root{
  color-scheme:light;
  --ground:#F9FBFD;
  --surface:#FFFFFF;
  --surface-2:#F1F5FA;
  --surface-3:#E7EEF8;
  --line:#E4EAF3;
  --line-2:#CEDAE8;
  --ink:#1A2331;
  --ink-2:#4B5A6C;
  --muted:#7C8B9E;
  --accent:#2563EB;
  --accent-ink:#1D4ED8;
  --accent-soft:#EAF1FE;
  --accent-line:#C8DBFB;
  --ot:#D93F22;
  --ot-soft:#FDEDE8;
  --ot-line:#F6C9BB;
  --ok:#2E8F61;
  --ok-soft:#E8F4EE;
  --shadow-1:0 1px 2px rgba(26,35,49,.05);
  --shadow-2:0 2px 4px rgba(26,35,49,.05), 0 12px 28px -14px rgba(26,35,49,.28);
  --shadow-3:0 8px 20px -6px rgba(26,35,49,.14), 0 32px 60px -24px rgba(26,35,49,.4);
  --r-xs:7px; --r-sm:10px; --r:14px; --r-lg:20px; --r-xl:26px;
  --slot:60px;
  --grid:#DCE5F1;
  /* Brief yêu cầu Agrandir Wide. Font đó không có bản web miễn phí, dùng Archivo dạng hơi rộng,
     vẫn đủ dấu tiếng Việt; Be Vietnam Pro làm font dự phòng. */
  --sans:"Archivo", "Be Vietnam Pro", "Segoe UI", system-ui, -apple-system, sans-serif;
  --wide:"Archivo", "Be Vietnam Pro", system-ui, sans-serif;
  --mono:"Archivo", "Be Vietnam Pro", system-ui, sans-serif;   /* nhãn và số cũng dùng font của brief */
  --code:ui-monospace, "Cascadia Code", Consolas, monospace;    /* riêng ví dụ cú pháp trong Rules */
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0F141B;
    --surface:#161D26;
    --surface-2:#1D2632;
    --surface-3:#25313F;
    --line:#28323F;
    --line-2:#3A4757;
    --ink:#EDF3FA;
    --ink-2:#BCC9D8;
    --muted:#8698AC;
    --accent:#6FA8FF;
    --accent-ink:#A9CBFF;
    --accent-soft:#17263B;
    --accent-line:#2C4A70;
    --ot:#FF8163;
    --ot-soft:#3D2019;
    --ot-line:#5C3025;
    --ok:#5BC191;
    --ok-soft:#1E2E27;
    --shadow-1:0 1px 2px rgba(0,0,0,.4);
    --shadow-2:0 2px 4px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.8);
    --shadow-3:0 8px 20px -6px rgba(0,0,0,.5), 0 32px 60px -24px rgba(0,0,0,.9);
    --grid:#2F3C4B;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0F141B;
  --surface:#161D26;
  --surface-2:#1D2632;
  --surface-3:#25313F;
  --line:#28323F;
  --line-2:#3A4757;
  --ink:#EDF3FA;
  --ink-2:#BCC9D8;
  --muted:#8698AC;
  --accent:#6FA8FF;
  --accent-ink:#A9CBFF;
  --accent-soft:#17263B;
  --accent-line:#2C4A70;
  --ot:#FF8163;
  --ot-soft:#3D2019;
  --ot-line:#5C3025;
  --ok:#5BC191;
  --ok-soft:#1E2E27;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 2px 4px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.8);
  --shadow-3:0 8px 20px -6px rgba(0,0,0,.5), 0 32px 60px -24px rgba(0,0,0,.9);
  --grid:#2F3C4B;
}

*{box-sizing:border-box}
/* Ẩn thanh cuộn hệ thống, vẫn cuộn được bằng con lăn và bàn di. */
.sidebar,.view,.grid-scroll,.mgrid,.modal,.tbl-wrap,.hwrap{scrollbar-width:none; -ms-overflow-style:none}
.sidebar::-webkit-scrollbar,.view::-webkit-scrollbar,.grid-scroll::-webkit-scrollbar,
.mgrid::-webkit-scrollbar,.modal::-webkit-scrollbar,.tbl-wrap::-webkit-scrollbar,.hwrap::-webkit-scrollbar{width:0; height:0}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-size:14px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer; background:none; border:none; padding:0}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}
h1,h2,h3,h4{margin:0; font-family:var(--wide); font-weight:600; text-wrap:balance; letter-spacing:-.01em; font-stretch:112%}
.brand b,.tabs button{font-family:var(--wide); font-stretch:110%}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1}
.lbl{
  font-family:var(--mono); font-size:10px; font-weight:500;
  letter-spacing:.14em; text-transform:uppercase; color:var(--muted);
}
.hide{display:none !important}

/* ---------- shell ---------- */
.app{display:flex; flex-direction:column; height:100vh; overflow:hidden}
/* Điều hướng nằm thành tab ngang trên cùng, cột trái chỉ còn lịch nhỏ của màn hình Lịch. */
.appbar{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap; row-gap:8px;
  padding:9px 18px; border-bottom:1px solid var(--line); background:var(--surface); z-index:22;
}
.tabs{display:flex; align-items:center; gap:4px; flex-wrap:wrap}
.tabs button{
  padding:7px 14px; border-radius:999px; font-size:13.5px; font-weight:500; color:var(--ink-2); white-space:nowrap;
}
.tabs button:hover{background:var(--surface-2); color:var(--ink)}
.tabs button[aria-current="true"]{background:var(--ink); color:var(--surface); font-weight:600}
/* ---- thanh trang bằng kính (theo CloudSave G4Market) ---- */
:root{
  --glass:rgba(255,255,255,.5); --glass-edge:rgba(255,255,255,.85);
  --glass-hi:inset 0 1px 0 rgba(255,255,255,.95); --glass-shadow:0 8px 28px -12px rgba(30,58,138,.35);
  --glass-blur:blur(14px) saturate(170%);
  --glow-bg:linear-gradient(180deg, rgba(255,255,255,.98), rgba(255,255,255,.62));
  --glow-shadow:inset 0 1px 0 #fff, inset 0 -1px 0 rgba(37,99,235,.1), 0 4px 14px rgba(37,99,235,.22);

}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --glass:rgba(16,22,40,.38); --glass-edge:rgba(255,255,255,.14);
    --glass-hi:inset 0 1px 0 rgba(255,255,255,.18); --glass-shadow:0 12px 40px rgba(0,0,0,.45);
    --glow-bg:linear-gradient(180deg, rgba(255,255,255,.24), rgba(255,255,255,.1));
    --glow-shadow:inset 0 1px 0 rgba(255,255,255,.4), inset 0 -1px 0 rgba(255,255,255,.08), 0 4px 14px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --glass:rgba(16,22,40,.38); --glass-edge:rgba(255,255,255,.14);
  --glass-hi:inset 0 1px 0 rgba(255,255,255,.18); --glass-shadow:0 12px 40px rgba(0,0,0,.45);
  --glow-bg:linear-gradient(180deg, rgba(255,255,255,.24), rgba(255,255,255,.1));
  --glow-shadow:inset 0 1px 0 rgba(255,255,255,.4), inset 0 -1px 0 rgba(255,255,255,.08), 0 4px 14px rgba(0,0,0,.3);
}
/* vài vệt xanh rất nhạt sau thanh trên cùng: kính trên nền phẳng một màu trông như hộp xám */
.appbar{
  background:
    radial-gradient(360px 90px at 14% -30%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%),
    radial-gradient(460px 110px at 44% 140%, color-mix(in srgb, #7C8CFF 20%, transparent), transparent 70%),
    radial-gradient(340px 90px at 72% -20%, color-mix(in srgb, #45C4FF 18%, transparent), transparent 70%),
    var(--surface);
}
.tabs.pillnav{
  position:relative; gap:2px; padding:4px; border-radius:999px; flex-wrap:nowrap; max-width:100%;
  background:var(--glass); border:1px solid var(--glass-edge); box-shadow:var(--glass-hi), var(--glass-shadow);
  -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
}
/* màn hẹp: 6 tab không vừa thì vuốt ngang trong viên thuốc, không rớt dòng */
@media (max-width:900px){ .tabs.pillnav{overflow-x:auto; scrollbar-width:none} }
.tabs.pillnav::-webkit-scrollbar{display:none}
.pillnav__glow{
  position:absolute; top:0; left:0; width:0; height:0; opacity:0; border-radius:999px; pointer-events:none;
  background:var(--glow-bg); box-shadow:var(--glow-shadow);
  /* hơi vượt đích rồi dội lại, kiểu lò xo */
  transition:transform .45s cubic-bezier(.34,1.45,.64,1), width .45s cubic-bezier(.34,1.45,.64,1), height .2s, opacity .2s;
}
.tabs.pillnav button{position:relative; z-index:1; background:transparent; transition:color .2s}
.tabs.pillnav button:hover{background:transparent; color:var(--ink)}
.tabs.pillnav button[aria-current="true"]{background:transparent; color:var(--ink); font-weight:600}
/* máy không có backdrop-filter: kính đục hơn để chữ vẫn đọc được */
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))){
  .tabs.pillnav{background:var(--surface)}
}
.appbar #setBtn[aria-current="true"]{background:var(--ink); color:var(--surface); border-color:var(--ink)}
#subTabs button{white-space:nowrap}
/* Thanh con của tab Lịch: nằm ngay dưới hàng tab chính, trên thanh công cụ của lịch. */
.subbar{display:flex; align-items:center; gap:10px; padding:8px 18px; border-bottom:1px solid var(--line); background:var(--surface-2)}
.app-body{display:flex; flex:1; min-height:0; overflow:hidden}
/* Lịch nhỏ nằm ngay trên hàng tab chính, bấm mới xổ xuống, không chiếm cột riêng nữa. */

.sidebar{
  width:214px; flex:0 0 214px; background:var(--surface-2);
  border-right:1px solid var(--line); padding:16px 12px 14px;
  display:flex; flex-direction:column; gap:18px; min-height:0; overflow-y:auto;
}
.brand{display:flex; align-items:center; gap:9px; padding:0 6px}
.brand-mark{
  width:28px; height:28px; border-radius:9px; flex:0 0 28px;
  background:var(--accent); color:#fff; display:grid; place-items:center;
  font-family:var(--mono); font-weight:700; font-size:12px; letter-spacing:-.04em;
}
.brand b{font-size:14.5px; font-weight:600; letter-spacing:-.02em}
.brand small{display:block; font-size:10.5px; color:var(--muted); line-height:1.2}
.nav{display:flex; flex-direction:column; gap:2px}
.nav button{
  display:flex; align-items:center; gap:9px; width:100%;
  padding:7px 9px; border-radius:var(--r-sm); color:var(--ink-2);
  font-size:13.5px; font-weight:500; text-align:left;
}
.nav button:hover{background:var(--surface-3)}
.nav button[aria-current="true"]{background:var(--accent-soft); color:var(--accent-ink); font-weight:600}
.nav svg{width:16px; height:16px; flex:0 0 16px; stroke-width:1.7}
.side-group{display:flex; flex-direction:column; gap:7px; padding:0 6px}
.side-group .lbl{padding-left:2px}
.chk{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-2); cursor:pointer; padding:2px 0}
.chk input{accent-color:var(--accent); width:14px; height:14px; margin:0; cursor:pointer}
.chk .dot{width:8px; height:8px; border-radius:3px; flex:0 0 8px}
.chk span.t{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
select.mini,input.mini{
  width:100%; padding:6px 8px; border-radius:var(--r-xs);
  border:1px solid var(--line-2); background:var(--surface); font-size:13px;
}
.side-foot{margin-top:auto; display:flex; flex-direction:column; gap:8px; padding:0 6px}
.theme-btn{
  display:flex; align-items:center; gap:7px; padding:6px 8px; border-radius:var(--r-sm);
  color:var(--muted); font-size:12.5px;
}
.theme-btn:hover{background:var(--surface-3); color:var(--ink-2)}

.main{flex:1; min-width:0; min-height:0; display:flex; flex-direction:column; overflow:hidden}
.topbar{
  display:grid; grid-template-columns:1fr auto; gap:10px 14px; align-items:center;
  padding:14px 22px; border-bottom:1px solid var(--line);
  background:var(--surface); position:relative; z-index:20;
}
.topbar h1{font-size:19px; font-weight:600; white-space:nowrap}
/* Hai nhóm trái phải trong một lưới: hết chỗ thì nhóm phải xuống hàng,
   nhóm trái không bao giờ bị ép co làm chữ tràn ra khỏi nút. */
.tb-left,.tb-right{display:flex; align-items:center; gap:10px; flex-wrap:wrap; row-gap:8px}
.tb-left > *,.tb-right > *{flex:none}
.tb-right{justify-self:end}
.navbtns{display:flex; align-items:center; gap:6px; flex:none; min-width:max-content}
/* Đặt sau các quy tắc gốc, nếu đặt trước thì quy tắc gốc ghi đè ngược lại. */
@media (max-width:760px){
  .topbar{grid-template-columns:1fr}
  .tb-right{justify-self:start}
}
.btn{
  display:inline-flex; align-items:center; gap:6px; padding:6px 12px;
  border-radius:999px; border:1px solid var(--line-2); background:var(--surface);
  font-size:13px; font-weight:500; color:var(--ink-2); box-shadow:var(--shadow-1);
  transition:background .12s, border-color .12s, color .12s;
  /* Nút không bao giờ hẹp hơn chữ của nó: bị bóp thì chữ tràn ra đè nút bên
     cạnh và vùng bấm teo lại gần như không bấm được. */
  white-space:nowrap; flex:0 0 auto; min-width:max-content;
}
.btn:hover{background:var(--surface-2); color:var(--ink)}
.btn svg{width:15px; height:15px; stroke-width:1.8}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
.btn.primary:hover{background:var(--accent-ink); border-color:var(--accent-ink); color:#fff}
.btn.ghost{border-color:transparent; box-shadow:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--ot); border-color:var(--ot-line)}
.btn.danger:hover{background:var(--ot-soft)}
.btn.icon{padding:6px; width:30px; height:30px; justify-content:center}
.seg{display:inline-flex; background:var(--surface-2); border-radius:999px; padding:3px; gap:2px; border:1px solid var(--line)}
.seg button{padding:4px 13px; border-radius:999px; font-size:12.5px; font-weight:500; color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:var(--shadow-1)}
.period-label{font-size:14px; font-weight:600; letter-spacing:-.01em; white-space:nowrap; flex:none}
.period-label em{font-style:normal; color:var(--muted); font-weight:400}

.view{padding:22px; flex:1; min-width:0; min-height:0; overflow-y:auto}
.view.cal{padding:0; display:flex; flex-direction:column; overflow:hidden}
.wrap{max-width:1080px; margin:0 auto; display:flex; flex-direction:column; gap:22px}

/* ---------- week grid ---------- */
.cal-head{
  display:grid; grid-template-columns:58px repeat(7,minmax(0,1fr));
  border-bottom:1px solid var(--grid); background:var(--surface);
  position:relative; z-index:15;
}
.cal-head .corner{
  border-right:1px solid var(--grid); display:flex; align-items:flex-end; justify-content:flex-end;
  padding:0 7px 6px; font-family:var(--mono); font-size:9px; color:var(--muted); letter-spacing:.02em;
}
.chips{display:flex; gap:6px; flex-wrap:wrap}
.chips button{
  padding:4px 11px; border-radius:999px; border:1px solid var(--line-2);
  background:var(--surface); font-size:12.5px; color:var(--ink-2);
}
.chips button:hover{border-color:var(--accent); color:var(--accent-ink); background:var(--accent-soft)}
.chips button[aria-pressed="true"]{border-color:var(--accent); color:var(--accent-ink); background:var(--accent-soft); font-weight:600}

/* ---------- hồ sơ vay ---------- */
.loan-wrap{max-width:1440px}
.loan-bar{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.loan-bar .spacer{flex:1}
.loan-form{display:flex; flex-direction:column; gap:16px}
.lf-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px 18px}
.lf-incomes{display:flex; flex-direction:column; gap:18px; padding-top:14px; border-top:1px solid var(--line)}
.lf-incomes:empty{display:none}
.lf-person .sg-h{margin-bottom:8px}
.loan-out{display:flex; flex-direction:column; gap:16px}
.case-row{cursor:pointer}
.md-link{text-decoration:underline; text-underline-offset:3px; text-decoration-thickness:1px}
.case-row:hover td{background:var(--surface-2)}
.stage-bar{height:6px; border-radius:999px; background:var(--surface-3); overflow:hidden; margin-bottom:14px}
.stage-bar i{display:block; height:100%; background:var(--accent); border-radius:999px}
.sg + .sg{margin-top:12px; padding-top:12px; border-top:1px dashed var(--line)}
.sg-h{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; margin-bottom:4px}
.sg-h b{font-size:13.5px; font-weight:600}
.sg-h small{font-size:12px; color:var(--muted)}
.docs{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:1px}
.doc{display:flex; align-items:flex-start; gap:10px; padding:6px 8px; border-radius:var(--r-sm); cursor:pointer; font-size:13.5px; line-height:1.45}
.doc:hover{background:var(--surface-2)}
.doc input{accent-color:var(--accent); width:16px; height:16px; margin:2px 0 0; flex:0 0 16px}
.doc.got span{color:var(--muted); text-decoration:line-through; text-decoration-thickness:1px}
.doc a{color:var(--accent-ink); text-underline-offset:2px}
.bt{flex:0 0 30px; height:30px; border-radius:var(--r-xs); border:1px solid var(--line-2); background:var(--surface); font-weight:700; color:var(--muted)}
.bt[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--surface)}
.btn:disabled{opacity:.4; cursor:default; box-shadow:none}
.list-row{display:flex; align-items:center; gap:6px}
.list-row input{flex:1; min-width:0; padding:7px 10px; border-radius:var(--r-sm); border:1px solid var(--line-2); background:var(--surface); font-size:13.5px}
/* Bảng rules cuộn trong khung riêng như Google Sheet: thanh cuộn ngang luôn nằm trong màn hình,
   dòng tiêu đề ghim trên cùng, cột số dòng ghim trái, cột + ghim phải. scroll-padding chừa chỗ
   cho hai cột ghim, để cột vừa thêm cuộn vào không bị cột + che mất. */
.sheet-wrap{
  overflow:auto; max-height:max(320px, calc(100vh - 250px)); min-width:0; max-width:100%;
  scroll-padding:0 56px 0 52px; border:1px solid var(--grid); border-radius:var(--r-sm); background:var(--surface);
  scrollbar-width:thin; scrollbar-color:var(--line-2) transparent;
}
.sheet-wrap::-webkit-scrollbar{width:10px; height:10px}
.sheet-wrap::-webkit-scrollbar-thumb{background:var(--line-2); border-radius:999px; border:2px solid var(--surface)}
.sheet-wrap::-webkit-scrollbar-corner{background:transparent}
.sheet thead th{position:sticky; top:0; z-index:4}
.sheet thead th.sh-idx,.sheet thead th.sh-add{z-index:6}
.sheet{border-collapse:collapse; table-layout:fixed; width:100%}
.sheet th,.sheet td{padding:0; border-right:1px solid var(--grid); border-bottom:1px solid var(--grid); background:var(--surface); vertical-align:middle}
.sheet th{background:var(--surface-2); text-align:left; font-weight:600}
.sheet tr > :last-child{border-right:none}
.sheet tbody tr:last-child td{border-bottom:none}
/* dấu + chèn cột nằm ngay trên đường kẻ, chỉ hiện khi rê chuột tới */
.sheet th[data-colkey]{position:relative}
.sheet th[data-colkey].dragging{opacity:.45}
.sheet th.drop-left{box-shadow:inset 2px 0 0 var(--accent)}
.sheet th.drop-right{box-shadow:inset -2px 0 0 var(--accent)}
.col-ins{
  position:absolute; top:4px; left:-9px; width:18px; height:18px; border-radius:50%; z-index:5;
  background:var(--accent); color:#fff; font-size:13px; line-height:1; display:none; place-items:center;
}
.col-ins.right{left:auto; right:-9px}
.sheet th[data-colkey]:hover .col-ins,.col-ins:focus{display:grid}
.sheet td.sh-idx .row-ins{
  position:absolute; left:50%; bottom:-9px; transform:translateX(-50%); width:18px; height:18px; border-radius:50%;
  background:var(--accent); color:#fff; font-size:13px; line-height:1; display:none; place-items:center; z-index:5; inset:auto auto -9px 50%;
}
.sheet tr:hover td.sh-idx .row-ins,.row-ins:focus{display:grid}
.sheet td.sh-idx{position:sticky}
.syntax-help > summary{cursor:pointer; list-style:none; display:flex; align-items:center; gap:6px; font-weight:600; color:var(--ink-2)}
.syntax-help > summary::-webkit-details-marker{display:none}
.syntax-help[open] > summary{margin-bottom:8px}
.syntax-help[open] .stage-chev{transform:rotate(90deg)}
.sheet .sh-h{display:flex; align-items:center; gap:2px; padding:7px 6px 0 8px}
.sheet .sh-h input,.sheet .sh-h span{
  flex:1; min-width:0; border:none; background:none; padding:3px 2px; border-radius:4px;
  font-family:var(--mono); font-size:10.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-2);
}
.sheet .sh-h input:focus{outline:none; background:var(--surface); box-shadow:0 0 0 2px var(--accent)}
.sheet .sh-sub{padding:0 10px 7px; font-family:var(--sans); font-size:11px; font-weight:400; letter-spacing:0; text-transform:none; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.sheet th.person .sh-sub{color:var(--accent-ink)}
.sheet .sh-menu{flex:0 0 22px; width:22px; height:22px; border-radius:6px; color:var(--muted); font-size:14px; line-height:1}
.sheet .sh-menu:hover{background:var(--surface-3); color:var(--ink)}
.sheet td input,.sheet td select{
  display:block; width:100%; min-width:0; border:none; border-radius:0; background:transparent;
  padding:8px 9px; font-size:13px; color:var(--ink); text-overflow:ellipsis;
}
.sheet td select{cursor:pointer}
/* Danh sách xổ xuống do trình duyệt vẽ: nếu không đặt, nó lấy nền trắng nhưng lại mượn màu chữ
   của ô (sáng ở giao diện tối), thành chữ trắng trên nền trắng. */
select option,select optgroup{background-color:var(--surface); color:var(--ink); font-weight:500}
.sheet td input:focus,.sheet td select:focus{outline:none}
.sheet td:focus-within{box-shadow:inset 0 0 0 2px var(--accent); position:relative; z-index:1}
.sheet td.sh-idx:focus-within{position:sticky; z-index:3}
.sheet td input::placeholder{color:var(--muted); opacity:.75}
.sheet td.b input{font-weight:700}
.sheet td.bad{background:var(--ot-soft)}
.sheet td.bad input{color:var(--ot)}
.sheet td.sh-stage select{font-family:var(--mono); font-weight:600; text-align:center}
/* Màu theo giá trị (như định dạng trong Google Sheet) và chữ đậm cả cột */
.sheet td.tint{background:var(--cbg)}
.sheet td.tint input,.sheet td.tint select{color:var(--cfg)}
.sheet td.boldcol input,.sheet td.boldcol select{font-weight:700}
.cm-val{display:flex; align-items:center; gap:6px; min-width:0}
.f > label.chk,.f > label.switch{font-family:var(--sans); font-size:13.5px; letter-spacing:0; text-transform:none; color:var(--ink-2)}
.f > label.switch .txt b{font-size:13px}
.f > label.switch .txt small{font-size:11px}
.f .chk input{width:16px; height:16px; padding:0; flex:none}
.opt-row{display:flex; gap:6px; align-items:center}
.t-sum{display:flex; flex-direction:column; gap:8px; padding:11px 13px; border-radius:var(--r); background:var(--surface-2); border:1px solid var(--line)}
.sum-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(92px,1fr)); gap:10px}
.sum-row b{font-size:16px; letter-spacing:-.01em}
.sum-cl{display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:12.5px; color:var(--muted); padding-top:8px; border-top:1px solid var(--line)}
.sum-cl b{font-size:13.5px; color:var(--ink)}
.sum-cl span{flex:1; min-width:120px}
.sum-cl .btn{padding:3px 11px; font-size:12px}
.f-head{display:flex; align-items:center; gap:6px; min-height:18px}
.f-head > label{font-family:var(--mono); font-size:10px; letter-spacing:.11em; text-transform:uppercase; color:var(--muted)}
.st-sel{width:auto; min-width:106px; padding:4px 24px 4px 12px; border-radius:999px; font-size:12px; font-weight:700;
  border:1px solid var(--ot-line); background:var(--ot-soft); color:var(--ot)}
.st-sel.done{border-color:var(--ok); background:var(--ok-soft); color:var(--ok)}
.f-clear{padding:0 8px; border-radius:999px; font-size:11.5px; line-height:18px; color:var(--muted)}
.f-clear:hover{background:var(--ot-soft); color:var(--ot)}
.chips button{position:relative}
.chip-x{display:inline-grid; place-items:center; width:16px; height:16px; margin:0 -5px 0 5px; border-radius:50%; font-size:13px; line-height:1; color:var(--muted)}
.chip-x:hover{background:var(--ot-soft); color:var(--ot)}
.opt-row select{flex:1 1 auto; min-width:0}
.f input.opt-add,input.opt-add{width:150px; flex:0 0 150px; padding:4px 11px; border-radius:999px; border:1px dashed var(--line-2); background:transparent; font-size:12.5px}
.f input.opt-add:focus,input.opt-add:focus{outline:none; border-style:solid; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
/* Chọn nhiều như brief trang 4: ô hiện giá trị đã chọn kèm dấu ×, bấm vào mở danh sách. */
.ms{position:relative}
.ms-box{display:flex; align-items:center; gap:6px; flex-wrap:wrap; min-height:38px; padding:5px 34px 5px 10px;
  border:1.5px solid var(--line-2); border-radius:var(--r-sm); background:var(--surface); cursor:pointer}
.ms-box:hover{border-color:var(--accent-line)}
.ms.open .ms-box{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.ms-ph{color:var(--muted); font-size:13.5px}
.ms-chip{display:inline-flex; align-items:center; gap:2px; padding:2px 4px 2px 10px; border-radius:999px;
  border:1px solid var(--accent-line); background:var(--accent-soft); color:var(--accent-ink); font-size:12.5px; font-weight:600}
.ms-x{width:17px; height:17px; border-radius:50%; display:grid; place-items:center; color:var(--accent-ink); font-size:13px; line-height:1}
.ms-x:hover{background:var(--ot-soft); color:var(--ot)}
.ms-caret{position:absolute; right:13px; top:19px; transform:translateY(-50%); color:var(--muted); font-size:10px; pointer-events:none}
.ms-menu{position:absolute; z-index:40; left:0; right:0; top:calc(100% + 6px); max-height:290px; overflow:auto; padding:6px;
  display:flex; flex-direction:column; gap:2px; background:var(--surface); border:1px solid var(--line-2);
  border-radius:var(--r-sm); box-shadow:var(--shadow-3)}
.ms-menu.hide{display:none}
.ms-opt{display:flex; align-items:center; gap:8px; width:100%; padding:7px 10px; border-radius:var(--r-xs);
  background:none; border:none; text-align:left; font-size:13.5px; color:var(--ink); cursor:pointer}
.ms-opt:hover{background:var(--surface-2)}
.ms-opt[aria-pressed="true"]{color:var(--accent-ink); font-weight:600}
.ms-tick{width:13px; color:var(--accent); font-size:12px}
.ms-menu .opt-add{width:100%; flex:1 1 auto; margin-top:4px}
/* Người vay, người bảo lãnh: mỗi người một khối, thông tin riêng nằm ngay dưới tên (brief trang 5, 6). */
.lf-people{align-items:start; padding-top:14px; border-top:1px solid var(--line)}
.lf-person{display:flex; flex-direction:column; gap:10px}
.lf-person .f-case{grid-column:auto !important}
/* Cú pháp trong Rules nằm sau dấu ? cho đỡ rối (brief trang 25). */
.q-mark{display:inline-grid; place-items:center; width:20px; height:20px; border-radius:50%;
  border:1.5px solid var(--line-2); font-size:12px; font-weight:700; color:var(--ink-2)}
.syntax-help[open] .q-mark{background:var(--accent); border-color:var(--accent); color:#fff}
.slot-who{display:flex; flex-direction:column; gap:6px}
.slot-who > span{font-size:12px; color:var(--muted)}
.cm-chip{flex:1; min-width:0; padding:3px 8px; border-radius:6px; font-size:12.5px; font-weight:600; background:var(--cbg, transparent); color:var(--cfg, var(--ink)); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.swatch-btn.fg{position:relative; background:var(--surface)}
.swatch-btn.fg::after{content:"A"; position:absolute; inset:0; display:grid; place-items:center; font-weight:800; font-size:12px; color:var(--sw)}
.swatch-btn.fg.none{background:var(--surface)}
.swatch-btn.fg.none::after{color:var(--muted)}
.colmenu{max-height:calc(100vh - 24px); overflow-y:auto}
.swatch-btn{flex:0 0 22px; width:22px; height:22px; border-radius:6px; border:1px solid var(--line-2); background:var(--sw)}
.swatch-btn.none{background:repeating-linear-gradient(135deg, var(--surface) 0 4px, var(--line-2) 4px 5px)}
.swatch-btn:hover{box-shadow:0 0 0 2px var(--accent-soft); border-color:var(--accent)}
.cm-stages{display:flex; flex-direction:column; gap:6px; padding-top:10px; border-top:1px solid var(--line)}
/* Nền tối: màu pastel của sheet để nguyên sẽ chói và mất chữ, nên nền pha tối lại theo màu đó,
   chữ lấy sáng từ chính màu nền. Chỉ có màu chữ thì pha sáng lên cho đọc được. */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .sheet td.fgonly input,:root:not([data-theme="light"]) .sheet td.fgonly select{color:color-mix(in srgb, var(--cfg) 30%, var(--ink))}
  :root:not([data-theme="light"]) .sheet td.tint:not(.fgonly){background:color-mix(in srgb, var(--cbg) 24%, var(--surface))}
  :root:not([data-theme="light"]) .sheet td.tint:not(.fgonly) input,:root:not([data-theme="light"]) .sheet td.tint:not(.fgonly) select{color:color-mix(in srgb, var(--cbg) 55%, #FFFFFF)}
  :root:not([data-theme="light"]) .cm-chip{background:color-mix(in srgb, var(--cbg, transparent) 24%, var(--surface)); color:color-mix(in srgb, var(--cbg, var(--ink)) 55%, #FFFFFF)}
}
:root[data-theme="dark"] .sheet td.fgonly input,:root[data-theme="dark"] .sheet td.fgonly select{color:color-mix(in srgb, var(--cfg) 30%, var(--ink))}
:root[data-theme="dark"] .sheet td.tint:not(.fgonly){background:color-mix(in srgb, var(--cbg) 24%, var(--surface))}
:root[data-theme="dark"] .sheet td.tint:not(.fgonly) input,:root[data-theme="dark"] .sheet td.tint:not(.fgonly) select{color:color-mix(in srgb, var(--cbg) 55%, #FFFFFF)}
:root[data-theme="dark"] .cm-chip{background:color-mix(in srgb, var(--cbg, transparent) 24%, var(--surface)); color:color-mix(in srgb, var(--cbg, var(--ink)) 55%, #FFFFFF)}
.cm-stages > span{font-family:var(--mono); font-size:10px; letter-spacing:.11em; text-transform:uppercase; color:var(--muted)}
.cm-stage{display:flex; align-items:center; gap:8px; font-size:13px; min-width:0}
.cm-stage span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.palette{
  position:fixed; z-index:80; width:max-content; padding:10px; display:flex; flex-direction:column; gap:8px;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow-3);
}
.pal-none{align-self:stretch; text-align:left; padding:5px 8px; border-radius:7px; font-size:12.5px; color:var(--ink-2)}
.pal-none:hover{background:var(--surface-2)}
.pal-grid{display:grid; grid-template-columns:repeat(10, 20px); gap:5px}
.pal-grid button{width:20px; height:20px; border-radius:50%; border:1px solid rgba(0,0,0,.14)}
.pal-grid button:hover{transform:scale(1.15)}
.pal-grid button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface), 0 0 0 4px var(--accent)}
.pal-custom{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:4px 2px 0; border-top:1px solid var(--line); font-size:12.5px; color:var(--ink-2)}
.pal-custom input{width:36px; height:26px; padding:0; border:1px solid var(--line-2); border-radius:6px; background:none; cursor:pointer}
.stage-card > summary{list-style:none; cursor:pointer; padding-bottom:15px; border-radius:var(--r-lg)}
.stage-card > summary::-webkit-details-marker{display:none}
.stage-card > summary:hover{background:var(--surface-2)}
.stage-card > summary:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
.stage-card[open] > summary{padding-bottom:0; border-radius:var(--r-lg) var(--r-lg) 0 0}
.stage-card[open] > summary:hover{background:none}
.stage-chev{flex:0 0 18px; width:18px; height:18px; display:grid; place-items:center; color:var(--muted); transition:transform .15s}
.stage-chev::before{content:""; width:7px; height:7px; border-right:2px solid currentColor; border-bottom:2px solid currentColor; transform:translate(-1px,-1px) rotate(-45deg)}
.stage-card[open] .stage-chev{transform:rotate(90deg)}
.stage-card.done .lbl{color:var(--ok)}
.stage-tools{display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:12.5px; color:var(--muted)}
.stage-tools .spacer{flex:1}
.stage-dot{display:inline-block; width:11px; height:11px; margin-right:8px; border-radius:3px; vertical-align:-1px; background:var(--sw); border:1px solid rgba(0,0,0,.12)}
/* Cột số dòng ghim bên trái, cột + ghim bên phải: bảng nhiều cột cuộn ngang vẫn luôn thấy. */
.sheet .sh-idx{position:sticky; left:0; z-index:3; box-shadow:1px 0 0 var(--grid); text-align:center; background:var(--surface-2); color:var(--muted); font-family:var(--mono); font-size:11px}
.sheet th.sh-add,.sheet td.sh-end{position:sticky; right:0; z-index:3; box-shadow:-1px 0 0 var(--grid), -8px 0 12px -10px rgba(0,0,0,.35)}
.sheet td.sh-idx button{position:absolute; inset:0; display:none; width:100%; color:var(--ot); background:var(--ot-soft); font-size:16px}
.sheet tr:hover td.sh-idx button,.sheet td.sh-idx button:focus{display:block}
.sheet tr.sh-new td{background:var(--surface-2)}
.sheet tr.sh-new td.sh-doc input::placeholder{font-style:italic; color:var(--accent-ink)}
.sheet th.sh-add{text-align:center}
.sheet th.sh-add button{width:28px; height:28px; border-radius:8px; font-size:18px; line-height:1; color:var(--accent-ink); background:var(--accent-soft)}
.sheet th.sh-add button:hover{background:var(--accent); color:#fff}
.sheet td.sh-end{background:var(--surface-2)}
.colmenu .cm-note{margin:0; font-size:12.5px; line-height:1.55; color:var(--ink-2)}
.imp-text{width:100%; min-height:110px; resize:vertical; padding:10px 12px; border-radius:var(--r-sm); border:1px solid var(--line-2); background:var(--surface); font-family:var(--mono); font-size:12px; line-height:1.5; white-space:pre; overflow:auto}
.imp-text:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.imp-map{table-layout:fixed}
.imp-map td{vertical-align:middle; padding:6px 10px}
.imp-title b{display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.imp-map select{width:100%; min-width:0; padding:6px 8px; border-radius:var(--r-xs); border:1px solid var(--line-2); background:var(--surface); font-size:13px}
.imp-map tr.skip td{opacity:.55}
.imp-sample{font-size:12px; color:var(--muted); max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.imp-new{display:flex; flex-direction:column; gap:5px}
.imp-mode{display:flex; gap:18px; flex-wrap:wrap; font-size:13px}
.imp-sum{font-family:var(--mono); font-size:12px; color:var(--accent-ink)}
.colmenu{
  position:fixed; z-index:75; width:252px; padding:12px; display:flex; flex-direction:column; gap:10px;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow-3);
}
.colmenu select,.colmenu input{width:100%; padding:6px 9px; border-radius:var(--r-xs); border:1px solid var(--line-2); background:var(--surface); font-size:13px}
.colmenu input[type="checkbox"]{width:auto; padding:0; flex:none}
.colmenu .cm-row{display:flex; gap:6px}
.colmenu .cm-row .btn{flex:1 1 0; justify-content:center}
.syntax{width:100%; border-collapse:collapse; font-size:12.5px}
.syntax td{padding:5px 8px 5px 0; border-bottom:1px solid var(--line); vertical-align:top; line-height:1.6}
.syntax tr:last-child td{border-bottom:none}
.syntax code{font-family:var(--code); font-size:11.5px; background:var(--surface-3); padding:1px 5px; border-radius:5px; white-space:nowrap}
.fld select,.fld input{padding:6px 9px; border-radius:var(--r-xs); border:1px solid var(--line-2); background:var(--surface); font-size:13px; min-width:0}
.fld select:focus,.fld input:focus,.list-row input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.fld{border:1px solid var(--line); border-radius:var(--r); padding:12px; display:flex; flex-direction:column; gap:10px}
.fld-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.fld-acts{display:flex; gap:6px; margin-left:auto}
.fld-opts{display:flex; flex-direction:column; gap:6px; padding-left:12px; border-left:2px solid var(--accent-line)}
.fld-foot{font-size:12px; color:var(--muted)}
@media (max-width:640px){ .lf-grid{grid-template-columns:1fr} }
.hint-note{
  padding:8px 12px; border-radius:var(--r-sm); font-size:12.5px; line-height:1.5;
  background:var(--ot-soft); color:var(--ot); border:1px solid var(--ot-line);
}
.hint-note.mild{background:var(--surface-2); color:var(--ink-2); border-color:var(--line)}
.dcol{
  padding:8px 6px 9px; text-align:center; border-right:1px solid var(--grid);
  display:flex; flex-direction:column; align-items:center; gap:3px;
}
.dcol:last-child{border-right:none}
.dcol .dn{font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
.dcol .dd{
  font-size:17px; font-weight:600; width:31px; height:31px; border-radius:50%;
  display:grid; place-items:center; font-variant-numeric:tabular-nums; letter-spacing:-.02em;
}
.dcol.today .dd{background:var(--accent); color:#fff}
.dcol.today .dn{color:var(--accent-ink)}
.dcol .hrs{font-family:var(--mono); font-size:10.5px; color:var(--muted)}
.dcol .hrs.on{color:var(--accent-ink)}
.dcol.hol .dn{color:var(--ot)}
.dcol .holname{
  font-size:10px; color:var(--ot); font-weight:500; max-width:100%;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
/* overflow-anchor: chặn trình duyệt tự kéo lại chỗ cuộn khi lưới được vẽ lại. */
.grid-scroll{flex:1; min-height:0; overflow:auto; overscroll-behavior:contain; overflow-anchor:none}
.grid{display:grid; grid-template-columns:58px repeat(7,minmax(0,1fr)); position:relative; overflow-anchor:none}
.gutter{border-right:1px solid var(--grid); background:var(--surface)}
.gutter .h{height:var(--slot); position:relative}
/* Nhãn giờ canh giữa đúng vạch kẻ, như Google. */
.gutter .h span{
  position:absolute; right:9px; top:0; transform:translateY(-50%);
  font-family:var(--mono); font-size:10.5px; color:var(--muted); white-space:nowrap;
}
.daycol{border-right:1px solid var(--grid); position:relative}
.daycol:last-child{border-right:none}
.slot{height:var(--slot); border-bottom:1px solid var(--grid); cursor:pointer}
.slot:hover{background:var(--accent-soft)}
.nowline{position:absolute; left:0; right:0; height:0; border-top:1.5px solid var(--ot); z-index:6; pointer-events:none}
.nowline::before{content:""; position:absolute; left:-4px; top:-4px; width:8px; height:8px; border-radius:50%; background:var(--ot)}

.ev{
  position:absolute; border-radius:var(--r-xs); padding:4px 6px 4px 8px;
  background:var(--surface); border:1px solid var(--line-2);
  box-shadow:var(--shadow-1); overflow:hidden; text-align:left;
  display:flex; flex-direction:column; gap:1px; z-index:4;
  transition:box-shadow .12s, transform .12s;
}
.ev::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--c,var(--accent))}
.ev:hover{box-shadow:var(--shadow-2); z-index:7}
.ev .t{font-family:var(--mono); font-size:10.5px; color:var(--muted); line-height:1.3}
.ev .n{font-size:12px; font-weight:600; line-height:1.25; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.ev .s{font-size:11px; color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.ev.ot{background:var(--ot-soft); border-color:var(--ot-line)}
.ev.ot::before{background:var(--ot)}
.ev.ot .n{color:var(--ot)}
.ev.ot .t{color:var(--ot)}
.ev.short{flex-direction:row; align-items:baseline; gap:5px; padding-top:2px}
.ev.done .n{text-decoration:line-through; text-decoration-thickness:1px; opacity:.72}
.ev.narrow{padding:3px 4px 3px 7px}
.ev.narrow .t{font-size:9.5px}
.ev.narrow .n{font-size:11px}
.ev.narrow .s{display:none}
.ev.cut{border-bottom-left-radius:0; border-bottom-right-radius:0; border-bottom-style:dashed}
.ev.cont{border-top-left-radius:0; border-top-right-radius:0; border-top-style:dashed; cursor:pointer}
.ev{cursor:grab; touch-action:none; user-select:none}
.ev:active{cursor:grabbing}
.ev.dragging{opacity:.32; box-shadow:none}
.ev-rz{position:absolute; left:0; right:0; bottom:0; height:8px; cursor:ns-resize}
.ev-rz::after{
  content:""; position:absolute; left:50%; bottom:2px; transform:translateX(-50%);
  width:22px; height:2.5px; border-radius:2px; background:currentColor; opacity:0;
}
.ev:hover .ev-rz::after{opacity:.35}
.drag-ghost{
  position:absolute; z-index:12; pointer-events:none; overflow:hidden;
  border-radius:var(--r-xs); background:var(--accent-soft);
  border:1.5px dashed var(--accent); color:var(--accent-ink);
  padding:3px 7px; box-shadow:var(--shadow-2);
}
.drag-ghost b{display:block; font-size:12px; font-weight:600; line-height:1.25}
.drag-ghost span{font-family:var(--mono); font-size:10.5px}
.drag-ghost.ot{background:var(--ot-soft); border-color:var(--ot); color:var(--ot)}
/* Khối tạm giữ lại trên lịch trong lúc bảng nhỏ đang mở. */
.drag-ghost.firm{background:var(--accent); border:1px solid var(--accent); color:#fff}
.drag-ghost.firm span{opacity:.9}

/* ---------- bảng tạo nhanh ---------- */
.quick{
  position:fixed; z-index:70; width:min(342px, calc(100vw - 24px));
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg);
  box-shadow:var(--shadow-3); padding:6px 8px 10px; display:flex; flex-direction:column;
}
.q-h{display:flex; justify-content:flex-end}
.q-x{width:28px; height:28px; border-radius:9px; display:grid; place-items:center; color:var(--muted)}
.q-x:hover{background:var(--surface-2); color:var(--ink)}
.q-x svg{width:15px; height:15px; stroke-width:1.8; fill:none; stroke:currentColor}
.q-title{
  border:none; border-bottom:2px solid var(--line-2); background:none; width:calc(100% - 8px);
  font-size:17px; font-weight:600; padding:2px 10px 8px; margin:0 4px 10px;
}
.q-title::placeholder{color:var(--muted); font-weight:400}
.q-title:focus{outline:none; border-bottom-color:var(--accent)}
.q-row{display:flex; align-items:center; gap:11px; padding:5px 10px; border-radius:var(--r-sm)}
.q-row > svg{width:17px; height:17px; flex:0 0 17px; stroke-width:1.7; fill:none; stroke:var(--muted)}
.q-row .txt b{display:block; font-size:13.5px; font-weight:600}
.q-row .txt span{font-family:var(--mono); font-size:11.5px; color:var(--muted)}
.q-row select{
  flex:1; min-width:0; padding:5px 8px; border-radius:var(--r-xs);
  border:1px solid transparent; background:var(--surface-2); font-size:13.5px;
}
.q-row select:hover{border-color:var(--line-2)}
.q-row select:focus{outline:none; border-color:var(--accent)}
.q-ot{cursor:pointer}
.q-ot > span{flex:1; font-size:13.5px}
.q-ot input{accent-color:var(--ot); width:16px; height:16px; margin:0}
.q-ot:has(input:checked){background:var(--ot-soft)}
.q-ot:has(input:checked) > span{color:var(--ot); font-weight:500}
.q-ot:has(input:checked) > svg{stroke:var(--ot)}
.q-new{display:flex; flex-direction:column; gap:6px; padding:1px 10px 8px 38px}
.q-new input,.q-new select{
  padding:6px 9px; border-radius:var(--r-xs); border:1px solid var(--accent-line);
  background:var(--surface); font-size:13px; width:100%; min-width:0;
}
.q-new input:focus,.q-new select:focus{outline:none; border-color:var(--accent)}
.q-new-r{display:flex; gap:6px}
.q-new-r select{flex:1 1 92px}
.q-new-r input{flex:1 1 80px}
.q-new .btn{flex:0 0 auto; padding:5px 13px; font-size:12.5px}
.q-f{display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center; padding:10px 4px 0}
.q-f > *{min-width:0; overflow:hidden}
.q-f > *:last-child{justify-self:end}

/* ---------- lịch ngang ---------- */
.hwrap{flex:1; min-height:0; overflow:auto; overscroll-behavior:contain; background:var(--surface); overflow-anchor:none}
.hgrid{--hw:76px; --lab:200px; width:calc(var(--lab) + 24 * var(--hw)); position:relative}
.hhead,.hrow{display:grid; grid-template-columns:var(--lab) calc(24 * var(--hw))}
.hhead{position:sticky; top:0; z-index:9; background:var(--surface); border-bottom:1px solid var(--grid)}
.hl{
  position:sticky; left:0; z-index:7; background:var(--surface); border-right:1px solid var(--grid);
  display:flex; align-items:center; gap:10px; padding:8px 14px; min-width:0;
}
.hhead .hl{font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
.hhours{display:grid; grid-template-columns:repeat(24, var(--hw))}
.hhours div{padding:10px 8px; font-family:var(--mono); font-size:11px; color:var(--muted); border-left:1px solid var(--grid)}
.hhours div:first-child{border-left:none}
.hrow{border-bottom:1px solid var(--grid)}
.htrack{
  position:relative; cursor:pointer; touch-action:pan-x pan-y;
  background-image:repeating-linear-gradient(to right, transparent 0 calc(var(--hw) - 1px), var(--grid) calc(var(--hw) - 1px) var(--hw));
}
.hrow.me .hl{background:var(--accent-soft)}
.hrow.me .htrack{background-color:color-mix(in srgb, var(--accent-soft) 55%, transparent)}
.hl .av{
  width:30px; height:30px; flex:0 0 30px; border-radius:50%; display:grid; place-items:center;
  font-family:var(--mono); font-size:11px; font-weight:700; color:var(--c);
  background:color-mix(in srgb, var(--c) 16%, transparent);
}
.hl .dnum{
  width:30px; height:30px; flex:0 0 30px; border-radius:50%; display:grid; place-items:center;
  font-weight:600; font-variant-numeric:tabular-nums;
}
.hrow.today .dnum{background:var(--accent); color:#fff}
.hl .who{display:flex; flex-direction:column; min-width:0}
.hl .who b{font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.hl .who small{font-size:11.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.hrow.me .who small{color:var(--accent-ink)}
.hrow.hol .who small,.hrow.hol .who b{color:var(--ot)}
.hb{
  position:absolute; display:flex; flex-direction:column; justify-content:center; gap:1px;
  padding:3px 10px 3px 11px; border-radius:var(--r-xs); background:var(--surface);
  border:1px solid var(--line-2); box-shadow:var(--shadow-1); overflow:hidden; text-align:left;
  cursor:grab; touch-action:none; user-select:none; z-index:4; min-width:0;
}
.hb::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--c,var(--accent))}
.hb:hover{box-shadow:var(--shadow-2); z-index:6}
.hb:active{cursor:grabbing}
.hb .n{font-size:12px; font-weight:600; line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.hb .t{font-family:var(--mono); font-size:10.5px; color:var(--muted); line-height:1.3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.hb.ot{background:var(--ot-soft); border-color:var(--ot-line)}
.hb.ot::before{background:var(--ot)}
.hb.ot .n,.hb.ot .t{color:var(--ot)}
.hb.done .n{text-decoration:line-through; text-decoration-thickness:1px; opacity:.72}
.hb.dragging{opacity:.32; box-shadow:none}
.hb[data-cont]{cursor:pointer; border-left-style:dashed}
.hb-rz{position:absolute; top:0; bottom:0; right:0; width:9px; cursor:ew-resize}
.hnow{position:absolute; top:0; bottom:0; width:0; border-left:1.5px solid var(--ot); z-index:5; pointer-events:none}
.hghost{display:flex; flex-direction:column; justify-content:center; white-space:nowrap}
@media (max-width:900px){ .hgrid{--hw:64px; --lab:132px} .hl{padding:8px 10px} }

/* ---------- lịch nhỏ chọn ngày ---------- */
.mc-h{display:flex; align-items:center; gap:2px; padding:0 1px 5px}
.mc-h b{flex:1; font-size:12.5px; font-weight:600; letter-spacing:-.01em}
.mc-h button{width:23px; height:23px; border-radius:7px; display:grid; place-items:center; color:var(--muted)}
.mc-h button:hover{background:var(--surface-3); color:var(--ink)}
.mc-h svg{width:13px; height:13px; stroke-width:2; fill:none; stroke:currentColor}
.mc-g{display:grid; grid-template-columns:repeat(7,1fr); gap:1px}
.mc-g i{
  font-style:normal; font-family:var(--mono); font-size:9px; color:var(--muted);
  text-align:center; padding-bottom:3px; letter-spacing:.04em;
}
.mc-g button{
  height:25px; border-radius:8px; font-size:11.5px; font-variant-numeric:tabular-nums;
  color:var(--ink-2); position:relative; display:grid; place-items:center;
}
.mc-g button:hover{background:var(--surface-3)}
.mc-g button.out{color:var(--muted); opacity:.42}
.mc-g button.has::after{
  content:""; position:absolute; bottom:3px; width:3px; height:3px; border-radius:50%; background:var(--accent);
}
.mc-g button.sel{background:var(--accent-soft); color:var(--accent-ink); font-weight:600}
.mc-g button.today{background:var(--accent); color:#fff; font-weight:600}
.mc-g button.today.has::after{background:#fff}
.mc-g button.hol{color:var(--ot); font-weight:600}
.mc-g button.today.hol{color:#fff}
.mhol{font-size:10.5px; color:var(--ot); font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding-left:2px}
.mc-tip{margin:9px 1px 0; font-size:11px; line-height:1.5; color:var(--muted)}

.demo-bar{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:9px 22px; background:var(--accent-soft);
  border-bottom:1px solid var(--accent-line); color:var(--accent-ink); font-size:12.5px;
}
.demo-bar .spacer{flex:1}
.inline-add{display:flex; gap:6px; flex-wrap:wrap; margin-top:7px}
.inline-add input,.inline-add select{
  padding:7px 10px; border-radius:var(--r-sm); border:1px solid var(--accent-line);
  background:var(--surface); font-size:13.5px; min-width:0; flex:1 1 120px; width:auto;
}
.inline-add select{flex:0 0 132px}
.inline-add input.rate{flex:0 0 118px}
.inline-add .btn{flex:0 0 auto}

/* ---------- month grid ---------- */
.mgrid{
  display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); border-top:1px solid var(--grid);
  flex:1; min-height:0; overflow-y:auto; align-content:start;
}
.mhead{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); background:var(--surface)}
.mhead div{padding:7px 10px; font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); border-right:1px solid var(--grid)}
.mhead div:last-child{border-right:none}
.mcell{
  border-right:1px solid var(--grid); border-bottom:1px solid var(--grid);
  min-height:118px; padding:5px 6px 7px; display:flex; flex-direction:column; gap:3px;
  background:var(--surface);
}
.mcell:nth-child(7n){border-right:none}
.mcell.out{background:var(--surface-2)}
.mcell.out .mnum{color:var(--muted); opacity:.6}
.mtop{display:flex; align-items:center; justify-content:space-between; gap:4px; min-height:22px}
.mnum{
  font-size:12.5px; font-weight:600; font-variant-numeric:tabular-nums;
  width:22px; height:22px; border-radius:50%; display:grid; place-items:center;
}
.mcell.today .mnum{background:var(--accent); color:#fff}
.mtop .mh{font-family:var(--mono); font-size:10px; color:var(--accent-ink)}
.mchip{
  display:flex; align-items:center; gap:5px; padding:2.5px 6px; border-radius:6px;
  background:var(--surface-2); text-align:left; width:100%; font-size:11.5px;
  border-left:3px solid var(--c,var(--accent)); overflow:hidden;
}
.mchip:hover{background:var(--surface-3)}
.mchip b{font-family:var(--mono); font-size:10.5px; font-weight:500; color:var(--muted); flex:0 0 auto}
.mchip span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:500}
.mchip.ot{background:var(--ot-soft); border-left-color:var(--ot)}
.mchip.ot span,.mchip.ot b{color:var(--ot)}
.mmore{font-size:11px; color:var(--muted); text-align:left; padding-left:6px}
.mmore:hover{color:var(--accent-ink)}

/* ---------- cards & tiles ---------- */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow-1)}
.card-h{display:flex; align-items:center; gap:10px; padding:15px 18px 0}
.card-h h2{font-size:15px; font-weight:600}
.card-h .spacer{flex:1}
.card-b{padding:15px 18px 18px}
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(148px,1fr)); gap:12px}
.tile{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:13px 15px 14px; display:flex; flex-direction:column; gap:3px;
}
.tile .v{font-family:var(--mono); font-size:25px; font-weight:700; letter-spacing:-.03em; line-height:1.15}
.tile .u{font-size:13px; font-weight:500; color:var(--muted)}
.tile.hero{background:var(--accent-soft); border-color:var(--accent-line)}
.tile.hero .v{color:var(--accent-ink)}
.tile.warn{background:var(--ot-soft); border-color:var(--ot-line)}
.tile.warn .v{color:var(--ot)}
.tile .sub{font-size:11.5px; color:var(--muted)}

table{width:100%; border-collapse:collapse}
.tbl-wrap{overflow-x:auto; border-radius:var(--r); border:1px solid var(--line)}
th{
  text-align:left; padding:9px 12px; font-family:var(--mono); font-size:10px;
  letter-spacing:.11em; text-transform:uppercase; color:var(--muted);
  background:var(--surface-2); border-bottom:1px solid var(--line); white-space:nowrap; font-weight:500;
}
td{padding:10px 12px; border-bottom:1px solid var(--line); font-size:13.5px; vertical-align:top}
tr:last-child td{border-bottom:none}
td.r,th.r{text-align:right}
tfoot td{background:var(--surface-2); font-weight:600; border-bottom:none}
.money{font-family:var(--mono); font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1; font-weight:500; white-space:nowrap}
.money.big{font-weight:700; color:var(--accent-ink)}

.pill{
  display:inline-flex; align-items:center; gap:4px; padding:1.5px 8px; border-radius:999px;
  font-size:11px; font-weight:500; background:var(--surface-2); color:var(--ink-2);
  border:1px solid var(--line);
}
.pill.ot{background:var(--ot-soft); color:var(--ot); border-color:var(--ot-line)}
.pill.ok{background:var(--ok-soft); color:var(--ok); border-color:transparent}
.pill.live{background:var(--accent-soft); color:var(--accent-ink); border-color:var(--accent-line)}
.pill .dot{width:6px; height:6px; border-radius:50%; background:currentColor}
.swatch{width:10px; height:10px; border-radius:4px; display:inline-block; flex:0 0 10px}

.bars{display:flex; flex-direction:column; gap:9px}
.bar-row{display:grid; grid-template-columns:1fr 60px; gap:10px; align-items:center}
.bar-row .nm{display:flex; align-items:center; gap:7px; font-size:13px; min-width:0}
.bar-row .nm span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.bar{height:7px; border-radius:999px; background:var(--surface-3); overflow:hidden; margin-top:5px}
.bar i{display:block; height:100%; border-radius:999px; background:var(--c,var(--accent))}
.bar-row .vv{font-family:var(--mono); font-size:12px; text-align:right; color:var(--ink-2)}

/* ---------- tách giờ tăng ca & giờ đêm ---------- */
.no-co{color:var(--muted); font-family:var(--sans); font-style:italic; font-size:12px}
.pay-head .card-b{display:flex; flex-direction:column; gap:4px}
.pay-period{font-size:15px; font-weight:600}
.pay-total{font-size:34px; font-weight:700; letter-spacing:-.03em; color:var(--accent-ink); line-height:1.1}
.pay-sub{font-size:12.5px; color:var(--muted)}
.card.fold > summary{list-style:none; cursor:pointer; padding-bottom:15px; border-radius:var(--r-lg)}
.card.fold > summary::-webkit-details-marker{display:none}
.card.fold > summary:hover{background:var(--surface-2)}
.card.fold[open] > summary{padding-bottom:0; border-radius:var(--r-lg) var(--r-lg) 0 0}
.card.fold[open] > summary:hover{background:none}
.card.fold[open] .stage-chev{transform:rotate(90deg)}
.ts-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column}
.ts-list li{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:8px 2px; border-bottom:1px solid var(--line); font-size:13px}
.ts-list li:last-child{border-bottom:none}
.split.leave{border-top-color:#2E9E8F}
.split.leave .v{color:#2E9E8F}
.split-bar i.leave,.split-legend i.leave{background:#2E9E8F}
.split-tiles{display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:10px}
.split{border:1px solid var(--line); border-radius:var(--r); padding:11px 13px 12px; display:flex; flex-direction:column; gap:2px; border-top:3px solid var(--line-2)}
.split .v{font-size:21px; font-weight:700; letter-spacing:-.02em; line-height:1.2}
.split .m{font-size:13px; color:var(--ink-2)}
.split .sub{font-size:11px; color:var(--muted)}
.split.ot{border-top-color:var(--ot)}
.split.ot .v{color:var(--ot)}
.split.night{border-top-color:#6E7BE8}
.split.night .v{color:#6E7BE8}
.split.zero .v,.split.zero .m{color:var(--muted)}
.split-bar{display:flex; height:10px; border-radius:999px; overflow:hidden; background:var(--surface-3); gap:2px}
.split-bar i,.split-legend i{display:block; height:100%; background:var(--line-2)}
.split-bar i.ot,.split-legend i.ot{background:var(--ot)}
.split-bar i.week,.split-legend i.week{background:#E08A2E}
.split-bar i.hol,.split-legend i.hol{background:#C2554F}
.split-legend i.night{background:#6E7BE8}
.split-bar i.base,.split-legend i.base{background:var(--accent)}
.split-legend{display:flex; flex-wrap:wrap; gap:6px 16px; font-size:12px; color:var(--ink-2)}
.split-legend span{display:inline-flex; align-items:center; gap:6px}
.split-legend i{width:9px; height:9px; border-radius:3px}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .split.night .v{color:#9AA4F2} }
:root[data-theme="dark"] .split.night .v{color:#9AA4F2}

/* ---------- day list ---------- */
.daylist{display:flex; flex-direction:column}
.drow{
  display:grid; grid-template-columns:96px 1fr auto; gap:14px; align-items:start;
  padding:12px 4px; border-bottom:1px solid var(--line); text-align:left; width:100%;
}
.drow:last-child{border-bottom:none}
.drow:hover{background:var(--surface-2)}
.drow .time{font-family:var(--mono); font-size:12px; color:var(--ink-2); padding-top:1px}
.drow .time b{display:block; font-weight:500; color:var(--ink)}
.drow .time i{font-style:normal; color:var(--muted)}
.drow .body{min-width:0; display:flex; flex-direction:column; gap:3px}
.drow .body .tt{font-size:14px; font-weight:600; display:flex; align-items:center; gap:7px; flex-wrap:wrap}
.drow .body .meta{font-size:12.5px; color:var(--muted); display:flex; gap:7px; flex-wrap:wrap; align-items:center}
.drow .body .note{font-size:12.5px; color:var(--ot)}
.drow .dur{font-family:var(--mono); font-size:13px; font-weight:500; white-space:nowrap; padding-top:1px}
.drow.ot .dur{color:var(--ot)}
/* việc trong ca */
.tk-modal{gap:11px}
.tk-modal .row,.tk-modal .row3{gap:10px}
.tk-quick button{padding:3px 10px; font-size:12px}
.tk-modal .t-sum{padding:9px 12px; gap:6px}
.tk-modal .sum-row b{font-size:14.5px}
.tk-modal .hint-note{padding:6px 11px; font-size:12px}
.crew{display:flex; flex-direction:column; gap:10px}
.crew-w{border:1px solid var(--line); border-radius:var(--r-sm); padding:8px 10px; background:var(--surface-2)}
.crew-h{display:flex; align-items:center; gap:6px; margin-bottom:6px}
.crew-h select{flex:1; min-width:0; padding:6px 9px; border-radius:var(--r-xs); border:1px solid var(--line-2); background:var(--surface); font-size:13.5px; font-weight:600}
.crew-tasks > summary{display:flex; align-items:center; gap:7px; cursor:pointer; list-style:none; font-size:13px; color:var(--ink-2)}
.crew-tasks > summary::-webkit-details-marker{display:none}
.crew-tasks[open] > summary{margin-bottom:7px}
.crew-tasks[open] .stage-chev{transform:rotate(90deg)}
.crew-tasks .tk-add{width:20px; height:20px; font-size:14px}
.tk-who{font-size:11.5px; font-weight:600; color:var(--accent-ink); margin:6px 0 2px}
.tk-tasks{border:1px solid var(--line); border-radius:var(--r); padding:10px 12px}
.tk-tasks > summary{display:flex; align-items:center; gap:8px; cursor:pointer; list-style:none; font-size:14px}
.tk-tasks > summary::-webkit-details-marker{display:none}
.tk-tasks[open] > summary{margin-bottom:10px}
.tk-tasks[open] .stage-chev{transform:rotate(90deg)}
.tk-add{
  width:22px; height:22px; border-radius:50%; background:var(--accent); color:#fff;

<script>
/* ============================== tiện ích ============================== */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const DOW = ["CN", "T2", "T3", "T4", "T5", "T6", "T7"];
const DOW_LONG = ["Chủ nhật", "Thứ hai", "Thứ ba", "Thứ tư", "Thứ năm", "Thứ sáu", "Thứ bảy"];
const PALETTE = ["#2563EB", "#6E7BE8", "#2E9E8F", "#E08A2E", "#8A5BD6", "#3F8FD9", "#C2554F", "#4E9B4E"];

const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const startOfWeek = d => addDays(d, -((d.getDay() + 6) % 7));            // tuần bắt đầu thứ hai
const startOfMonth = d => new Date(d.getFullYear(), d.getMonth(), 1);
const endOfMonth = d => new Date(d.getFullYear(), d.getMonth() + 1, 0);
const sameDay = (a, b) => iso(a) === iso(b);
const toMin = t => { const [h, m] = String(t || "0:0").split(":").map(Number); return (h || 0) * 60 + (m || 0); };
const fromMin = m => `${pad(Math.floor(m / 60) % 24)}:${pad(m % 60)}`;
const dur = t => { let a = toMin(t.start), b = toMin(t.end); if (b <= a) b += 1440; return (b - a) / 60; };
const fmtH = h => (Math.round(h * 100) / 100).toString().replace(/\.0+$/, "") + "h";
const vnd = n => new Intl.NumberFormat("vi-VN", { maximumFractionDigits: 0 }).format(Math.round(n || 0)) + " ₫";
const dateVN = d => `${DOW_LONG[d.getDay()]}, ${d.getDate()}/${d.getMonth() + 1}/${d.getFullYear()}`;
const shortVN = d => `${d.getDate()}/${d.getMonth() + 1}`;

/* ============================== trạng thái ============================== */
const LS = "cakip.v1";
const state = {
  companies: [], people: [], clients: [], tasks: [], holidays: [], glossary: [],
  loanCases: [], loanRules: [], loanConfig: [], loanTab: "cases", loanOpen: null, ruleQ: "", colMenu: null,
  view: "cal", calMode: "week", orient: "v", lang: "en",
  cursor: new Date(), miniCursor: null,
  me: null,
  hideCo: new Set(), hidePe: new Set(), client: "",
  pay: { kind: "month", n: 1, anchor: iso(new Date()), from: "", to: "", group: "person", company: "", person: "" },
};
let db = null, remote = false;

const co = id => state.companies.find(c => c.id === id);
const pe = id => state.people.find(p => p.id === id);
const cl = id => state.clients.find(c => c.id === id);
const coName = id => (co(id) || {}).name || "Chưa gán công ty";
const coColor = id => (co(id) || {}).color || "#7C8B9E";
const peName = id => (pe(id) || {}).name || "Chưa gán người";

function visible(t) {
  if (state.hideCo.has(t.companyId)) return false;
  if (state.hidePe.has(t.personId)) return false;
  if (state.client && !taskClients(t).includes(state.client)) return false;
  return true;
}
const tasksOn = (d, all) => state.tasks
  .filter(t => t.date === iso(d) && (all || visible(t)))
  .sort((a, b) => toMin(a.start) - toMin(b.start));

/* Một khối trên lịch là một ca của công ty. Trong ca có nhiều việc, mỗi việc có
   khách hàng riêng và tự đánh dấu xong hay chưa. Nhiệm vụ kiểu cũ (một tên, một
   khách) vẫn đọc được: nó thành một việc duy nhất trong ca. */
function taskItems(t) {
  if (Array.isArray(t.crew) && t.crew.length) return t.crew.flatMap(w => (w.items || []).map(x => ({ id: x.id || uid(), text: x.text || "", clientId: x.clientId || "", done: !!x.done })));
  if (Array.isArray(t.items)) return t.items.map(x => ({ id: x.id || uid(), text: x.text || "", clientId: x.clientId || "", done: !!x.done }));
  const text = [t.title, t.desc].map(x => (x || "").trim()).filter(x => x && x !== "Nhiệm vụ").join(" — ");
  return text || t.clientId ? [{ id: "i0", text: text || "Việc", clientId: t.clientId || "", done: !!t.done }] : [];
}
// Một ca có thể có nhiều người làm. Mỗi người giữ danh sách việc riêng.
// Ca kiểu cũ (một người, một danh sách) vẫn đọc được: thành người làm đầu tiên.
function taskCrew(t) {
  if (Array.isArray(t.crew) && t.crew.length) {
    return t.crew.map((w, i) => ({ id: w.id || "w" + i, personId: w.personId || "", items: (w.items || []).map(x => ({ id: x.id || uid(), text: x.text || "", clientId: x.clientId || "", done: !!x.done })) }));
  }
  return [{ id: "w0", personId: t.personId || "", items: taskItems(t) }];
}
const crewPeople = t => taskCrew(t).map(w => w.personId).filter(Boolean);
const worksHere = (t, pid) => !pid || crewPeople(t).includes(pid) || (t.personId || "") === pid;
const taskDone = t => { const it = taskItems(t); return it.length ? it.every(x => x.done) : !!t.done; };
const taskClients = t => [...new Set(taskItems(t).map(x => x.clientId).filter(Boolean))];
const taskSummary = t => taskItems(t).map(x => x.text || "Việc").join(" · ");
// Tên hiện trên khối lịch là tên công ty, việc chi tiết nằm trong ca.
const taskLabel = t => coName(t.companyId);

function statusOf(t) {
  if (taskDone(t)) return { k: "done", label: "Hoàn thành", cls: "ok" };
  const now = new Date(), day = parseISO(t.date);
  const s = new Date(day); s.setMinutes(toMin(t.start));
  const e = new Date(day); e.setMinutes(toMin(t.end) <= toMin(t.start) ? toMin(t.end) + 1440 : toMin(t.end));
  if (now >= s && now <= e) return { k: "live", label: "Đang làm", cls: "live" };
  if (now > e) return { k: "past", label: "Chưa đánh dấu xong", cls: "" };
  return { k: "next", label: "Sắp làm", cls: "" };
}

// quiet: lưu mà không vẽ lại cả trang, dùng khi đang sửa trong ô để không mất con trỏ.
function put(coll, obj, quiet) {
  if (!obj.id) obj.id = uid();
  const arr = state[coll], i = arr.findIndex(x => x.id === obj.id);
  if (i >= 0) arr[i] = obj; else arr.push(obj);
  if (!quiet) render();
  if (remote) { const { id, ...body } = obj; db.collection(coll).doc(id).set(body).catch(dbErr); }
  else saveLocal();
  return obj;
}
function drop(coll, id) {

  render();
  if (remote) db.collection(coll).doc(id).delete().catch(dbErr);
  else saveLocal();
}
function dbErr(e) {
  const msg = e && e.code === "quota_exceeded"
    ? "Kho dữ liệu đã đầy. Xoá bớt nhiệm vụ cũ rồi lưu lại."
    : "Chưa lưu được lên máy chủ. Thay đổi vẫn giữ trên máy này.";

async function initStore() {
