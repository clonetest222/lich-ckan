        <div style="display:flex;gap:10px;padding:14px 22px;border-top:1px solid var(--line)">
          <button type="button" data-no style="${ASKBTN}background:var(--surface);border-color:var(--line-2);color:var(--ink-2)">Huỷ</button>
          <button type="button" data-yes style="${ASKBTN}background:var(--accent);border-color:var(--accent);color:#fff">${esc(okLabel)}</button>
        </div>
      </div></div>`;
    document.body.appendChild(host);
    const inp = host.querySelector("[data-in]");
    const done = v => { host.remove(); document.removeEventListener("keydown", onKey); resolve(v); };
    function onKey(e) { if (e.key === "Escape") done(""); }
    document.addEventListener("keydown", onKey);
    host.querySelector("[data-no]").onclick = () => done("");
    host.querySelector("[data-yes]").onclick = () => done(inp.value.trim());
    inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); done(inp.value.trim()); } });
    setTimeout(() => inp.focus(), 30);
  });
}

/* ---- xem nhanh việc của một người / công ty / khách hàng ---- */
function openPeek(kind, id) {
  state.peek = [kind, id];
  const d = state.cursor;
  const name = kind === "person" ? peName(id) : kind === "company" ? coName(id) : (cl(id) || {}).name || "Khách hàng";
  const mine = kind === "client" ? (t => taskClients(t).includes(id))
    : kind === "person" ? (t => worksHere(t, id)) : (t => (t.companyId || "") === id);
  const day = state.tasks.filter(t => mine(t) && t.date === iso(d)).sort((a, b) => toMin(a.start) - toMin(b.start));
  const { from, to } = payRange();
  const period = state.tasks.filter(t => mine(t) && t.date >= iso(from) && t.date <= iso(to));
  // Hồ sơ khách: liệt kê từng việc của khách đó trong kỳ, kèm ngày và ca.
  const jobs = kind !== "client" ? [] : period
    .flatMap(t => taskItems(t).filter(x => x.clientId === id).map(x => ({ t, x })))
    .sort((a, b) => a.t.date.localeCompare(b.t.date) || toMin(a.t.start) - toMin(b.t.start));
  const h = day.reduce((s, t) => s + dur(t), 0);
  const ph = period.reduce((s, t) => s + dur(t), 0);
  const pm = period.reduce((s, t) => s + payOf(t).amount, 0);
  $("#modalHost").innerHTML = `
  <div class="scrim" id="scrim"><div class="modal" style="width:min(660px,100%)" role="dialog" aria-modal="true">
    <div class="modal-h"><h2>${esc(name)}</h2><div class="spacer" style="flex:1"></div>
      <button class="btn icon ghost" id="mCancel" aria-label="Đóng"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="modal-b">
      <div class="tiles">
        <div class="tile hero"><div class="lbl">Giờ trong ngày</div><div class="v">${fmtH(h)}</div><div class="sub">${dateVN(d)}</div></div>
        <div class="tile"><div class="lbl">Giờ trong kỳ</div><div class="v">${fmtH(ph)}</div><div class="sub">${period.length} nhiệm vụ</div></div>
        <div class="tile"><div class="lbl">Thù lao kỳ</div><div class="v" style="font-size:18px">${vnd(pm)}</div><div class="sub">Theo kỳ đang chọn</div></div>
      </div>
      ${kind === "client" ? `<div>
        <div class="lbl" style="margin-bottom:6px">Việc của khách trong kỳ · ${jobs.filter(j => j.x.done).length}/${jobs.length} đã xong</div>
        ${jobs.length ? `<ul class="d-items">${jobs.map(j => `<li>
          <button type="button" class="it-done ${j.x.done ? "on" : ""}" data-toggleitem="${j.t.id}|${j.x.id}" aria-pressed="${j.x.done}"
            title="${j.x.done ? "Đã xong" : "Chưa xong"}">${j.x.done ? "✓" : ""}</button>
          <span translate="no" class="it-t ${j.x.done ? "got" : ""}">${esc(j.x.text || "Việc")}</span>
          <span style="font-family:var(--mono);font-size:11.5px;color:var(--muted)">${shortVN(parseISO(j.t.date))} · ${j.t.start}–${j.t.end} · ${esc(coName(j.t.companyId))}</span>
        </li>`).join("")}</ul>` : `<div class="empty"><b>Khách này chưa có việc nào trong kỳ.</b>Đổi kỳ ở màn hình Kỳ tính lương.</div>`}
      </div>` : ""}
      <div>
        <div class="lbl" style="margin-bottom:6px">${kind === "client" ? "Ca làm" : "Nhiệm vụ"} ngày ${shortVN(d)}</div>
        ${day.length ? `<div class="daylist">${day.map(rowHTML).join("")}</div>`
      : `<div class="empty"><b>Không có nhiệm vụ nào trong ngày này.</b>Đổi ngày ở màn hình Lịch rồi mở lại.</div>`}
      </div>
    </div>
    <div class="modal-f"><span></span><button class="btn primary" id="mClose2">Đóng</button></div>
  </div></div>`;
  const close = () => { $("#modalHost").innerHTML = ""; };
  $("#mCancel").onclick = close; $("#mClose2").onclick = close;
  $("#scrim").onclick = e => { if (e.target.id === "scrim") close(); };
}

  if (t === "loan" || t === "master" || t === "rules") {
    // ô đang gõ trong khung hồ sơ sẽ chặn việc vẽ lại, nên trả con trỏ ra trước
    const a = document.activeElement; if (a && a !== document.body && a.blur) a.blur();
    state.loanPage = t;
    state.loanTab = t === "rules" ? (state.loanTab === "fields" ? "fields" : "rules") : "cases";
    setView("loan");
    return;
  }
  setView(t === "cal" ? (state.calSub || "cal") : t);
};

document.addEventListener("click", e => {
  if (swallowClick) { swallowClick = false; return; }   // vừa kéo xong, bỏ qua cú click theo sau

  if (loanClick(e)) return;

  const hy = e.target.closest("[data-holyear]");
  if (hy) { state.holYear = holYear() + Number(hy.dataset.holyear); render(); return; }

  const go = e.target.closest("[data-go]");
  if (go) {
    state.cursor = parseISO(go.dataset.go);
    state.miniCursor = startOfMonth(state.cursor);
    if (state.view === "cal" && state.calMode === "month") state.calMode = "day";
    savePrefs(); render(); return;
  }
  const mc = e.target.closest("[data-mc]");
  if (mc) {
    const b = startOfMonth(state.miniCursor || state.cursor);
    state.miniCursor = new Date(b.getFullYear(), b.getMonth() + Number(mc.dataset.mc), 1);
    renderMiniCal(); return;
  }

  const oc = e.target.closest("[data-opencase], [data-newcase]");
  if (oc) {
    const tid = oc.dataset.opencase;
    if (!tid) {
      const cid = oc.dataset.newcase, sl = loanSchema().slots[0];
      const k = put("loanCases", {
        createdAt: new Date().toISOString(), clientId: cid, values: {}, received: {},
        people: sl ? { [sl.id]: { name: (cl(cid) || {}).name || "", values: {} } } : {},
      }, true);
      if (cl(cid) && !cl(cid).caseId) put("clients", Object.assign({}, cl(cid), { caseId: k.id }), true);
      state.loanOpen = k.id;
    } else state.loanOpen = tid;
    $("#modalHost").innerHTML = "";
    state.loanTab = "cases"; state.loanPage = "loan"; setView("loan"); $("#view-loan").scrollTop = 0;
    return;
  }
  const ti = e.target.closest("[data-toggleitem]");
  if (ti) {
    const [tid, iid] = ti.dataset.toggleitem.split("|");
    const t0 = state.tasks.find(x => x.id === tid);
    if (t0) setItemDone(tid, iid, !taskItems(t0).concat(taskCrew(t0).flatMap(w => w.items)).some(x => x.id === iid && x.done));
    return;
  }
  const ev = e.target.closest("[data-task]");
  if (ev) { const t = state.tasks.find(x => x.id === ev.dataset.task); if (t) openTask(Object.assign({}, t)); return; }
  const slot = e.target.closest(".slot");
  if (slot) {
    const date = slot.closest(".daycol").dataset.date, m = Number(slot.dataset.min);
    openTask({ date, start: fromMin(m), end: fromMin(m + 60), personId: state.me });
    return;
  }
  const more = e.target.closest("[data-day]");
  if (more) { state.cursor = parseISO(more.dataset.day); state.calMode = "week"; savePrefs(); render(); return; }
  const cell = e.target.closest(".mcell");
  if (cell && state.view === "cal" && state.calMode === "month" && !e.target.closest("button")) {
    pending = null; clearGhost();
    openQuick({ date: cell.dataset.date, start: "09:00", end: "17:00" }, cell.getBoundingClientRect());
    return;
  }
  const peek = e.target.closest("[data-peek]");
  if (peek) { const [k, id] = peek.dataset.peek.split(":"); openPeek(k, id); return; }

  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.editco) openCompany(Object.assign({}, co(b.dataset.editco)));
  if (b.dataset.delco) {
    const id = b.dataset.delco;
    askConfirm("Xoá công ty " + coName(id), "Nhiệm vụ cũ của công ty này vẫn còn nhưng mất phần gán công ty, nên không tính ra tiền nữa.", "Xoá công ty")
      .then(ok => { if (ok) drop("companies", id); });
  }
  if (b.dataset.editpe) openPerson(Object.assign({}, pe(b.dataset.editpe)));
  if (b.dataset.delpe) {
    const id = b.dataset.delpe;
    askConfirm("Xoá " + peName(id), "Nhiệm vụ đã gán cho người này sẽ không còn tên người làm.", "Xoá người")
      .then(ok => { if (ok) drop("people", id); });
  }
  if (b.dataset.delhol) {
    const h = state.holidays.find(x => x.id === b.dataset.delhol);
    askConfirm("Xoá ngày lễ", `Bỏ ${h ? h.name : "ngày này"} khỏi danh sách? Nhiệm vụ hôm đó sẽ tính lại như ngày thường.`, "Xoá ngày lễ")
      .then(ok => { if (ok) drop("holidays", b.dataset.delhol); });
  }
  if (b.dataset.delcl) {
    const id = b.dataset.delcl;
    askConfirm("Xoá khách hàng", "Nhiệm vụ đã gán khách hàng này sẽ không còn tên khách.", "Xoá khách hàng")
      .then(ok => { if (ok) drop("clients", id); });
  }

  switch (b.id) {
    case "ncAdd": {
      const n = $("#ncName").value.trim(); if (!n) return $("#ncName").focus();
      put("companies", {
        name: n, mode: $("#ncMode").value, rate: Number($("#ncRate").value) || 0,
        ot: Number($("#ncOt").value) || 1.5, hpd: 8, color: PALETTE[state.companies.length % PALETTE.length],
      });
      break;
    }
    case "npAdd": {
      const n = $("#npName").value.trim(); if (!n) return $("#npName").focus();
      put("people", { name: n, color: PALETTE[(state.people.length + 2) % PALETTE.length] });
      break;
    }
    case "nhAdd": {
      const kind = $("#nhKind").value, name = $("#nhName").value.trim() || "Ngày lễ";
      const span = Math.max(1, Math.min(10, Number($("#nhSpan").value) || 1));
      let rule;
      if (kind === "lunar") {
        const ld = Number($("#nhLD").value), lm = Number($("#nhLM").value);
        if (!(ld >= 1 && ld <= 30)) return $("#nhLD").focus();
        if (!(lm >= 1 && lm <= 12)) return $("#nhLM").focus();
        rule = { lunar: `${pad(lm)}-${pad(ld)}`, name, span };
      } else {
        const d = $("#nhDate").value; if (!d) return $("#nhDate").focus();
        rule = kind === "md" ? { md: d.slice(5), name, span } : { date: d, name, span };
      }
      put("holidays", rule);
      break;
    }
    case "nhFill": {
      // Bản cũ điền ngày lễ dương lịch cho riêng một năm: gỡ đi, thay bằng quy tắc hằng năm.
      state.holidays.filter(h => h.date && HOLIDAY_VN.some(r => r.md === h.date.slice(5) && r.name === h.name))
        .forEach(h => drop("holidays", h.id));
      const same = (a, b) => (a.md || "") === (b.md || "") && (a.lunar || "") === (b.lunar || "");
      HOLIDAY_VN.forEach(r => { if (!state.holidays.some(h => same(h, r))) put("holidays", Object.assign({}, r)); });
      break;
    }
    case "nlAdd": {
      const n = $("#nlName").value.trim(); if (!n) return $("#nlName").focus();
      put("clients", { name: n, companyId: $("#nlCo").value || "" });
      break;
    }
    case "pPrev": case "pNext": {
      const dir = b.id === "pNext" ? 1 : -1, p = state.pay, a = parseISO(p.anchor);
      if (p.kind === "week") p.anchor = iso(addDays(a, dir * 7 * Math.max(1, p.n)));
      else if (p.kind === "month") p.anchor = iso(new Date(a.getFullYear(), a.getMonth() + dir * Math.max(1, p.n), 1));
      else if (p.kind === "year") p.anchor = iso(new Date(a.getFullYear() + dir * Math.max(1, p.n), 0, 1));
      savePrefs(); renderPay(); break;
    }
    case "pNow": state.pay.anchor = iso(new Date()); savePrefs(); renderPay(); break;
    case "pOtCopy": {
      const txt = ["Ngày\tGiờ làm\tNgười làm\tCông ty\tLoại\tGiờ nhân hệ số\tPhần trăm\tTiền\tGiờ đêm\tPhụ cấp đêm", otNightText(payrollRows().tasks)].join("\n");
      copyText(txt).then(ok => { b.textContent = ok ? "Đã sao chép" : "Không sao chép được"; setTimeout(() => { b.textContent = "Sao chép chi tiết"; }, 1600); });
      break;
    }
    case "pCopy": {
      const rows = payrollRows().rows;
      const txt = rows.map(r => [peName(r.personId), coName(r.companyId), r.basis, r.days.size,
        fmtH(r.base), fmtH(r.otH), fmtH(r.holH), fmtH(r.night), vnd(r.amount)].join("\t")).join("\n");
      navigator.clipboard && navigator.clipboard.writeText(txt).then(
        () => { b.textContent = "Đã sao chép"; setTimeout(() => { b.textContent = "Sao chép bảng"; }, 1600); },
        () => { b.textContent = "Không sao chép được"; });
      break;
    }
    case "expBtn": {
      const data = JSON.stringify(allData(), null, 2);
      (async () => {
        const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
        if (dl) {
          try { await dl.save({ filename: `ca-kip-${iso(new Date())}.json`, data }); b.textContent = "Đã tải xuống"; }
          catch (err) { b.textContent = "Chưa tải được"; }
        } else {
          try { await navigator.clipboard.writeText(data); b.textContent = "Đã chép vào clipboard"; }
          catch (err) { b.textContent = "Chưa tải được"; }
        }
        setTimeout(() => { b.textContent = "Tải xuống bản sao JSON"; }, 1800);
      })();
      break;
    }
    case "demoWipe": case "demoWipe2":
      askConfirm("Xoá dữ liệu mẫu", "Chỉ xoá những dòng mẫu có sẵn. Công ty, người làm, khách hàng và nhiệm vụ do bạn tự thêm vẫn giữ nguyên.", "Xoá dữ liệu mẫu")
        .then(ok => { if (ok) wipeDemo(); });
      break;
    case "wipeBtn":
      askConfirm("Xoá toàn bộ nhiệm vụ", "Mọi nhiệm vụ trên lịch sẽ mất, không lấy lại được. Công ty, người làm và khách hàng vẫn giữ nguyên.", "Xoá hết nhiệm vụ")
        .then(ok => {
          if (!ok) return;
          const ids = state.tasks.map(t => t.id);
          state.tasks = []; render(); saveLocal();
          if (remote) ids.forEach(id => db.collection("tasks").doc(id).delete().catch(() => { }));
        });
      break;
  }
});

document.addEventListener("change", e => {
  const si = e.target.closest("[data-statusitem]");
  if (si) {
    const [tid, iid] = si.dataset.statusitem.split("|");
    setItemDone(tid, iid, si.value === "1");
    return;
  }
  if (loanChange(e)) return;
  // Kiểu ngày lễ: âm lịch thì nhập ngày và tháng âm, còn lại chọn ngày dương.
  if (e.target.id === "nhKind") {
    const lunar = e.target.value === "lunar";
    $("#nhDate").classList.toggle("hide", lunar);
    $("#nhLD").classList.toggle("hide", !lunar);
    $("#nhLM").classList.toggle("hide", !lunar);
    return;
  }
  // Ô phần trăm trong Thiết lập: nhập 150 thì lưu thành hệ số 1,5.
  if (e.target.classList && e.target.classList.contains("pct")) {
    const c = co(e.target.dataset.co); if (!c) return;
    const v = Math.max(0, Number(e.target.value) || 0) / 100;
    put("companies", Object.assign({}, c, { [e.target.dataset.pct]: v }));
    return;
  }
  const p = state.pay;
  if (e.target.id === "pKind") { p.kind = e.target.value; savePrefs(); renderPay(); }
  if (e.target.id === "pN") { p.n = Math.max(1, Number(e.target.value) || 1); savePrefs(); renderPay(); }
  if (e.target.id === "pAnchor") { p.anchor = e.target.value; savePrefs(); renderPay(); }
  if (e.target.id === "pFrom") { p.from = e.target.value; savePrefs(); renderPay(); }
  if (e.target.id === "pTo") { p.to = e.target.value; savePrefs(); renderPay(); }
  if (e.target.id === "pCompany") { p.company = e.target.value; savePrefs(); renderPay(); }
  if (e.target.id === "pPerson") { p.person = e.target.value; savePrefs(); renderPay(); }
});
document.addEventListener("click", e => {
  const ge = e.target.closest("[data-gedit]");
  if (ge) { state.glossEdit = ge.dataset.gedit; renderGlossary(); const f = $("#gTerm"); if (f) f.focus(); return; }
  const gd = e.target.closest("[data-gdel]");
  if (gd) {
    const g = state.glossary.find(x => x.id === gd.dataset.gdel);
    askConfirm("Xoá mục thuật ngữ", `Xoá "${g ? g.term : ""}" khỏi thuật ngữ? Không lấy lại được.`, "Xoá mục")
      .then(ok => { if (ok) { state.glossEdit = null; drop("glossary", gd.dataset.gdel); } });
    return;
  }
  if (e.target.closest("#glossNew")) {
    const g = put("glossary", { term: "", body: "", createdAt: new Date().toISOString() }, true);
    state.glossEdit = g.id; renderGlossary();
    const f = $("#gTerm"); if (f) f.focus();
    return;
  }
  if (e.target.closest("#gBack")) { state.glossEdit = null; renderGlossary(); return; }
  if (e.target.closest("#glossSort")) { state.glossSort = state.glossSort === "za" ? "az" : "za"; renderGlossary(); return; }
  if (e.target.closest("#gCancel")) {
    const g = state.glossary.find(x => x.id === state.glossEdit);
    if (g && !(g.term || "").trim() && !(g.body || "").trim()) drop("glossary", g.id);
    state.glossEdit = null; renderGlossary();
    return;
  }
  if (e.target.closest("#gSave")) {
    const g = state.glossary.find(x => x.id === state.glossEdit);
    if (g) put("glossary", Object.assign({}, g, { term: $("#gTerm").value.trim(), body: $("#gBody").value.trim() }), true);
    state.glossEdit = null; renderGlossary();
    return;
  }
  const tt = e.target.closest("[data-tasktab]");
  if (tt) { state.taskTab = tt.dataset.tasktab; renderTasks(); return; }
  const to = e.target.closest("[data-taskonly]");
  if (to) { state.taskOnly = to.dataset.taskonly; renderTasks(); return; }
  const g = e.target.closest("#pGroup button[data-g]");
  if (g) { state.pay.group = g.dataset.g; savePrefs(); renderPay(); }
});

document.addEventListener("keydown", e => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || $("#modalHost").children.length || quickEl) return;
  if (e.key === "n") { e.preventDefault(); openTask({ date: iso(state.cursor), personId: state.me }); }
  if (e.key === "t") { state.cursor = new Date(); state.miniCursor = startOfMonth(state.cursor); render(); }
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
  const m = { d: "day", w: "week", m: "month" }[e.key];
  if (m) { setView("cal"); state.calMode = m; savePrefs(); render(); }
});

const MONTH_EN = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const DOW_EN = { "Thứ hai": "Monday", "Thứ ba": "Tuesday", "Thứ tư": "Wednesday", "Thứ năm": "Thursday", "Thứ sáu": "Friday", "Thứ bảy": "Saturday", "Chủ nhật": "Sunday" };
const DOWS_EN = { "T2": "Mon", "T3": "Tue", "T4": "Wed", "T5": "Thu", "T6": "Fri", "T7": "Sat", "CN": "Sun" };
// Đổi tháng và thứ nằm giữa câu, ví dụ "Tháng 9/2026" hay "thứ năm".
function fixParts(x) {
  return x
    .replace(/Tháng (\d{1,2})\/(\d{4})/g, (_, m2, y) => `${MONTH_EN[+m2 - 1]} ${y}`)
    .replace(/Tháng (\d{1,2}) (\d{4})/g, (_, m2, y) => `${MONTH_EN[+m2 - 1]} ${y}`)
    .replace(/(thứ hai|thứ ba|thứ tư|thứ năm|thứ sáu|thứ bảy|chủ nhật)/gi, w => {
      const k = w[0].toUpperCase() + w.slice(1).toLowerCase();
      return (DOW_EN[k] || w).toLowerCase() === (DOW_EN[k] || w) ? DOW_EN[k] || w : DOW_EN[k] || w;
    })
    .replace(/(\d{1,2}) tháng (\d{1,2})/g, (_, d, mo) => `${d} ${MONTH_EN[+mo - 1]}`)
    .replace(/\bngày (\d)/g, "$1");
}
// Dịch một mảnh nằm trong câu: danh sách cách nhau bằng dấu phẩy thì dịch từng mục.
function innerEN(x) {
  if (EN[x] !== undefined) return EN[x];
  if (x.includes(", ")) return x.split(", ").map(innerEN).join(", ");
  const y = toEN(x);
  return y === null ? fixParts(x) : y;
}
const VN_CH = /[àáảãạăằắẳẵặâầấẩẫậèéẻẽẹêềếểễệìíỉĩịòóỏõọôồốổỗộơờớởỡợùúủũụưừứửữựỳýỷỹỵđ]/i;
// Nhãn đứng trước giá trị, ví dụ "Số tiền vay 300.000.000 ₫": lấy nhãn dài nhất có trong từ điển.
function prefixEN(x) {
  if (!VN_CH.test(x)) return x;
  let best = "";
  for (const k in EN) if (k.length > best.length && VN_CH.test(k) && x.startsWith(k + " ")) best = k;
  return best && !VN_CH.test(x.slice(best.length)) ? EN[best] + x.slice(best.length) : x;
}
const pieceEN = x => { const y = toEN(x); return y === null ? prefixEN(x) : y; };
function toEN(txt) {
  const t = txt.trim();
  if (!t) return null;
  if (EN[t] !== undefined) return EN[t];
  if (DOWS_EN[t]) return DOWS_EN[t];
  let m = t.match(/^Tháng (\d{1,2}) (\d{4})$/);
  if (m) return `${MONTH_EN[+m[1] - 1]} ${m[2]}`;
  m = t.match(/^Tháng (\d{1,2})\/(\d{4})$/);
  if (m) return `${MONTH_EN[+m[1] - 1]} ${m[2]}`;
  m = t.match(/^Tháng (\d{1,2}), (\d{4})$/);
  if (m) return `${MONTH_EN[+m[1] - 1]} ${m[2]}`;
  m = t.match(/^(Thứ hai|Thứ ba|Thứ tư|Thứ năm|Thứ sáu|Thứ bảy|Chủ nhật)(, .+)?$/);

    if (g) return fixParts(to.replace(/\$(\d)/g, (_, i) => (g[+i] === undefined ? "" : innerEN(g[+i]))));

  const u = t.replace(/Người vay (\d+)/g, "Applicant $1").replace(/Người bảo lãnh (\d+)/g, "Guarantor $1");

      if (y !== x) changed = true;
      return y;
    }).join("");
    if (changed) return res;
  }
  if (u !== t) return u;

  if (pl !== t) return pl;
  return null;
}
const I18N_ATTRS = ["placeholder", "title", "aria-label", "label"];
// Chữ nằm trong ô soạn thảo là nội dung người dùng gõ hoặc dán, dịch vào đó là sửa mất dữ liệu.
// translate="no" đánh dấu chữ người dùng tự viết (thuật ngữ, định nghĩa, tên việc): hiện đúng như đã gõ.
const userText = node => { const p = node.parentElement; return !!p && (p.tagName === "TEXTAREA" || !!p.closest('[contenteditable],[translate="no"]')); };
let i18nBusy = false;
// Dịch chữ đang hiện trên màn hình. Bản gốc tiếng Việt được giữ lại để bật về được.
function i18nApply(root) {
  if (state.lang !== "en" || i18nBusy) return;
  i18nBusy = true;
  try {
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const todo = [];
  let n;
  while ((n = w.nextNode())) todo.push(n);
  todo.forEach(node => {
    if (node.__vi !== undefined || userText(node)) return;
    const raw = node.nodeValue || "";
    const en = toEN(raw.replace(/\s+/g, " "));
    if (en === null || en === raw.trim()) return;
    node.__vi = raw;
    node.nodeValue = raw.replace(raw.trim(), en);
  });
  const els = root.nodeType === 1 ? [root, ...root.querySelectorAll("*")] : [...root.querySelectorAll("*")];
  els.forEach(el => {
    if (!el.getAttribute) return;
    I18N_ATTRS.forEach(a => {
      const keep = "data-vi-" + a;   // đặt thẳng thuộc tính: khoá dataset không nhận dấu gạch ngang
      const v = el.getAttribute(a);
      if (v == null || el.hasAttribute(keep)) return;
      const en = toEN(v);
      if (en === null || en === v) return;
      el.setAttribute(keep, v);
      el.setAttribute(a, en);
    });
  });
  } finally { i18nBusy = false; }   // có lỗi cũng không kẹt, kẻo mọi lần dịch sau đều bị bỏ qua
}
function i18nRestore() {
  const w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
  let n;
  while ((n = w.nextNode())) if (n.__vi !== undefined) { n.nodeValue = n.__vi; delete n.__vi; }
  $$("*").forEach(el => I18N_ATTRS.forEach(a => {
    const keep = "data-vi-" + a;
    if (el.hasAttribute && el.hasAttribute(keep)) { el.setAttribute(a, el.getAttribute(keep)); el.removeAttribute(keep); }
  }));
}
function setLang(lang) {
  state.lang = lang;
  savePrefs();
  const b = $("#langBtn");
  if (b) b.textContent = lang === "en" ? "VI" : "EN";
  document.documentElement.lang = lang === "en" ? "en" : "vi";
  render();   // vẽ lại để ô cú pháp (có/yes, (trống)/(empty)) theo đúng ngôn ngữ
  if (lang === "en") i18nApply(document.body); else i18nRestore();
}
// Chữ mới do app vẽ ra cũng được dịch ngay.
new MutationObserver(ms => {
  if (state.lang !== "en" || i18nBusy) return;
  ms.forEach(m => m.addedNodes.forEach(node => {
    if (node.nodeType === 1) i18nApply(node);
    else if (node.nodeType === 3 && node.__vi === undefined && !userText(node)) {
      const en = toEN(node.nodeValue || "");
      if (en !== null) { node.__vi = node.nodeValue; node.nodeValue = node.nodeValue.replace(node.nodeValue.trim(), en); }
    }
  }));
}).observe(document.documentElement, { childList: true, subtree: true });

/* ---- khởi động ---- */
(function boot() {
  const cur = document.documentElement.getAttribute("data-theme");
  const dark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  $("#themeTxt").textContent = dark ? "Giao diện tối" : "Giao diện sáng";
  const g = $("#grid");
  g.addEventListener("pointerdown", onDown);
  g.addEventListener("pointermove", onMove);
  g.addEventListener("pointerup", onUp);
  g.addEventListener("pointercancel", onCancel);
  const hw = $("#hWrap");
  hw.addEventListener("pointerdown", hDown);
  hw.addEventListener("pointermove", hMove);
  hw.addEventListener("pointerup", hUp);
  hw.addEventListener("pointercancel", onCancel);
  // Thanh cuộn đã ẩn: khi các hàng vừa màn hình thì lăn chuột dọc để cuộn ngang theo giờ.
  hw.addEventListener("wheel", ev => {
    if (ev.shiftKey || Math.abs(ev.deltaX) > Math.abs(ev.deltaY)) return;
    if (hw.scrollHeight > hw.clientHeight + 1) return;
    hw.scrollLeft += ev.deltaY; ev.preventDefault();
  }, { passive: false });
  $("#orient").onclick = ev => {
    const b = ev.target.closest("button[data-o]"); if (!b) return;
    closeQuick(); state.orient = b.dataset.o; savePrefs(); render();
  };
  g.addEventListener("contextmenu", e => { if (drag) e.preventDefault(); });
  // Chrome khôi phục chỗ cuộn của khung lịch khi tải lại trang: ép về 0h.
  addEventListener("load", () => { if (!drag) g.parentElement.scrollTop = 0; });
  $$("#nav button").forEach(b => b.addEventListener("mouseenter", () => moveGlow(b)));
  $("#nav").addEventListener("mouseleave", glowActive);
  // Chữ trên tab đổi độ rộng khi đổi ngôn ngữ hoặc khi font tải xong: đặt lại vệt kính theo.
  if (window.ResizeObserver) { const ro = new ResizeObserver(() => glowActive()); $$("#nav button").forEach(b => ro.observe(b)); }
  addEventListener("resize", glowActive);
  setView(state.view);   // đồng bộ tab, thanh con và cột lịch ngay khi mở trang
  initStore();
  setInterval(() => {
    if (!drag && state.view === "cal" && state.calMode !== "month") renderCalendar();
  }, 60000);
})();
</script>
